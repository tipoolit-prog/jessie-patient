const PROTOCOLS = usableProtocols([{"schema_version":"1.0","protocol_id":"depression-behavioral-activation","protocol_version":"0.2.0-draft","title":"דיכאון — הפעלה התנהגותית (CBT)","patient_title":"דיכדוך ומצבי רוח משתנים","track":"adult","persona":"jessie","target_population":"מבוגרים עם דיכאון, בליווי מטפל/ת מוסמך/ת","approved_by":"DRAFT — טרם נבדק קלינית","content_status":"draft-needs-clinical-review","sources":["אריאל חן, \"מטפלים בדיכאון\", חוברת העבודה למטופל (צעד צעד, CBT): טפסים 1–9 נקראו לעומק, טפסים 10–14 נקראו ברמת כותרות בלבד","הניסוח, הסדר והדוגמאות נכתבו מחדש; לא הועתק טקסט מהמקור","מודולים \"מה חשוב לי\" ו\"מבט על השבוע\" הם תוספות כלליות שלא מופיעות בטפסים שנקראו"],"patient_overview":{"goal_title":"מה המטרה של הליווי הזה","paragraphs":["הליווי הזה נועד לעזור לכם להשתתף יותר בחיים בתקופה שבה מצב הרוח נמוך: לחזור בהדרגה לדברים שפעם נהניתם מהם או שהיו חשובים לכם, ולקבל בדרך הרגעה ותמיכה.","אנחנו לא מנסים \"לחשוב חיובי\", ולא מבקשים מכם לחכות שיהיה חשק. מתחילים בצעדים קטנים, שאתם בוחרים יחד עם המטפל/ת, ובודקים מה באמת משפיע על איך שאתם מרגישים.","בכל יום יש צ'ק-אין קצר ושאלות קצרות על היום, כשש שאלות בסך הכול, פעם אחת ביום. אתם בוחרים בעצמכם אם בבוקר, בצהריים או בערב, ומתי ג'סי תזכיר לכם.","מה שאתם כותבים נשאר אצלכם, במכשיר. אתם מחליטים מה לשתף עם המטפל/ת.","הליווי הזה לא מתאים כשיש מחשבות על פגיעה עצמית או על מוות, וג'סי לא יכולה לעזור במצבים כאלה. אם יש לכם מחשבות כאלה, פנו עכשיו לעזרה (כפתור \"הערה חשובה!\" זמין בכל מסך) ולמטפל/ת שלכם."],"bring":"אם עולה משהו שחשוב לכם לשתף, אפשר לרשום אותו תחת \"משהו להביא לפגישה\" ולהביא אותו לפגישה."},"therapist_guide":{"goals":["לשבור את מעגל הנסיגה וההימנעות: פחות פעולה מביאה מצב רוח נמוך יותר, ומצב רוח נמוך מביא עוד פחות פעולה","להגדיל בהדרגה פעילות מתוכננת שמתגמלת או משמעותית למטופל/ת, ולפעול לפי כוונה ולא לפי חשק","להקטין עיסוק חוזר במחשבות ולהחזיר קשב לפעילות","לבנות תוכנית להמשך ולזיהוי סימני התדרדרות מוקדמים"],"components":["הסבר על מעגל הנסיגה","זיהוי הימנעויות","יומן יומי של פעילות, הנאה ושליטה","בירור ערכים","תכנון והפעלת פעילויות","סיכום שבועי","מחשבות חוזרות","שינה","מניעת הישנות"],"contraindications":["מחשבות או כוונות אובדניות, או פגיעה עצמית: הליווי אינו מתאים ואינו מיועד למצבים אלה. אין להפעיל אותו עבור מטופל/ת כזה/ת. האפליקציה לא מזהה סיכון ולא מתריעה.","הפרעה דו־קוטבית או חשד לה: הטיפול שונה."],"selection":"מתאים כמרכיב עיקרי כשהדיכאון הוא הבעיה המרכזית ואין סיכון. כשהבעיה העיקרית היא חרדה, טראומה או OCD והדיכאון משני, שקלו להתחיל בהן.","adaptation":["אפשר לדלג על מודולים, להחליף סדר ולהקדים. הרצף המוצע הוא הצעה בלבד.","המטופל/ת בוחר/ת בעצמו/ה מתי ביום למלא (בוקר, צהריים או ערב) ומתי ג'סי תזכיר. אתם ממליצים על שעת התחלה.","בחרו פעילויות לפי מה שחשוב ומרגיע למטופל/ת, ולא לפי רשימה כללית.","שאלו בכל פגישה על מה שהמטופל/ת רשם/ה תחת \"משהו להביא לפגישה\"."],"cautions":["ודאו בכל פגישה, בדרך שנקבעה קלינית, שאין מחשבות אובדניות. אם יש, הפסיקו את השימוש בליווי והעבירו לטיפול מתאים.","פעילות גופנית ותזונה: התאימו לגבולות הבריאותיים של המטופל/ת."]},"progress_metrics":["מספר ימים עם יומן יומי","ממוצע הנאה (0–10) וממוצע שליטה (0–10) בדיווח היומי","מגמת מצב רוח בצ'ק-אין היומי (1–10)","מספר פעילויות מתוכננות שבוצעו"],"coverage_notes":["לא נכללו: ניתוח מטרת ההתנהגות (טופס 9, נקרא רק בתחילתו) ותיקוף האחר והעצמי (טופס 12, כותרת בלבד).","מודול השינה נכתב מעקרונות כלליים. יש לבדוק מקצועית, במיוחד במקרה של נדודי שינה משמעותיים.","מודול המחשבות החוזרות נכתב על סמך הצגת המושג בלבד.","מודולי \"מה חשוב לי\" ו\"מבט על השבוע\" הם תוספות כלליות."],"stages":[{"stage_id":"m1-understand","title":"מה קורה כשמצב הרוח יורד","clinical_title":"הסבר פסיכו־חינוכי: מעגל הנסיגה וההימנעות","purpose":"להבין למה כבדות מובילה לעוד כבדות, ובאיזו נקודה אפשר להתערב.","patient_intro":["לכל אחד יש תקופות שבהן מצב הרוח נמוך, האנרגיה יורדת וקשה להתחיל דברים. זה אנושי, ויש לזה הסבר.","כשאנחנו מרגישים כבדים, טבעי לעשות פחות: לבטל תוכניות, לדחות משימות ולהתרחק קצת מאנשים. בטווח הקצר זה מקל. אבל כשעושים פחות, יש פחות רגעים נעימים, פחות תחושת התקדמות ופחות קשר עם אנשים, ומצב הרוח יורד עוד. כך נוצר מעגל.","אפשר לשבור את המעגל דרך הפעולה. לא צריך לחכות שיהיה חשק. בדרך כלל החשק מגיע אחרי שמתחילים, ולא לפני.","בהמשך נעבור על מה שהצטמצם, נעקוב אחרי היום שלכם, נבחר מה חשוב לכם, ונתכנן צעדים קטנים. הכול בקצב שלכם ובליווי המטפל/ת.","בסוף ההסבר יש כמה שאלות קצרות. אין תשובות נכונות."],"bring_to_session":"אם משהו מההסבר הרגיש מוכר או חשוב, כדאי להביא אותו לפגישה.","therapist_guidance":"הציגו את המעגל על דוגמה אישית מהחיים של המטופל/ת (מה הופסק, ומה קרה אחר כך לרגש ולאנרגיה). בררו אם הדיכאון הוא העיקרי או משני. בדקו מחשבות אובדניות והפרעה דו־קוטבית לפני שמפעילים את הליווי.","session_questions":["איזה דבר הפסקת לעשות לאחרונה, ומה קרה אחר כך?","מה ההקלה שקיבלת כשוויתרת, ומה המחיר שלה?","מה היה קל יותר לעשות אילו היה לך חשק, ומה היית עושה גם בלי חשק?"],"provenance":{"source_forms":[1,2],"origin":"adapted","depth":"full"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"m1-read","type":"read","prompt":"קראתי את ההסבר"},{"task_id":"m1-circle","type":"worksheet","prompt":"דוגמה אחת מהשבוע האחרון","fields":[{"id":"stopped","type":"text","label":"מה דחיתי או הפסקתי לעשות לאחרונה?"},{"id":"before","type":"text","label":"מה הרגשתי לפני שהחלטתי לוותר?"},{"id":"after","type":"text","label":"איזו הקלה קיבלתי, ומה קרה אחר כך למצב הרוח ולאנרגיה?"},{"id":"impact","type":"scale","label":"כמה זה השפיע על מצב הרוח שלי אחר כך"}]}]},{"stage_id":"m2-avoidance","title":"מה הצטמצם בחיים","clinical_title":"זיהוי הימנעויות ונסיגה","purpose":"לראות במדויק מה הצטמצם בחיים, בלי שיפוט.","patient_intro":["כשמצב הרוח נמוך, הצמצום לא תמיד נראה כמו שכיבה במיטה. לפעמים מפסיקים פעילויות ותחביבים, לפעמים עונים פחות להודעות, ולפעמים מתרחקים דרך הסחות כמו גלילה ארוכה במסך, שינה בשעות היום או עבודה בלי הפסקה.","גם הראש יכול להימנע: דוחים החלטות, או חוזרים שוב ושוב על אותן שאלות בלי להגיע לתשובה.","המטרה כאן היא רק להבחין, בלי ביקורת. ברגע שרואים מה הצטמצם, אפשר לבחור מה להחזיר, בצעדים קטנים.","חשוב לזכור: לא עושים את זה מתוך עצלות. זו תגובה מובנת למצב רוח נמוך."],"bring_to_session":"אם עולה משהו כואב או מפתיע ממה שזיהיתם, כדאי להביא אותו לפגישה.","therapist_guidance":"עברו יחד על תחומים: שגרה ותפקוד, פנאי וגוף, קשרים, והימנעות בחשיבה. בררו גם אילו התנהגויות מוגזמות משמשות כהימנעות פעילה (אלכוהול, מסכים, שינה). לא לשפוט.","session_questions":["מה היה חלק מהחיים שלך לפני חצי שנה ועכשיו חסר?","מה אתה/את עושה יותר מבעבר כדי לא להרגיש?","אילו מהדברים שהצטמצמו הכי חשוב לך להחזיר?"],"provenance":{"source_forms":[3],"origin":"adapted","depth":"full"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"m2-read","type":"read","prompt":"קראתי את ההסבר"},{"task_id":"m2-areas","type":"worksheet","prompt":"איפה זה הצטמצם","fields":[{"id":"areas","type":"pick","label":"באילו תחומים אני עושה פחות מבעבר?","options":["שגרה ומשימות בית","תחביבים ופנאי","קשר עם חברים ומשפחה","פעילות גופנית","אכילה ושינה","עבודה או לימודים","טיפוח עצמי","קבלת החלטות"]},{"id":"missed","type":"text","label":"מה אני הכי מתגעגע/ת לעשות?"},{"id":"instead","type":"pick","label":"במה אני מתעסק/ת יותר כדי לא להרגיש?","options":["זמן ארוך מול מסך","שינה בשעות היום","עבודה בלי הפסקה","אכילה לשם הרגעה","חשיבה חוזרת על אותם דברים","משהו אחר"]},{"id":"price","type":"text","label":"מה זה נותן לי ברגע, ומה זה לוקח ממני אחר כך?"}]}]},{"stage_id":"m3-daily","title":"יומן קטן של היום","clinical_title":"ניטור התנהגות: פעילות, הנאה ושליטה","purpose":"לראות באופן אמין איך היום באמת נראה, ואילו פעילויות משפיעות על איך שאני מרגיש/ה.","patient_intro":["כשמצב הרוח נמוך, הזיכרון נוטה לצבוע את היום באפור. יומן קצר נותן תמונה מדויקת יותר.","פעם אחת ביום, בזמן שנוח לכם (בוקר, צהריים או ערב), תרשמו מה עשיתם, ותדרגו מ-0 עד 10 כמה נהניתם וכמה הרגשתם שליטה ויכולת.","יחד עם הצ'ק-אין, זה בערך שש שאלות ביום. אם שכחתם יום, ממשיכים מהיום, בלי לשחזר.","תתייחסו לזה כאל ניסוי: אתם רק אוספים מידע. אחרי כמה ימים נראה ביחד מה עוזר."],"bring_to_session":"אם שמתם לב לפעילות שהרגישה אחרת מהצפוי, כדאי להביא אותה לפגישה.","therapist_guidance":"בפגישה עברו על היומן: אילו פעילויות העלו הנאה או תחושת שליטה, ואילו הורידו. הוא הבסיס לבחירת הפעילויות בהמשך. ציינו שגם מחשבות ושכיבה הם \"התנהגות\" ששווה לרשום. המטופל/ת קובע/ת מתי ביום למלא.","session_questions":["אילו פעילויות העלו הנאה או תחושת שליטה, ואילו הורידו?","מה קורה בימים שבהם לא מילאת?","מה הפתיע אותך ביומן?"],"provenance":{"source_forms":[5,6],"origin":"adapted","depth":"full"},"advance_condition":"5 השלמות רצופות","tasks":[{"task_id":"m3-daily","type":"worksheet","prompt":"היומן של היום","fields":[{"id":"did","type":"text","label":"מה עשיתי היום שאני זוכר/ת? (גם דבר קטן)"},{"id":"pleasure","type":"scale","label":"כמה נהניתי"},{"id":"control","type":"scale","label":"כמה הרגשתי שליטה ויכולת"}]}]},{"stage_id":"m3b-values","title":"מה חשוב לי","clinical_title":"בירור ערכים לקראת תכנון פעילויות","purpose":"לבחור פעילויות שמשמעותיות לי, ולא רק נעימות לרגע.","patient_intro":["פעילות טובה היא לא רק פעילות נעימה. לפעמים היא קשורה למשהו שחשוב לנו: משפחה, חברים, בריאות, יצירה, למידה, טבע או תרומה לאחרים.","כשמתחילים מ\"מה חשוב לי\", קל יותר למצוא צעד קטן שגם שווה את המאמץ.","אין צורך לדעת בדיוק. מספיק לבחור כיוון אחד או שניים ולחשוב על צעד קטן."],"bring_to_session":"אם עלה משהו שחשוב לכם ומרגיש רחוק, כדאי להביא אותו לפגישה.","therapist_guidance":"עזרו למטופל/ת לחבר פעילויות למה שחשוב לו/ה. התאימו למצב האנרגיה.","session_questions":["מה היה חשוב לך שהפסקת להתעסק בו?","איזה צעד קטן אחד יחבר אותך לזה השבוע?"],"provenance":{"source_forms":[],"origin":"new-general-principles","depth":"not-in-source"},"advance_condition":"1 השלמות רצופות","tasks":[{"task_id":"m3b-read","type":"read","prompt":"קראתי את ההסבר"},{"task_id":"m3b-values","type":"worksheet","prompt":"מה חשוב לי","fields":[{"id":"matters","type":"pick","label":"מה חשוב לי, גם אם לא קל לי עכשיו?","options":["משפחה","חברים","בריאות וגוף","יצירה","למידה והתפתחות","עבודה או משימות","טבע","אמונה ורוחניות","תרומה לאחרים","הנאה ומנוחה"]},{"id":"step","type":"text","label":"מה צעד קטן אחד שקשור לזה?","short":true}]}]},{"stage_id":"m4-plan","title":"צעד קטן מתוכנן","clinical_title":"תכנון והפעלה של פעילויות מתגמלות","purpose":"להחזיר לחיים פעילויות קטנות, לפי החלטה ולא לפי החשק של הרגע.","patient_intro":["כאן עוברים מלחכות לחשק לפעול לפי כוונה: מחליטים מראש, ועושים גם אם לא מתחשק. פעמים רבות החשק מגיע אחרי שהתחלנו.","בחרו פעילות אחת קטנה, כזו שאפשר לעשות בקלות, וקבעו לה זמן ומקום. חמש דקות נחשבות.","שלושה סוגי פעילויות מתאימים: דברים שנעים לעשות, דברים שנותנים תחושת סדר והתקדמות (כמו לסדר פינה קטנה), ודברים שקשורים למה שחשוב לכם או לקשר עם אנשים.","אם לא הצלחתם בזמן שקבעתם, אין בעיה. קובעים לזמן אחר וממשיכים. הרעיון הוא להתאמן, ולא לעבור מבחן.","אחרי הפעילות תדרגו איך היה. גם אם היה פחות טוב מהצפוי, זה מידע שימושי."],"bring_to_session":"אם פעילות לא הצליחה או הפתיעה אתכם, כדאי להביא אותה לפגישה.","therapist_guidance":"בנו עם המטופל/ת שלוש-ארבע פעילויות קטנות לשבוע ושלבו שלושה סוגים: הנאה, שגרה והתקדמות, וערכים או קשר. התאימו קושי כדי שהסיכוי להצלחה יהיה גבוה. בפגישה הבאה בדקו מה קרה, ללא ביקורת, והמשיכו מהצעד הבא.","session_questions":["מה ביקשת מעצמך, והאם זה היה גדול מדי?","מה השתנה במצב הרוח אחרי הפעילות, אם בכלל?","מה אפשר לעשות כדי להגדיל את הסיכוי שתבצע/י את הצעד הבא?"],"provenance":{"source_forms":[4,6,7,8],"origin":"adapted","depth":"full"},"advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"m4-read","type":"read","prompt":"קראתי את ההסבר"},{"task_id":"m4-choose","type":"worksheet","prompt":"בחירה וקביעה של פעילות קטנה","fields":[{"id":"kind","type":"pick","label":"איזה סוג פעילות?","options":["משהו נעים","משהו שנותן סדר והתקדמות","משהו שקשור למה שחשוב לי או לקשר עם אנשים"]},{"id":"what","type":"text","label":"מה בדיוק? (למשל: הליכה של עשר דקות, שיחת טלפון, סידור פינה אחת)","short":true},{"id":"when","type":"text","label":"מתי, איפה ועם מי?","short":true},{"id":"likely","type":"scale","label":"כמה סביר שאעשה את זה"}]},{"task_id":"m4-do","type":"worksheet","prompt":"אחרי הפעילות","fields":[{"id":"done","type":"pick","label":"איך היה?","options":["עשיתי כמתוכנן","עשיתי חלק","לא הצלחתי הפעם"]},{"id":"pleasure","type":"scale","label":"כמה נהניתי"},{"id":"control","type":"scale","label":"כמה הרגשתי שליטה ויכולת"},{"id":"note","type":"text","label":"מה שמתי לב? (לא חובה)","short":true}]}]},{"stage_id":"m4b-week","title":"מבט על השבוע","clinical_title":"סיכום שבועי: מה עבד ומה להמשיך","purpose":"ללמוד מהשבוע ולבחור צעד להמשך.","patient_intro":["אחת לשבוע כדאי לעצור ולהסתכל: מה עשיתי, מה היה טוב לי, ומה אפשר לחזור עליו.","זה לא מבחן ולא ציון. זו הזדמנות לראות דפוסים ולבחור צעד קטן לשבוע הבא."],"bring_to_session":"כדאי להביא את הסיכום לפגישה.","therapist_guidance":"עברו עליו בפגישה: מה עבד, מה לא, ומה הצעד הבא. השוו לנתוני הצ'ק-אין והיומן.","session_questions":["מה עבד השבוע?","מה היה קשה ולמה?","מה הצעד הבא שמתאים לך?"],"provenance":{"source_forms":[],"origin":"new-general-principles","depth":"not-in-source"},"advance_condition":"1 השלמות רצופות","tasks":[{"task_id":"m4b-review","type":"worksheet","prompt":"סיכום השבוע","fields":[{"id":"worked","type":"text","label":"מה עזר לי השבוע?"},{"id":"repeat","type":"text","label":"מה כדאי לי לחזור עליו?","short":true},{"id":"hard","type":"text","label":"מה היה קשה?","short":true},{"id":"week_mood","type":"scale","label":"איך היה מצב הרוח שלי בשבוע הזה, בממוצע"},{"id":"next","type":"text","label":"מה הצעד הקטן שלי לשבוע הבא?","short":true}]}]},{"stage_id":"m5-loops","title":"כשהראש חוזר על אותן מחשבות","clinical_title":"עבודה עם מחשבות חוזרות (רומינציה)","purpose":"להבחין בלולאות מחשבה ולהחזיר קשב לפעילות, בלי להילחם במחשבות.","patient_intro":["לפעמים הראש חוזר שוב ושוב על שאלות כמו \"למה זה קורה לי\" או \"מה אם\", בלי להגיע לתשובה. זה מרגיש כמו פתרון בעיה, אבל בדרך כלל זה מעמיק את הכבדות.","אי אפשר לבטל מחשבות בכוח, ואין צורך לברוח מהן. אפשר לשנות את היחס אליהן: להבחין, לדחות ולהחזיר את הקשב לרגע.","בשלב הזה יש כמה דרכים לנסות, ואתם בוחרים מה מתאים לכם: לקבוע למחשבה \"דייט\" בשעה שנוחה לכם, חיבוק פרפר, צליל אחד בכל פעם, מוזיקה נעימה, ותרגיל קטן ומפתיע בשם \"תרגיל ג'סיקה\", ובסופו למצוא את \"הג'סיקה שלכם\".","אין דרך נכונה אחת. מנסים, בודקים מה עוזר, ומביאים לפגישה את מה שעלה."],"bring_to_session":"אם יש נושא שחוזר אצלכם שוב ושוב, כדאי להביא אותו לפגישה.","therapist_guidance":"הבחינו עם המטופל/ת בין חשיבה שמובילה לפעולה לבין לולאה. אל תבקשו \"להפסיק לחשוב\". מומלץ להציג כל תרגיל בפגישה לפני שהמטופל/ת מתרגל/ת לבד. תרגיל ג'סיקה הוא מעבר פתאומי שנועד להוציא מקו המחשבה, והוא נשען על הפתעה: הציגו אותו מראש כתרגיל או כמשחק, ובדקו שהוא מתאים למטופל/ת (למשל, לא כשיש קושי בבוחן מציאות או חשדנות). הרציונל של \"הג'סיקה\": ברגעי הצפה רגשית (בדומה להתקף זעם או בכי אצל ילד) הסחה עדיפה לעיתים על מענה רגשי, כי הראש עסוק בניסיון להבין ויוצא מהסערה. זה אינו תחליף לעיבוד הרגש, ויש לחזור לנושא בפגישה לאחר שההצפה שככה.","session_questions":["על מה הראש חוזר שוב ושוב, ומה הוא מנסה לפתור?","איזו מהשיטות עזרה לך לצאת מהלולאה, ואיזו פחות?","איך הייתה חווית \"הדייט עם המחשבה\", והאם המחשבה חיכתה?","איך הרגשת בתרגיל ג'סיקה, ומה קרה לך כשהצליל לא בא?","מהי ה\"ג'סיקה\" שלך, ובאילו רגעי הצפה תשתמש/י בה? מה נעשה אחר כך עם מה שכאב?"],"provenance":{"source_forms":[10,11],"origin":"new-from-concept","depth":"titles-only"},"advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"m5-read","type":"read","prompt":"קראתי את ההסבר"},{"task_id":"m5-practice","type":"worksheet","prompt":"תרגול קצר: נותנים שם ללולאה","fields":[{"id":"topic","type":"text","label":"על מה הראש חזר היום?","short":true},{"id":"named","type":"pick","label":"מה ניסיתי?","options":["נתתי שם ללולאה","החזרתי קשב לפעילות","דייט עם המחשבה","חיבוק פרפר","צליל אחד בכל פעם","מוזיקה נעימה","תרגיל ג'סיקה"]},{"id":"return","type":"scale","label":"כמה הצלחתי לחזור לפעילות"}]},{"task_id":"m5-date","type":"worksheet","prompt":"דייט עם המחשבה","calendar":{"title":"דייט עם המחשבה","recur":false},"instructions":["במקום לברוח מהמחשבה, מזמינים אותה לפגישה. כשהיא מופיעה, אומרים לה: \"עכשיו לא, נפגש בשעה שקבעתי\". בשעה הזו מקשיבים לה, מקסימום עשר דקות, ואז ממשיכים בחיים."],"fields":[{"id":"thought","type":"text","label":"איזו מחשבה אני מזמין/ה לדייט?","short":true},{"id":"when","type":"time","label":"באיזו שעה היום נפגשים?"},{"id":"until","type":"text","label":"מה אעשה עד אז, כשהיא תקפוץ?","short":true}]},{"task_id":"m5-butterfly","type":"exercise","prompt":"חיבוק פרפר","sequence":[{"kind":"say","text":"שבו או עמדו בנוחות. אפשר לעצום עיניים או להביט נמוך."},{"kind":"say","text":"הצליבו את הזרועות על החזה, כך שכל כף יד נחה על הכתף או על הזרוע העליונה בצד השני. הידיים כמו כנפי פרפר."},{"kind":"say","text":"טפחו בעדינות, פעם ביד אחת ופעם ביד השנייה, לסירוגין ובקצב איטי."},{"kind":"say","text":"נשמו לאט. שימו לב לתחושת המגע בכתפיים ולקצב הטפיחות."},{"kind":"say","text":"המשיכו כדקה עד שתיים. אם המחשבות חוזרות, זה בסדר, חזרו לקצב."},{"kind":"say","text":"פתחו את העיניים לאט, והסתכלו סביבכם. מה אתם שמים לב אליו עכשיו?"}]},{"task_id":"m5-sound","type":"exercise","prompt":"צליל אחד בכל פעם","sequence":[{"kind":"say","text":"הקשיבו לסביבה רגע. בחרו צליל אחד, כמו רעש מרוחק, מאוורר, ציפור או הנשימה שלכם."},{"kind":"say","text":"הקשיבו רק לצליל הזה, כמה שניות. כשהמחשבות מושכות, החזירו את הקשב אליו, בעדינות."},{"kind":"say","text":"עכשיו עברו לצליל אחר. שוב: רק אחד, ורק עכשיו."},{"kind":"say","text":"חזרו על זה עוד פעם או שתיים. אפשר לעשות את זה גם עם מוזיקה: להקשיב כל פעם רק לכלי אחד."}]},{"task_id":"m5-music","type":"worksheet","prompt":"מוזיקה נעימה","instructions":["בחרו שיר או קטע שמרגיעים אתכם. האזינו חמש דקות, ובכל פעם התמקדו רק בצליל אחד: כלי, קול או קצב."],"fields":[{"id":"song","type":"text","label":"איזה שיר או סוג מוזיקה מרגיע אותי?","short":true},{"id":"calm","type":"scale","label":"כמה הרגשתי רגוע/ה אחרי"}]},{"task_id":"m5-jessica","type":"exercise","prompt":"תרגיל ג'סיקה","sequence":[{"kind":"choice","text":"רגע, לפני שממשיכים: אתם זוכרים את ג'סיקה? דיברנו עליה...","options":["אולי התכוונת לג'סי?","לא זוכר/ת"]},{"kind":"say","text":"לא.","label":"מה?"},{"kind":"silence","text":"הקשיבו לצליל הבא:","seconds":6},{"kind":"say","text":"סתם בצחוק 🙂 לפעמים עוצרים לרגע, והראש יוצא מהמסלול שלו."},{"kind":"say","text":"עכשיו, מה אתם שומעים באמת סביבכם?"}]},{"task_id":"m5-why-jessica","type":"exercise","prompt":"למה ג'סיקה עוזרת","sequence":[{"kind":"choice","text":"ראיתם פעם סרטון על הורים שמרגיעים את הילד שלהם, באמצע התקף זעם או בכי, באמירה של המילה \"ג'סיקה\"?","options":["כן, ראיתי","לא ראיתי"]},{"kind":"say","text":"הילד נעצר ומנסה להבין: מי זו ג'סיקה? הוא מחפש בזיכרון, הוא מופתע, ובינתיים הסערה נחלשת."},{"kind":"say","text":"הראש לא יכול להיות גם בסערה וגם בחיפוש אחרי ג'סיקה. הסחה כזו לא פותרת את מה שכואב, והיא לא מחליפה שיחה על הרגש."},{"kind":"say","text":"אבל ברגע של הצפה, רגע של אוויר עוזר. אחר כך, כשהסערה שוככת, אפשר לחזור למה שכאב, ולהביא אותו לפגישה."},{"kind":"say","text":"בואו ננסה למצוא את הג'סיקה שלכם."}]},{"task_id":"m5-my-jessica","type":"worksheet","prompt":"הג'סיקה שלי","instructions":["הג'סיקה היא משהו קטן, מפתיע או מוזר, שמוציא את הראש מהמסלול ברגע של הצפה. זה יכול להיות מילה, שאלה, צליל, תמונה, דמות או משימה קטנה. כדאי שיהיה לכם קל להיזכר בו."],"fields":[{"id":"kind","type":"pick","label":"איזה סוג ג'סיקה מתאים לי?","options":["מילה מפתיעה","שאלה מוזרה לעצמי","צליל או שיר","תמונה או דמות","משימה קטנה וחריגה","משהו אחר"]},{"id":"mine","type":"text","label":"מה הג'סיקה שלי?","short":true},{"id":"when","type":"text","label":"באילו רגעים אשתמש בה?","short":true},{"id":"worked","type":"scale","label":"כמה היא הסיחה אותי (אחרי שניסיתי)"}]}]},{"stage_id":"m6-sleep","title":"שינה ואנרגיה","clinical_title":"שינה: סדר יום ושגרת הרגעה","purpose":"ליצור בסיס יציב יותר של שינה ושעות קבועות.","patient_intro":["שינה ואנרגיה קשורות מאוד. כשהשינה מתפזרת, האנרגיה והריכוז נפגעים, וכך גם מצב הרוח.","שעת קימה קבועה היא אחד הדברים שעוזרים ביותר, גם אחרי לילה לא טוב.","שגרת הרגעה קצרה לפני השינה, בלי מסך מאיר, עוזרת לגוף להבין שהגיע הזמן להאט.","אם יש קושי משמעותי בשינה שנמשך, כדאי לדבר על זה עם המטפל/ת או עם רופא/ה."],"bring_to_session":"אם השינה קשה, כדאי להביא את זה לפגישה.","therapist_guidance":"במקרה של נדודי שינה משמעותיים שקלו התערבות ייעודית ובדיקה רפואית. התאימו שעות למטופל/ת ולמשמרות העבודה שלו/ה.","session_questions":["איך נראית השינה שלך בשבועות האחרונים?","מה אפשר לשנות בשגרת הערב?"],"provenance":{"source_forms":[13],"origin":"new-general-principles","depth":"title-only"},"advance_condition":"4 השלמות רצופות","tasks":[{"task_id":"m6-read","type":"read","prompt":"קראתי את ההסבר"},{"task_id":"m6-routine","type":"worksheet","prompt":"השגרה שלי","fields":[{"id":"wake","type":"text","label":"באיזו שעה אקום מחר?","short":true},{"id":"wind","type":"pick","label":"מה אעשה בעשרים הדקות לפני השינה?","options":["מקלחת","קריאה שקטה","מוזיקה רגועה","מתיחות קלות","שתייה חמה","סידור קטן"]},{"id":"sleep","type":"scale","label":"איך ישנתי הלילה"}]}]},{"stage_id":"m7-keep","title":"להישאר בדרך","clinical_title":"מניעת הישנות ותוכנית המשך","purpose":"לשמור את מה שעבד, ולזהות מוקדם כשמצב הרוח מתחיל לרדת שוב.","patient_intro":["ימים פחות טובים יחזרו מדי פעם. זה חלק מהדרך, ולא סימן שהכול התבטל.","כדאי להכין מראש תוכנית פשוטה: מה הסימנים הראשונים שמצב הרוח יורד, מה עזר לי עד עכשיו, ומי יכול לתמוך בי.","ככל שמזהים מוקדם, קל יותר לחזור לצעדים הקטנים.","בסוף, אפשר לכתוב לעצמכם מכתב קצר לימים קשים. הוא נשאר אצלכם, ואפשר לקרוא אותו מתי שצריך."],"bring_to_session":"כדאי להביא את התוכנית לפגישה ולעדכן אותה יחד.","therapist_guidance":"בנו תוכנית כתובה קצרה עם המטופל/ת: סימנים מוקדמים אישיים, שלושה צעדים שעזרו, איש קשר לתמיכה, ומתי לפנות אליכם או לגורם חירום. קבעו ביקורת המשך. הזכירו שהליווי אינו מתאים כשיש מחשבות אובדניות.","session_questions":["מה הסימן הראשון שלך שמצב הרוח יורד?","מי יכול לעזור לך בימים כאלה?"],"provenance":{"source_forms":[14],"origin":"new-general-principles","depth":"title-only"},"advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"m7-read","type":"read","prompt":"קראתי את ההסבר"},{"task_id":"m7-plan","type":"worksheet","prompt":"התוכנית שלי להמשך","fields":[{"id":"signs","type":"text","label":"מה הסימנים הראשונים אצלי שמצב הרוח יורד?"},{"id":"helped","type":"text","label":"מה עזר לי ושווה להמשיך?"},{"id":"support","type":"text","label":"מי יכול לתמוך בי, ומה אבקש ממנו/ה?","short":true}]},{"task_id":"m7-letter","type":"worksheet","prompt":"מכתב קצר לעצמי לימים קשים","fields":[{"id":"letter","type":"text","label":"מה הייתי רוצה להזכיר לעצמי ביום קשה?"}]}]}],"reinforcement_pool":{"on_complete":["כל הכבוד. צעד קטן הוא צעד אמיתי.","עשית את זה, וזה מה שחשוב.","תודה שהתמדת. זה נחשב."],"on_attempt":["ניסיון הוא התקדמות. תודה שניסית.","גם ניסיון שלא יצא מושלם נחשב."],"on_skip":["בסדר גמור. אפשר לנסות מחר.","לפעמים צריך לדלג. נמשיך כשיהיה נוח."],"on_hard_day":["יש ימים קשים יותר, וזה חלק מהדרך.","תודה שאמרת. היום מספיק להיות עדינים עם עצמנו."]}},{"schema_version":"1.0","protocol_id":"dev-placeholder-exposure","protocol_version":"0.0.1","title":"[DEV] פרוטוקול דמה לפיתוח בלבד","target_population":"בדיקות פיתוח","approved_by":"DEV-PLACEHOLDER — not clinically reviewed","stages":[{"stage_id":"stage-1","title":"שלב בדיקה 1","advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"t1","type":"exercise","prompt":"[DEV] משימת דמה: תאר/י מצב יומיומי קל"},{"task_id":"t2","type":"exercise","prompt":"[DEV] משימת דמה: תרגיל נשימה של דקה"}]}],"reinforcement_pool":{"on_complete":["[DEV] כל הכבוד!"],"on_skip":["[DEV] ננסה שוב מחר."],"on_hard_day":["[DEV] יום קשה הוא חלק מהדרך."],"on_attempt":["[DEV] ניסיון נחשב."]},"track":"adult","persona":"jessie","patient_title":"תרגול לדוגמה"},{"schema_version":"1.0","protocol_id":"ocd-erp","protocol_version":"0.1.0-draft","title":"הפרעה טורדנית־כפייתית (OCD): חשיפה ומניעת תגובה","patient_title":"דאגנות ומחשבות חוזרות","track":"adult","persona":"jessie","target_population":"מבוגרים עם OCD, בליווי מטפל/ת מוסמך/ת","approved_by":"DRAFT — טרם נבדק קלינית","content_status":"draft-needs-clinical-review","sources":["אריאל חן, \"מטפלים בהפרעה טורדנית־כפייתית (OCD)\", חוברת העבודה למטופל (צעד צעד, CBT): טפסים 1–3 נקראו לעומק, טפסים 4–14 נקראו ברמת כותרות בלבד","הניסוח, הסדר והדוגמאות נכתבו מחדש; לא הועתק טקסט מהמקור"],"therapist_guide":{"goals":["להבין את מעגל האובססיה והכפייתיות, והדרך שבה כפייתיות מקלה לרגע ומחזקת את הבעיה","לנטר את המחשבות, ההתנהגויות והזמן שהן גוזלות","לבנות מדרג של טריגרים, אובססיות וכפייתיות","לתרגל חשיפה מדורגת ומניעת תגובה כפייתית, ולשאת ספק וחוסר ודאות","לשתף בני משפחה ולהפחית מתן אישורים והשתתפות בטקסים"],"components":["הסבר ומעגל אישי","ניטור עצמי","מדרג","מניעת תגובה","חשיפה במציאות ובדמיון","בני משפחה","מניעת הישנות"],"selection":"מתאים כשיש אובססיות וכפייתיות (פיזיות או מנטליות) והימנעות. בררו דיכאון משני ותובנה, והתחשבו בטיפול תרופתי מקביל.","adaptation":["תוכן האובססיות שונה בין אנשים (ניקיון, בדיקות, סדר, תוכן אלים או מיני, דתי, ספקנות, דימוי גוף). התאימו את התרגול לתוכן האישי.","החשיפה מתחילה ברמת מצוקה נמוכה עד בינונית ועולה בהדרגה, וכוללת מניעת תגובה כפייתית, כולל כפייתיות מנטלית ובקשת אישורים.","בתוכן רגיש (מיני, אלים, דתי) שקלו להיעזר באיש מקצוע או בגורם דתי מתאים."],"cautions":["משימות החשיפה והמניעה מבוצעות רק לפי מה שסוכם בפגישה. האפליקציה אינה בוחרת תרגילים ואינה כוללת תוכן חשיפה ספציפי.","הימנעו מלתת אישורים חוזרים. האפליקציה בכוונה אינה מרגיעה או מבררת ודאות.","האפליקציה אינה מזהה מצבי סיכון ואינה מתריעה."],"contraindications":["מחשבות או כוונות אובדניות, או פגיעה עצמית: הליווי אינו מתאים ואינו מיועד למצבים אלה. אין להפעיל אותו עבור מטופל/ת כזה/ת. האפליקציה לא מזהה סיכון ולא מתריעה."]},"progress_metrics":["זמן שהוקדש לכפייתיות (לפי רישום)","מצוקה לפני ואחרי כל תרגול (0–10)","דחף לבצע כפייתיות לפני ואחרי (0–10)","מספר תרגולים שבוצעו"],"coverage_notes":["טפסים 4–14 נקראו ברמת כותרות בלבד (מדרגים, מניעת התנהגות כפייתית, חשיפות, בני משפחה, מניעת הישנות). המודולים הללו נכתבו כשלד עקרוני ודורשים השלמה ובדיקה.","לא נכתבו רעיונות חשיפה ספציפיים, מתוך שיקול קליני."],"stages":[{"stage_id":"o1-understand","title":"מחשבות שנתקעות, והרגלים שמרגיעים לרגע","clinical_title":"הסבר פסיכו־חינוכי: מעגל אובססיה–כפייתיות","purpose":"להבין איך מחשבות שנתקעות והרגלים מרגיעים מזינים זה את זה.","patient_intro":["לכל האנשים יש לפעמים מחשבות מוזרות או לא נעימות שקופצות לראש. רוב האנשים מניחים להן לעבור. אצל חלק מהאנשים הן נתקעות, מפחידות ומובילות לספקות.","מה שמבדיל הוא בעיקר המשמעות שנותנים למחשבה: \"אם חשבתי על זה, זה אומר משהו\".","כדי להפחית את הלחץ, אנשים עושים פעולות: לבדוק, לנקות, לספור, לשאול, לחזור על משפטים או לבדוק בראש. זה מרגיע לרגע, ואז הספק חוזר, והצורך לחזור על הפעולה גדל.","המעגל הזה נשבר דרך שינוי הדרך שבה מגיבים למחשבות, לאט ובליווי של המטפל/ת."],"therapist_guidance":"הציגו את המעגל על דוגמה אישית. הדגישו שהבעיה אינה במחשבות עצמן אלא במשמעות שניתנת להן ובמאמצי הסילוק. הסבירו שהמטרה אינה להפסיק לחשוב אלא לא לפעול לפי הדחף.","provenance":{"source_forms":[1,2],"origin":"adapted","depth":"full"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"o1-read","type":"read","prompt":"קראתי את ההסבר ועצרתי לחשוב על מה שמוכר לי ממנו"},{"task_id":"o1-example","type":"reflect","prompt":"דוגמה אחת מהימים האחרונים","instructions":"רשמו: מה הייתה המחשבה או הדחף? מה עשיתי כדי להקל? כמה זמן זה לקח? מה קרה אחר כך?"}]},{"stage_id":"o2-monitor","title":"רושמים בלי לשנות","clinical_title":"ניטור עצמי","purpose":"לראות את התמונה המדויקת: מתי, מה ובאיזה מחיר.","patient_intro":["בימים הראשונים רק מתבוננים. בכל פעם שמבצעים התנהגות כפייתית או נמנעים ממשהו, רושמים בקצרה מה הפעיל אותה, מה הייתה המחשבה או הדחף, מה עשיתי וכמה זמן זה לקח.","אין צורך לשנות כלום עדיין. כשמתבוננים, כבר מתחיל שינוי."],"therapist_guidance":"בימים הראשונים רק ניטור, בלי ניסיון לוותר על הכפייתיות. עברו על הרישומים בפגישה.","provenance":{"source_forms":[3],"origin":"adapted","depth":"full"},"advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"o2-log","type":"log","prompt":"רישום קצר","instructions":"רשמו משפט קצר לכל סעיף: הטריגר, המחשבה או הדחף, מה עשיתי, כמה זמן. אחר כך דרגו את המצוקה.","feedback":[{"id":"distress","label":"עוצמת המצוקה"}]}]},{"stage_id":"o3-ladder","title":"סולם של מצבים ומחשבות","clinical_title":"מדרג טריגרים ואובססיות, ואיתור כפייתיות","purpose":"לסדר את מה שמטריד מהקל אל הכבד, כבסיס לצעדים הבאים.","patient_intro":["נבנה יחד סולם: מצבים ומחשבות שמעוררים מצוקה, מהקל אל הכבד, ולצידם ההרגלים שמקלים עליהם.","הסולם עוזר לבחור צעד מתאים, ולא להתחיל מהקשה ביותר."],"therapist_guidance":"בנו עם המטופל/ת מדרג טריגרים, מדרג אובססיות ורשימת התנהגויות כפייתיות (פיזיות ומנטליות) עם דירוג. כללו את ההימנעויות. בטופס המקור נעשה שימוש בסולם 0–100.","provenance":{"source_forms":[4,5,6],"origin":"new-general-principles","depth":"titles-only"},"advance_condition":"1 השלמות רצופות","tasks":[{"task_id":"o3-ladder","type":"plan","therapist_directed":true,"prompt":"הסולם שלי","instructions":"רשמו מצבים ומחשבות שמעוררים מצוקה, ולכל אחד דרגה מ-0 עד 10 ומה אתם עושים כדי להקל. הביאו לפגישה הבאה."}]},{"stage_id":"o4-hold","title":"לעמוד בלי לבצע","clinical_title":"מניעת התנהגות כפייתית","purpose":"ללמוד שהדחף עולה ויורד גם בלי לבצע את ההרגל.","patient_intro":["כשעולה דחף לבצע הרגל מרגיע, אפשר לנסות להמתין. הדחף בדרך כלל עולה, מגיע לשיא ויורד, גם בלי לבצע.","מתחילים בצעד קטן: לדחות, לקצר או לשנות את ההרגל, וממשיכים בהדרגה.","הדבר החשוב הוא לא לחפש הרגעה או ודאות, אלא לאפשר לספק להיות שם."],"therapist_guidance":"הכינו עם המטופל/ת תוכנית דרגתית למניעת תגובה. בררו גם כפייתיות מנטלית ובקשות אישור מקרובים.","provenance":{"source_forms":[7],"origin":"new-general-principles","depth":"title-only"},"advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"o4-delay","type":"exposure","therapist_directed":true,"prompt":"המתנה לפני ההרגל שסוכם","instructions":"בצעו רק את מה שסוכם עם המטפל/ת: להמתין, לקצר או לוותר על הרגל מסוים. דרגו את הדחף לפני ואחרי.","feedback":[{"id":"urge_before","label":"עוצמת הדחף לפני"},{"id":"urge_after","label":"עוצמת הדחף אחרי"}]}]},{"stage_id":"o5-practice","title":"תרגול מדורג","clinical_title":"חשיפה במציאות ובדמיון","purpose":"להתנסות בהדרגה במה שמטריד, ולהישאר איתו בלי להקל בכפייתיות.","patient_intro":["בשלב הזה מתרגלים להיות עם מה שמטריד, בדרגה שמתאימה לכם, כשלא מבצעים את ההרגל.","התרגול נבחר ומסוכם עם המטפל/ת. האפליקציה רק מלווה אתכם בביצוע ובמעקב."],"therapist_guidance":"מודול זה הוא שלד עקרוני. התוכן הספציפי (במציאות ובדמיון) נקבע בפגישה בהתאם לתוכן האישי, בדרג מצוקה מתאים. אין רעיונות חשיפה ספציפיים באפליקציה.","provenance":{"source_forms":[8,9,10,11],"origin":"new-general-principles","depth":"titles-only"},"advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"o5-do","type":"exposure","therapist_directed":true,"prompt":"התרגול שסוכם עם המטפל/ת","instructions":"בצעו את התרגול שסוכם, הישארו בו לפי הזמן שתכננתם, ודרגו לפני, בשיא ואחרי.","feedback":[{"id":"before","label":"מצוקה לפני"},{"id":"peak","label":"מצוקה בשיא"},{"id":"after","label":"מצוקה אחרי"}]}]},{"stage_id":"o6-family","title":"המשפחה והסביבה","clinical_title":"בני משפחה: תמיכה בלי השתתפות בטקסים ובלי אישורים","purpose":"לגייס תמיכה ולהפחית את מה שמקבע את הכפייתיות.","patient_intro":["אנשים קרובים רוצים לעזור, ולפעמים עוזרים בדרך שמחזקת את ההרגל: עונים שוב ושוב לשאלות, משתתפים בטקסים או מקלים על הימנעות.","אפשר לשוחח איתם ולהסכים על דרך תמיכה אחרת."],"therapist_guidance":"שיתוף בני משפחה לפי שיקול דעתכם.","provenance":{"source_forms":[12,13],"origin":"new-general-principles","depth":"titles-only"},"advance_condition":"1 השלמות רצופות","tasks":[{"task_id":"o6-talk","type":"plan","prompt":"שיחה עם אדם קרוב","instructions":"חשבו על אדם אחד שמעורב, ורשמו איך הייתם רוצים שיתמוך בכם ומה לא יעזור."}]},{"stage_id":"o7-keep","title":"להישאר בדרך","clinical_title":"מניעת הישנות","purpose":"להמשיך להתאמן, ולהתמודד עם חזרה של מחשבות.","patient_intro":["גם אחרי שיפור, מחשבות מוכרות יחזרו לפעמים. זה לא אומר שהכול מתחיל מחדש.","מה שעוזר הוא להמשיך להגיב אליהן כמו שלמדתם: להבחין, לא לבצע, ולחזור לחיים."],"therapist_guidance":"בנו תוכנית כתובה: סימנים מוקדמים לחזרה של כפייתיות, צעדים לפעולה, ובדיקה ממושכת.","provenance":{"source_forms":[14],"origin":"new-general-principles","depth":"title-only"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"o7-signs","type":"plan","prompt":"הסימן המוקדם שלי","instructions":"מה משתנה אצלי כשההרגלים מתחילים לחזור?"},{"task_id":"o7-step","type":"plan","prompt":"מה אעשה","instructions":"רשמו שלושה צעדים שאעשה כשאזהה את הסימן, וממי אבקש תמיכה."}]}],"reinforcement_pool":{"on_complete":["כל הכבוד. עמדת בלי לבצע, וזה לא קל.","עשית את זה, וזה מה שנחשב.","תודה שהתמדת."],"on_attempt":["ניסיון הוא התקדמות. תודה שניסית.","גם ניסיון חלקי נחשב."],"on_skip":["בסדר גמור. אפשר לנסות בהזדמנות הבאה."],"on_hard_day":["יש ימים קשים יותר, וזה חלק מהדרך.","תודה שאמרת. היום מספיק להיות עדינים עם עצמנו."]},"patient_overview":{"goal_title":"מה המטרה של הליווי הזה","paragraphs":["הליווי הזה נועד לעזור לכם להפחית את הכוח של מחשבות שנתקעות ושל ההרגלים שמרגיעים רק לרגע, ולחזור לחיות בלי שהם ינהלו אתכם.","מבינים איך המעגל עובד, עוקבים אחריו, ומתרגלים בהדרגה, בקצב שלכם ולפי מה שסוכם עם המטפל/ת. האפליקציה בכוונה לא נותנת הרגעה או וודאות.","בכל יום יש צ'ק-אין קצר, ובמשימות יש שאלות קצרות. אתם בוחרים בעצמכם מתי ביום ומתי ג'סי תזכיר לכם.","מה שאתם כותבים נשאר אצלכם, במכשיר. אתם מחליטים מה לשתף עם המטפל/ת.","הליווי הזה לא מתאים כשיש מחשבות על פגיעה עצמית או על מוות, וג'סי לא יכולה לעזור במצבים כאלה. אם יש לכם מחשבות כאלה, פנו עכשיו לעזרה (כפתור \"הערה חשובה!\" זמין בכל מסך) ולמטפל/ת שלכם."],"bring":"אם עולה משהו שחשוב לכם לשתף, אפשר לרשום אותו תחת \"משהו להביא לפגישה\" ולהביא אותו לפגישה."}},{"schema_version":"1.0","protocol_id":"panic-agoraphobia-cbt","protocol_version":"0.1.0-draft","title":"הפרעת פאניקה ואגורפוביה (CBT)","patient_title":"סימפטומים גופניים לחרדה רגעית","track":"adult","persona":"jessie","target_population":"מבוגרים עם התקפי פאניקה והימנעות ממקומות, בליווי מטפל/ת מוסמך/ת","approved_by":"DRAFT — טרם נבדק קלינית","content_status":"draft-needs-clinical-review","sources":["אריאל חן, \"מטפלים בפאניקה\", חוברת העבודה למטופל (צעד צעד, CBT): טפסים 1–5 נקראו לעומק, טפסים 6–13 נקראו ברמת כותרות בלבד","הניסוח, הסדר והדוגמאות נכתבו מחדש; לא הועתק טקסט מהמקור"],"therapist_guide":{"goals":["להבין את מעגל הפאניקה: טריגר, תחושות גוף, פרשנות אסונית, התנהגות ביטחון והימנעות","לשנות את התגובה לתחושות: קבלה והפניית קשב, במקום מאבק ובריחה","לבנות מדרג של מקומות ומצבים נמנעים ולהיחשף אליהם בהדרגה","לתרגל חשיפה לתחושות גופניות מפחידות, בהנחיית המטפל/ת"],"components":["הסבר ומעגל אישי","תגובה לגל חרדה","מעקב התקפים","מיפוי הימנעות","חשיפה במציאות","חשיפה לתחושות גוף","נשימה","מניעת הישנות"],"selection":"מתאים כשיש התקפי פאניקה חוזרים וחרדת ציפייה, עם או בלי הימנעות. ודאו שנעשתה בדיקה רפואית שלא העלתה סיבה רפואית לתסמינים.","adaptation":["קצב וסדר לפי המטופל/ת. אפשר לדלג על מודולים ולהחליף סדר.","ניסויים לבחינת אמונות (לדוגמה פעילות גופנית מאומצת, עמידה בסחרחורת) מתוכננים בפגישה בלבד, ולאחר התייחסות למצב הבריאותי."],"cautions":["ודאו בירור רפואי לפני התחלה, בייחוד כשיש תסמינים בחזה, בלב או בנשימה.","טכניקות פרדוקסליות (לבקש מהגל להתחזק, לעשות את ההפך ממה שהגוף דוחף אליו) והחשיפה לתחושות גוף מבוצעות רק בהנחיית המטפל/ת. האפליקציה אינה מנחה אותן באופן עצמאי.","נשימה מבוקרת עלולה להפוך להתנהגות ביטחון. החליטו אם ואיך להשתמש בה.","האפליקציה אינה מזהה מצבי סיכון ואינה מתריעה."],"contraindications":["מחשבות או כוונות אובדניות, או פגיעה עצמית: הליווי אינו מתאים ואינו מיועד למצבים אלה. אין להפעיל אותו עבור מטופל/ת כזה/ת. האפליקציה לא מזהה סיכון ולא מתריעה."]},"progress_metrics":["מספר גלי חרדה ועוצמתם המרבית (0–10)","מספר חשיפות שבוצעו","מצוקה לפני, בשיא ואחרי (0–10)","רשימת מקומות ומצבים שחזרו לשגרה"],"coverage_notes":["טפסים 6–13 (מדרג חשיפה, תכנון ומעקב חשיפות, חשיפה לתחושות גופניות, קרובים, נשימה מבוקרת, מניעת הישנות) נקראו ברמת כותרות בלבד. התוכן שלהם נכתב מעקרונות כלליים ודורש בדיקה.","טכניקות של המקור הכוללות הוראות פרדוקסליות ישירות למטופל/ת (כגון ניסיון לעורר התעלפות) לא נוסחו כהנחיה עצמאית, ומסורות להחלטת המטפל/ת."],"stages":[{"stage_id":"p1-understand","title":"מה קורה בגוף כשהחרדה מגיעה בבת אחת","clinical_title":"הסבר: פאניקה, אזעקת שווא ומעגל הפאניקה","purpose":"להבין שתחושות חזקות בגוף הן לא סימן לסכנה, ומה מחזיק אותן.","patient_intro":["לפעמים החרדה מגיעה בבת אחת: הלב דופק, קשה לנשום, מסתחרר, מזיע או מרגיש מנותק. זה מפחיד מאוד, ואנשים רבים חושבים שקורה משהו מסוכן.","הגוף שלנו מצויד במערכת אזעקה. כשיש סכנה אמיתית היא עוזרת לנו להגיב. לפעמים היא נדלקת בלי סכנה, כמו אזעקת שווא. התחושות אמיתיות, אבל הן לא מסוכנות.","מה שמחזק אותן הוא בעיקר הפחד מהן: אנחנו מסתכלים על הגוף כל הזמן, מפרשים כל שינוי כסכנה, ונמנעים ממקומות שבהם זה קרה. כך נוצר מעגל.","מומלץ לוודא עם רופא שאין סיבה רפואית לתחושות. אחרי זה, אפשר ללמוד להגיב אליהן אחרת."],"therapist_guidance":"וודאו בירור רפואי. הציגו את המעגל על התקף אחרון של המטופל/ת. בררו אמונות כמו \"אמות\", \"אתעלף\", \"אשתגע\" לצורך בחינה בהמשך.","provenance":{"source_forms":[1],"origin":"adapted","depth":"full"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"p1-read","type":"read","prompt":"קראתי את ההסבר ועצרתי לחשוב על מה שמוכר לי ממנו"},{"task_id":"p1-example","type":"reflect","prompt":"הפעם האחרונה שזה קרה","instructions":"רשמו בקצרה: מה קדם לזה? מה הרגשתי בגוף? מה חשבתי שיקרה? מה עשיתי?"}]},{"stage_id":"p2-respond","title":"איך להגיב כשהגל מגיע","clinical_title":"תגובה להתקף: קבלה והפניית קשב","purpose":"לשנות את התגובה לתחושות, ממאבק לקבלה.","patient_intro":["כשהגל מגיע, הדחף הטבעי הוא להילחם בו, לנסות לשכנע את עצמנו שהכול בסדר או לברוח. לרוב זה מגביר את התחושות.","אפשר לנסות לשנות את התגובה: לומר לעצמכם \"זה גל, הוא יעבור\", להרגיש אותו כמה שניות, ואז להחזיר את הקשב למה שעשיתם קודם.","אם התחושות חוזרות, חוזרים על זה. אחרי גל חזק, ייתכן שהגוף יישאר מתוח זמן מה. אפשר לתת לו להתפוגג ולהמשיך כרגיל.","התרגול הזה לא מחליף בדיקה רפואית. אם משהו נראה שונה ממה שהכרתם, או שהתחושות חדשות, פנו לרופא."],"therapist_guidance":"תרגלו את העמדה בפגישה. טכניקות פרדוקסליות (לבקש מהגל להתחזק, לעשות את ההפך ממה שהגוף דוחף אליו) יוצגו ויתורגלו רק בפגישה ולאחר התייחסות למצב הרפואי. האפליקציה אינה מנחה אותן.","provenance":{"source_forms":[2],"origin":"adapted","depth":"full"},"advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"p2-practice","type":"exercise","prompt":"התגובה החדשה לתחושה מפחידה","instructions":["כשמופיעה תחושה מפחידה בגוף, אמרו לעצמכם: \"זו תחושה, היא לא מסוכנת\".","תנו לה להיות כמה שניות, ואז החזירו את הקשב למה שאתם עושים.","דרגו אחר כך כמה הצלחתם לא להילחם."],"feedback":[{"id":"accept","label":"כמה הצלחתי לא להילחם בתחושה"}]}]},{"stage_id":"p3-track","title":"מעקב אחרי הגלים","clinical_title":"מעקב אחר התקפי פאניקה","purpose":"להכיר את הטריגרים, התחושות והמחשבות, כדי להתמודד איתם בצורה מדויקת.","patient_intro":["כדי להתמודד עם משהו, כדאי להכיר אותו. כשמקליטים מה קרה, אפשר לראות מה מפעיל גלים, מה הגוף עושה, ומה אנחנו חושבים ועושים.","מומלץ לרשום קרוב לזמן האירוע: איפה הייתי, מה קדם, מה הרגשתי בגוף, מה חשבתי שיקרה, ומה עשיתי.","הרישום הזה הוא כלי למידה, ולא מבחן."],"therapist_guidance":"בקשו תיעוד של הגלים. בדקו טריגרים (מצב, תחושה, רגש, מחשבה), פרשנות אסונית והתנהגויות ביטחון. חשבו גם על חרדת ציפייה בין הגלים.","provenance":{"source_forms":[3,4],"origin":"adapted","depth":"full"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"p3-log","type":"log","prompt":"רישום של גל חרדה","instructions":"רשמו: איפה הייתי? מה קדם לזה? מה הרגשתי בגוף? מה חשבתי שיקרה? מה עשיתי? אחר כך דרגו את עוצמת הפחד המרבית.","feedback":[{"id":"fear","label":"עוצמת הפחד המרבית"}]}]},{"stage_id":"p4-avoid","title":"מקומות ומצבים שאני נמנע/ת מהם","clinical_title":"מיפוי הימנעויות והתנהגויות ביטחון ובניית מדרג","purpose":"לזהות מה הצטמצם בחיים, ומה אני עושה כדי להרגיש בטוח/ה.","patient_intro":["כשהחרדה נקשרת למקומות, אנחנו מתחילים להימנע מהם: קניון, תחבורה, נהיגה, להיות לבד, מעלית או פעילות גופנית.","כשאי אפשר להימנע, יש דברים קטנים שאנחנו עושים כדי להרגיש בטוחים: בקבוק מים, טלפון ביד, ללכת עם אדם מסוים או להישאר ליד היציאה.","בשלב הזה רק מזהים ומרכזים. הרשימה תהפוך לסולם צעדים."],"therapist_guidance":"בנו עם המטופל/ת מדרג של מצבים והדרגת מצוקה. כללו פעילויות שמזכירות תחושות (מאמץ, התרגשות).","provenance":{"source_forms":[6],"origin":"adapted","depth":"title-only"},"advance_condition":"1 השלמות רצופות","tasks":[{"task_id":"p4-ladder","type":"plan","therapist_directed":true,"prompt":"הסולם שלי","instructions":["רשמו מצבים ומקומות שאתם נמנעים מהם או נכנסים אליהם רק עם \"ביטחון\".","ליד כל אחד דרגו מ-0 עד 10 כמה לחץ הוא יעורר, ורשמו מה אתם עושים כדי להרגיש בטוחים.","הביאו אותו לפגישה הבאה."]}]},{"stage_id":"p5-places","title":"צעד אחר צעד אל מקומות","clinical_title":"חשיפה במציאות מדורגת","purpose":"ללמוד מהניסיון שהמקומות בטוחים ושאפשר להתמודד.","patient_intro":["חשיפה היא כניסה הדרגתית למקומות ולמצבים שהימנעתם מהם, בלי התנהגויות הביטחון, ובהישארות מספיק זמן.","בכל פעם בוחרים צעד אחד מהסולם, מסכמים אותו מראש ומתרגלים אותו כמה פעמים.","החרדה צפויה להופיע, והיא נחלשת כשנשארים. הרעיון הוא להתאמן, ולא לעבור מבחן."],"therapist_guidance":"תכננו כל חשיפה: מצב, משך, ביטול התנהגויות ביטחון, ניסוח משפט תומך. חזרו עליה כמה פעמים לפני שעוברים לצעד הבא. בצעו חלק מהחשיפות יחד בפגישה.","provenance":{"source_forms":[5,6,7,8],"origin":"adapted","depth":"partial"},"advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"p5-do","type":"exposure","therapist_directed":true,"prompt":"ביצוע חשיפה שסוכמה","instructions":["בצעו את הצעד שסוכם עם המטפל/ת, בלי התנהגויות ביטחון מוסכמות, והישארו עד סוף הזמן שתכננתם.","דרגו לפני, בשיא ואחרי."],"feedback":[{"id":"before","label":"לחץ לפני"},{"id":"peak","label":"לחץ בשיא"},{"id":"after","label":"לחץ אחרי"}]}]},{"stage_id":"p6-body","title":"תחושות גוף שאני מפחד/ת מהן","clinical_title":"חשיפה לתחושות גופניות (בהנחיית המטפל/ת)","purpose":"ללמוד שתחושות הגוף עצמן אינן מסוכנות.","patient_intro":["גם התחושות עצמן, למשל דופק מוגבר או סחרחורת קלה, יכולות להפחיד. כשמתרגלים להרגיש אותן בצורה מבוקרת, מגלים שהן לא מסוכנות.","תרגילים כאלה נעשים רק אחרי שסיכמתם עם המטפל/ת מה לעשות ומתי. אל תתחילו אותם בעצמכם."],"therapist_guidance":"בחרו תחושות שרלוונטיות למטופל/ת, התחשבו במצב הבריאותי, והגדירו מראש אורך ותדירות. האפליקציה אינה מציעה תרגילים ספציפיים.","provenance":{"source_forms":[9],"origin":"new-general-principles","depth":"title-only"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"p6-do","type":"exposure","therapist_directed":true,"prompt":"התרגול שסוכם עם המטפל/ת","instructions":"בצעו רק את מה שסוכם, ודרגו לפני, בשיא ואחרי.","feedback":[{"id":"before","label":"לחץ לפני"},{"id":"peak","label":"לחץ בשיא"},{"id":"after","label":"לחץ אחרי"}]}]},{"stage_id":"p7-breath","title":"נשימה רגועה","clinical_title":"נשימה מבוקרת (כלי עזר, ולא התנהגות ביטחון)","purpose":"ללמוד כלי הרגעה כללי, בלי להפוך אותו לתנאי להתמודדות.","patient_intro":["נשימה איטית ורגועה היא כלי טוב להרגעה ולהפחתת מתח כללי.","חשוב להשתמש בה כתרגול יומי, ולא כדי \"להציל\" את עצמכם מגל חרדה. ככל שנשענים עליה כדי להימנע מהתחושות, היא יכולה להחזיק את החרדה."],"therapist_guidance":"החליטו אם להשתמש בנשימה, ואיך למנוע שתהפוך להתנהגות ביטחון.","provenance":{"source_forms":[12],"origin":"new-general-principles","depth":"title-only"},"advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"p7-breathe","type":"exercise","prompt":"שלוש דקות של נשימה איטית","instructions":"שבו בנוחות. שאפו דרך האף כמה שניות, ונשפו לאט. המשיכו שלוש דקות, והחזירו את הקשב לנשימה כשהוא נודד.","feedback":[{"id":"calm","label":"כמה הרגשתי רגוע/ה אחרי"}]}]},{"stage_id":"p8-keep","title":"להישאר בדרך","clinical_title":"מניעת הישנות","purpose":"להמשיך להתקדם, ולהתמודד עם גלים שחוזרים.","patient_intro":["גל חרדה יכול לחזור מדי פעם, במיוחד בתקופות מתוחות. זה לא אומר שחזרתם לנקודת ההתחלה.","מה שעוזר הוא להמשיך לתרגל, להישאר במקומות, ולהגיב לתחושות בקבלה."],"therapist_guidance":"בנו תוכנית כתובה קצרה: מה עוזר, אילו מקומות להמשיך לתרגל, מה לעשות כשגל חוזר, ומתי לפנות.","provenance":{"source_forms":[13],"origin":"new-general-principles","depth":"title-only"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"p8-places","type":"plan","prompt":"מקומות להמשיך לתרגל","instructions":"רשמו שלושה מקומות או מצבים שחשוב לכם להמשיך להיות בהם."},{"task_id":"p8-plan","type":"plan","prompt":"מה אעשה כשגל חוזר","instructions":"רשמו שלושה דברים שעזרו לכם, כולל אדם שאפשר לפנות אליו."}]}],"reinforcement_pool":{"on_complete":["כל הכבוד. עוד צעד אל מקום שהיה קשה.","עשית את זה, וזה מה שנחשב.","תודה שהתמדת."],"on_attempt":["ניסיון הוא התקדמות. תודה שניסית.","גם ניסיון חלקי נחשב."],"on_skip":["בסדר גמור. אפשר לנסות בהזדמנות הבאה."],"on_hard_day":["יש ימים קשים יותר, וזה חלק מהדרך.","תודה שאמרת. היום מספיק להיות עדינים עם עצמנו."]},"patient_overview":{"goal_title":"מה המטרה של הליווי הזה","paragraphs":["הליווי הזה נועד לעזור לכם להרגיש בטוחים יותר עם תחושות הגוף שמפחידות, ולחזור בהדרגה למקומות ולמצבים שהתרחקתם מהם.","מבינים מה קורה בגוף, לומדים להגיב לתחושות אחרת, ומתרגלים צעד אחר צעד. תרגילים שנוגעים בתחושות או במקומות נעשים רק לפי מה שסוכם עם המטפל/ת.","בכל יום יש צ'ק-אין קצר, ובמשימות יש שאלות קצרות. אתם בוחרים בעצמכם מתי ביום ומתי ג'סי תזכיר לכם.","מה שאתם כותבים נשאר אצלכם, במכשיר. אתם מחליטים מה לשתף עם המטפל/ת.","הליווי הזה לא מתאים כשיש מחשבות על פגיעה עצמית או על מוות, וג'סי לא יכולה לעזור במצבים כאלה. אם יש לכם מחשבות כאלה, פנו עכשיו לעזרה (כפתור \"הערה חשובה!\" זמין בכל מסך) ולמטפל/ת שלכם."],"bring":"אם עולה משהו שחשוב לכם לשתף, אפשר לרשום אותו תחת \"משהו להביא לפגישה\" ולהביא אותו לפגישה."}},{"schema_version":"1.0","protocol_id":"ptsd-cbt","protocol_version":"0.1.0-draft","title":"הפרעה פוסט־טראומטית (PTSD), כולל אבל טראומטי כתוספת","patient_title":"ליווי תסמינים טראומטיים","track":"adult","persona":"jessie","target_population":"מבוגרים עם תסמינים פוסט־טראומטיים, בליווי מטפל/ת מוסמך/ת בעל ניסיון בטראומה","approved_by":"DRAFT — טרם נבדק קלינית","content_status":"draft-needs-clinical-review","sources":["אריאל חן, \"מטפלים בפוסט־טראומה (PTSD)\", כולל טיפול באבל טראומטי, חוברת העבודה למטופל (צעד צעד, CBT): טפסים 1 ו-1א׳ נקראו לעומק חלקי, טפסים 2–11 נקראו ברמת כותרות בלבד","הניסוח, הסדר והדוגמאות נכתבו מחדש; לא הועתק טקסט מהמקור"],"therapist_guide":{"goals":["הבנה של תגובות לאחר אירוע טראומטי, ושל תפקיד ההימנעות בשימורן","מעקב אחר תסמינים בארבעת האשכולות: חודרנות, הימנעות, עוררות יתר, שינויים בחשיבה ובמצב הרוח","חשיפה הדרגתית במציאות לטריגרים ולפעילויות נמנעות","חשיפה בדמיון, בהובלת המטפל/ת בלבד","עבודה על אמונות יסוד, כעס, ובמקרה הצורך אבל טראומטי"],"components":["הסבר","מעקב תסמינים","מדרג טריגרים","חשיפה במציאות","חשיפה בדמיון (בהובלת המטפל/ת)","כעס","אבל טראומטי (אופציונלי)","מניעת הישנות"],"selection":"מתאים לאחר אירוע טראומטי עם תסמינים מתמשכים. הטיפול המומלץ מתנהל על ידי מטפל/ת מיומן/ת בטראומה. בררו יציבות, סיכון, שימוש בחומרים ודיכאון משני.","adaptation":["הקצב נקבע על ידי המטפל/ת. אפשר להתחיל בהסבר, מעקב ופעילויות נעימות לפני חשיפה.","מודול האבל הטראומטי הוא אופציונלי ומיועד למי שאיבד אדם קרוב בנסיבות טראומטיות.","ייתכן שלא כל המודולים מתאימים לכל מטופל/ת."],"cautions":["האפליקציה אינה כוללת תיאור של אירוע טראומטי, ואינה מכווינה כתיבה או הקלטה של סיפור הטראומה. זה נעשה רק בפגישה, בהובלת המטפל/ת.","חשיפה בדמיון עלולה להעלות מצוקה זמנית. המטפל/ת קובע/ת את הקצב, ויש להבהיר למטופל/ת שאפשר לעצור ולפנות לעזרה.","בבדיקת סיכון: בררו מחשבות אובדניות ושימוש בחומרים. האפליקציה אינה מזהה מצבי סיכון ואינה מתריעה."],"contraindications":["מחשבות או כוונות אובדניות, או פגיעה עצמית: הליווי אינו מתאים ואינו מיועד למצבים אלה. אין להפעיל אותו עבור מטופל/ת כזה/ת. האפליקציה לא מזהה סיכון ולא מתריעה."]},"progress_metrics":["מגמת מצוקה בתסמינים (0–10) לפי מעקב","מספר חשיפות במציאות שבוצעו","מצוקה לפני, בשיא ואחרי (0–10)","חזרה לפעילויות שנמנעו מהן"],"coverage_notes":["טפסים 2–11 נקראו ברמת כותרות בלבד. הם נכתבו כשלד עקרוני.","לא נכתב תוכן של חשיפה בדמיון, מתוך שיקול קליני.","מודול האבל הטראומטי נכתב על סמך מבוא בלבד."],"stages":[{"stage_id":"t1-understand","title":"להבין תגובות אחרי אירוע קשה","clinical_title":"הסבר פסיכו־חינוכי על פוסט־טראומה","purpose":"להבין למה הגוף והראש ממשיכים להגיב, ומה יכול לעזור.","patient_intro":["אחרי אירוע קשה במיוחד, כמעט כל אחד מרגיש תגובות: זיכרונות שחוזרים, חלומות, מתח, קושי בשינה, עצבנות או רצון להתרחק. אצל רוב האנשים הן נחלשות עם הזמן.","כשהן נמשכות, זה לא סימן חולשה. לפעמים נראה כאילו הראש עדיין מחכה לסכנה, וגירוי קטן כמו ריח או רעש מחזיר אותנו לשם.","התרחקות ממה שמזכיר את האירוע מקלה לרגע, אבל מחזיקה את התגובות לאורך זמן, ומצמצמת את החיים.","אין צורך לספר כאן מה קרה. התוכנית מתמקדת בהבנה, במעקב ובחזרה הדרגתית לחיים, יחד עם המטפל/ת."],"therapist_guidance":"הציגו את התסמינים בארבעת האשכולות והסבירו את תפקיד ההימנעות. הבהירו שאין צורך לספר את האירוע באפליקציה. בררו סיכון ושימוש בחומרים.","provenance":{"source_forms":[1],"origin":"adapted","depth":"partial"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"t1-read","type":"read","prompt":"קראתי את ההסבר ועצרתי לחשוב על מה שמוכר לי ממנו"},{"task_id":"t1-reflect","type":"reflect","prompt":"מה אני מזהה אצלי","instructions":"בלי לספר את האירוע, רשמו אילו תגובות מוכרות לכם: זיכרונות שחוזרים, התרחקות מדברים, מתח או קושי בשינה, שינוי במחשבות על עצמכם או על העולם."}]},{"stage_id":"t2-track","title":"מעקב אחרי תסמינים","clinical_title":"מעקב תסמינים: חודרנות, הימנעות, עוררות יתר, שינויים בחשיבה","purpose":"לראות מתי ומה מעורר תגובות, ולעקוב אחר שינוי.","patient_intro":["כשרושמים כשהתגובות מופיעות, אפשר לראות מה מעורר אותן, ומה עוזר.","כתבו בקצרה: מה עורר את התגובה, איך הרגשתי, כמה חזק, ומה עשיתי אחר כך.","אין צורך לתאר את האירוע. מספיק לרשום מה קרה היום."],"therapist_guidance":"עברו על הרישומים. זהו טריגרים ודפוסי הימנעות, ושימו לב לעוררות יתר ולהפרעות שינה.","provenance":{"source_forms":[2],"origin":"new-general-principles","depth":"title-only"},"advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"t2-log","type":"log","prompt":"רישום קצר של התגובות היום","instructions":"בכמה מילים: מה עורר? מה הרגשתי? מה עשיתי? דרגו את עוצמת המצוקה.","feedback":[{"id":"distress","label":"עוצמת המצוקה"}]}]},{"stage_id":"t3-avoid","title":"דברים שהתרחקתי מהם","clinical_title":"זיהוי הימנעויות וטריגרים, ובניית מדרג","purpose":"למפות מה נעשה קשה, ולבחור צעדים הדרגתיים.","patient_intro":["אחרי אירוע קשה, אנשים נוטים להתרחק ממקומות, אנשים, פעילויות או מחשבות שמזכירים אותו, וגם מדברים שהיו נעימים בעבר.","כאן מתבוננים בלי שיפוט. אילו דברים הפסקתי לעשות? מה אני נמנע/ת ממנו?","מהרשימה הזו נבנה סולם צעדים הדרגתי יחד עם המטפל/ת."],"therapist_guidance":"בנו מדרג משותף. שלבו פעילויות נעימות שנעלמו. התחילו מצעדים בדרגה נמוכה עד בינונית והתאימו לקצב.","provenance":{"source_forms":[4],"origin":"new-general-principles","depth":"title-only"},"advance_condition":"1 השלמות רצופות","tasks":[{"task_id":"t3-ladder","type":"plan","therapist_directed":true,"prompt":"הרשימה שלי","instructions":"רשמו מקומות, פעילויות ומצבים שאתם נמנעים מהם, ולכל אחד דרגה מ-0 עד 10. הביאו לפגישה הבאה."}]},{"stage_id":"t4-return","title":"צעדים חזרה לחיים","clinical_title":"חשיפה במציאות והפעלה התנהגותית","purpose":"לחזור בהדרגה למקומות ולפעילויות, וללמוד שאפשר.","patient_intro":["חזרה הדרגתית למה שהתרחקתם ממנו עוזרת לגוף ולראש ללמוד שהמצב בטוח עכשיו.","בוחרים צעד אחד מהסולם, מתכננים אותו עם המטפל/ת, ומתרגלים אותו. החזרה לפעילויות שהיו נעימות מועילה גם למצב הרוח.","אפשר לעצור בכל רגע. אם הקושי גדול מדי, חוזרים לצעד קטן יותר ומדברים עם המטפל/ת."],"therapist_guidance":"שלבו חשיפה במציאות לטריגרים עם חזרה לפעילויות נעימות ומעגלי חיים (עבודה, קשרים). וודאו שהמטופל/ת יודע/ת שאפשר לעצור.","provenance":{"source_forms":[3,4,5,6],"origin":"new-general-principles","depth":"titles-only"},"advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"t4-do","type":"exposure","therapist_directed":true,"prompt":"הצעד שסוכם עם המטפל/ת","instructions":"בצעו רק את הצעד שסוכם. אם הקושי גדול מדי, אפשר לעצור ולפנות למטפל/ת. דרגו לפני, בשיא ואחרי.","feedback":[{"id":"before","label":"מצוקה לפני"},{"id":"peak","label":"מצוקה בשיא"},{"id":"after","label":"מצוקה אחרי"}]},{"task_id":"t4-good","type":"exercise","prompt":"פעילות נעימה אחת","instructions":"בחרו פעילות קטנה שהייתה נעימה לפני האירוע, ונסו אותה.","feedback":[{"id":"pleasure","label":"כמה נהניתי"}]}]},{"stage_id":"t5-talk","title":"לשוחח על מה שקרה, בקצב ובליווי","clinical_title":"חשיפה בדמיון (בהובלת המטפל/ת בלבד)","purpose":"לעבד את הזיכרון בהדרגה, בקצב מוגן.","patient_intro":["בשלב מסוים, המטפל/ת עשויים להציע לשוחח על מה שקרה, בתנאים בטוחים ובקצב שמתאים לכם.","זה נעשה רק בפגישות, ובהתאם לתוכנית שנקבעה איתם. כאן, האפליקציה לא מבקשת מכם לכתוב או להקליט את האירוע.","אם עולה מצוקה חזקה, אפשר לעצור ולפנות לעזרה."],"therapist_guidance":"מודול זה מיועד להובלה על ידי המטפל/ת בלבד, ואינו כולל תוכן. תכננו בפגישה אם ומתי להקליט או להאזין, והגדירו מראש מה עושים אם המצוקה חזקה. מומלץ לבדוק מצב לפני ואחרי.","provenance":{"source_forms":[7],"origin":"new-general-principles","depth":"title-only"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"t5-do","type":"exposure","therapist_directed":true,"prompt":"התרגול שסוכם עם המטפל/ת, אם סוכם","instructions":"בצעו רק את מה שסוכם, ועצרו אם הקושי גדול מדי. דרגו לפני, בשיא ואחרי.","feedback":[{"id":"before","label":"מצוקה לפני"},{"id":"peak","label":"מצוקה בשיא"},{"id":"after","label":"מצוקה אחרי"}]}]},{"stage_id":"t6-anger","title":"כעס","clinical_title":"התמודדות עם כעס ומיומנויות לניהולו","purpose":"להכיר את הכעס ולהגיב אליו בצורה שמשרתת אותי.","patient_intro":["אחרי אירוע קשה, כעס הוא דבר שכיח. הוא יכול להרגיש חזק, ולפעמים הוא פוגע בקשרים.","אפשר ללמוד לזהות מוקדם, לעצור לרגע ולבחור איך להגיב."],"therapist_guidance":"שקלו התאמה אם הכעס מרכזי.","provenance":{"source_forms":[9,10],"origin":"new-general-principles","depth":"titles-only"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"t6-notice","type":"reflect","prompt":"הסימן המוקדם שלי לכעס","instructions":"מה אני מרגיש/ה בגוף ובמחשבות כשהכעס מתחיל לעלות?"},{"task_id":"t6-pause","type":"exercise","prompt":"הפסקה קצרה","instructions":"כשהכעס עולה, עצרו לכמה שניות, נשמו לאט ובחרו תגובה. אם צריך, התרחקו לרגע.","feedback":[{"id":"control","label":"כמה הצלחתי להגיב כמו שרציתי"}]}]},{"stage_id":"t7-grief","title":"געגוע וכאב על אובדן","clinical_title":"תוספת אבל טראומטי (אופציונלי)","purpose":"ליצור מקום לכאב ולגעגוע, לצד חזרה לחיים.","patient_intro":["כשהאירוע כלל אובדן של אדם קרוב, הכאב על האובדן והתגובות לאירוע מתערבבים.","מותר להרגיש כאב וגעגוע, ומותר גם להרגיש רגעים של הקלה או חיוך. אלה לא סותרים את האהבה.","זיכרון של מי שאהבתם יכול להישאר איתכם, וגם החיים יכולים להימשך."],"therapist_guidance":"מודול זה אופציונלי, מיועד למי שאיבד אדם קרוב בנסיבות טראומטיות.התאימו לקצב המטופל/ת, ובדקו סיכון.","provenance":{"source_forms":["1א"],"origin":"adapted","depth":"intro-only"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"t7-remember","type":"reflect","prompt":"דבר אחד שאני רוצה לזכור","instructions":"רשמו משפט אחד על משהו טוב שקשור למי שאהבתם, אם בא לכם."},{"task_id":"t7-life","type":"plan","prompt":"צעד אחד לחיים","instructions":"בחרו פעילות אחת קטנה שאפשר לעשות השבוע, גם לצד הכאב."}]},{"stage_id":"t8-keep","title":"להישאר בדרך","clinical_title":"סיום הטיפול ומניעת הישנות","purpose":"לשמור את מה שעזר, ולדעת מה לעשות כשתגובות חוזרות.","patient_intro":["תגובות עשויות לחזור בתקופות לחוצות או בתאריכים משמעותיים. זה טבעי.","מה שעוזר הוא להמשיך בצעדים שלמדתם, להישאר בקשר עם אנשים, ולפנות לעזרה מוקדם."],"therapist_guidance":"בנו תוכנית כתובה: טריגרים צפויים, צעדים שעזרו, אנשי תמיכה, ומתי לפנות אליכם או לגורם חירום.","provenance":{"source_forms":[11],"origin":"new-general-principles","depth":"title-only"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"t8-helped","type":"plan","prompt":"מה עזר לי","instructions":"רשמו שלושה דברים שעזרו, ושווה להמשיך."},{"task_id":"t8-support","type":"plan","prompt":"למי אפנה","instructions":"רשמו אדם או שניים שאפשר לפנות אליהם, ומה אבקש מהם."}]}],"reinforcement_pool":{"on_complete":["כל הכבוד. עוד צעד קטן, וזה נחשב.","עשית את זה, וזה מה שחשוב.","תודה שהתמדת."],"on_attempt":["ניסיון הוא התקדמות. תודה שניסית.","גם ניסיון חלקי נחשב."],"on_skip":["בסדר גמור. אפשר לחזור לזה בקצב שלך."],"on_hard_day":["יש ימים קשים יותר, וזה חלק מהדרך.","תודה שאמרת. היום מספיק להיות עדינים עם עצמנו."]},"patient_overview":{"goal_title":"מה המטרה של הליווי הזה","paragraphs":["הליווי הזה נועד ללוות אתכם בחזרה לחיים אחרי אירוע קשה: להבין את התגובות, לעקוב אחריהן, לחזור בהדרגה לדברים שהתרחקתם מהם, ולקבל הרגעה ותמיכה.","אין צורך לספר כאן מה קרה. שיחה על האירוע, אם היא מתאימה, נעשית רק בפגישות ובהובלת המטפל/ת. תרגילים שנוגעים בקושי נעשים רק לפי מה שסוכם איתם.","בכל יום יש צ'ק-אין קצר, ובמשימות יש שאלות קצרות. אתם בוחרים בעצמכם מתי ביום ומתי ג'סי תזכיר לכם.","מה שאתם כותבים נשאר אצלכם, במכשיר. אתם מחליטים מה לשתף עם המטפל/ת.","הליווי הזה לא מתאים כשיש מחשבות על פגיעה עצמית או על מוות, וג'סי לא יכולה לעזור במצבים כאלה. אם יש לכם מחשבות כאלה, פנו עכשיו לעזרה (כפתור \"הערה חשובה!\" זמין בכל מסך) ולמטפל/ת שלכם."],"bring":"אם עולה משהו שחשוב לכם לשתף, אפשר לרשום אותו תחת \"משהו להביא לפגישה\" ולהביא אותו לפגישה."}},{"schema_version":"1.0","protocol_id":"social-anxiety-cbt","protocol_version":"0.1.0-draft","title":"חרדה חברתית (CBT)","patient_title":"התערבויות חברתיות","track":"adult","persona":"jessie","target_population":"מבוגרים עם חרדה חברתית, בליווי מטפל/ת מוסמך/ת","approved_by":"DRAFT — טרם נבדק קלינית","content_status":"draft-needs-clinical-review","sources":["אריאל חן, \"מטפלים בחרדה חברתית\", חוברת העבודה למטופל (צעד צעד, CBT): טפסים 1–12 נקראו לעומק, טפסים 13–18 נקראו ברמת כותרות בלבד","הניסוח, הסדר והדוגמאות נכתבו מחדש; לא הועתק טקסט מהמקור"],"therapist_guide":{"goals":["להבין את מעגל החרדה החברתית האישי: אמונות, תחזיות, מיקוד פנימי, הימנעות והתנהגויות ביטחון","להפנות קשב החוצה ולוותר בהדרגה על התנהגויות ביטחון","לבחון תחזיות בניסויים התנהגותיים מדורגים, עם מטרות התנהגותיות שאפשר לראות אם הושגו","לבנות שינוי בעמדה כלפי החרדה: חרדה צפויה בחשיפה, ואינה אויב"],"components":["הסבר ומעגל אישי","מיקוד חיצוני","זיהוי התנהגויות ביטחון","מדרג מצבים","חשיפות במציאות","מיומנויות חברתיות","מניעת הישנות"],"selection":"מתאים כמרכיב עיקרי כשהקושי המרכזי הוא פחד מהערכה שלילית ומצבים חברתיים. בדקו דיכאון משני וסיכון.","adaptation":["המדרג וסדר החשיפות נקבעים איתכם. התחילו ברמת מצוקה בינונית, לא בקשה ביותר.","מטרות התנהגותיות (למשל \"לשאול שתי שאלות\") עדיפות על מטרות כלליות כמו \"להרגיש בטוח\".","חשיפות ארוכות וחוזרות יעילות יותר מחשיפה בודדת. מומלץ לתכנן חזרות.","חשיפה בדמיון (טופס 11) וזיכרונות כואבים (טופס 12) לא נכללו בטיוטה ונתונים להחלטה קלינית."],"cautions":["האפליקציה אינה מזהה מצבי סיכון ואינה מתריעה.","משימות החשיפה מבוצעות רק לפי מה שסוכם בפגישה. האפליקציה אינה בוחרת עבור המטופל/ת מצבים מאתגרים.","הימנעו מחשיפות שעלולות לפגוע בפועל במטופל/ת או באחרים."],"contraindications":["מחשבות או כוונות אובדניות, או פגיעה עצמית: הליווי אינו מתאים ואינו מיועד למצבים אלה. אין להפעיל אותו עבור מטופל/ת כזה/ת. האפליקציה לא מזהה סיכון ולא מתריעה."]},"progress_metrics":["מספר ניסויים חברתיים שבוצעו","מצוקה לפני, בשיא ואחרי (0–10) בכל ניסוי","האם המטרה ההתנהגותית הושגה","מגמת מצב רוח בצ'ק-אין היומי"],"coverage_notes":["טפסים 13–18 (אסרטיביות, דיבור מול קהל, ביקורת, שיחה, קרובים, מניעת הישנות) נקראו ברמת כותרות. המודולים המתאימים נכתבו מעקרונות כלליים ודורשים בדיקה.","חשיפה בדמיון וזיכרונות כואבים לא נכללו.","המדרג של המקור נעשה בסולם 0–100. כאן נעשה שימוש בסולם 0–10 לנוחות המטופל/ת."],"stages":[{"stage_id":"s1-understand","title":"מה קורה בנו כשאנחנו עם אנשים","clinical_title":"הסבר פסיכו־חינוכי: מעגל החרדה החברתית","purpose":"להבין למה מצבים חברתיים מלחיצים, ומה שומר על הלחץ.","patient_intro":["הרבה אנשים מתביישים או נלחצים במפגשים עם אחרים. זה נפוץ מאוד, ויש לזה הסבר.","כשהלחץ גבוה, הקשב הולך פנימה: אנחנו בודקים איך אנחנו נראים, מה אנחנו אומרים והאם רואים עלינו שאנחנו לחוצים. בגלל זה קשה יותר להקשיב לאדם שמולנו, וקל יותר להיתקע.","כדי להרגיש בטוחים, אנחנו נוטים להימנע או לעשות דברים קטנים שנותנים ביטחון, כמו להסתכל בטלפון, להכין משפטים מראש או לעמוד בצד. אלה מקלים לרגע, אבל הם מונעים מאיתנו לגלות שהפחד היה מוגזם.","התוכנית הזו עוזרת לנסות דברים מעט אחרת, בצעדים קטנים ובקצב שלכם."],"therapist_guidance":"בנו עם המטופל/ת את המעגל האישי על דוגמה אחת קונקרטית: מצב, תחזית, תחושות גוף, מיקוד, התנהגות ביטחון, מה קרה אחר כך.","provenance":{"source_forms":[1,2,3,4],"origin":"adapted","depth":"full"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"s1-read","type":"read","prompt":"קראתי את ההסבר ועצרתי לחשוב על מה שמוכר לי ממנו"},{"task_id":"s1-example","type":"reflect","prompt":"מצב אחד מהזמן האחרון","instructions":["חשבו על מפגש אחד עם אנשים שהלחיץ אתכם.","רשמו: מה חששתי שיחשבו עליי? מה הרגשתי בגוף? מה עשיתי כדי להתמודד? ומה קרה בפועל?"]}]},{"stage_id":"s2-attention","title":"להוציא את הקשב החוצה","clinical_title":"מיקוד חיצוני","purpose":"לתרגל קשב לסביבה ולאדם שמולי, במקום מעקב אחרי עצמי.","patient_intro":["הקשב נוטה ללכת פנימה כשאנחנו לחוצים. זה טבעי. המטרה היא לא לשלוט בו, אלא להחזיר אותו החוצה, שוב ושוב, בעדינות.","בשיחה, נסו להתעניין במה שהאדם אומר, לשאול אותו שאלות ולשים לב לפרטים. ברחוב, נסו להבחין בצבעים, בצלילים ובאנשים.","זה תרגול כמו כל תרגול. ככל שחוזרים אליו, הוא נעשה קל יותר."],"therapist_guidance":"תרגלו בפגישה: לשוחח תוך מיקוד חיצוני ואז תוך מיקוד פנימי, והשוו את החוויה. אל תבקשו \"לא להסתכל פנימה\" אלא להחזיר קשב.","provenance":{"source_forms":[5],"origin":"adapted","depth":"full"},"advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"s2-talk","type":"exercise","prompt":"שיחה אחת עם קשב החוצה","instructions":["בשיחה קצרה עם אדם, כוונו את הקשב למה שהוא אומר, וחזרו אליו כשהקשב נודד.","אחרי השיחה דרגו עד כמה הצלחתם להישאר בחוץ."],"feedback":[{"id":"outward","label":"כמה הצלחתי להישאר עם הקשב בחוץ"}]},{"task_id":"s2-walk","type":"exercise","prompt":"הליכה קצרה, פעם עם קשב פנימה ופעם עם קשב החוצה","instructions":["בהליכה אחת התמקדו באיך אתם נראים. בהליכה השנייה התמקדו בסביבה.","שימו לב מה השתנה ברגשות ובהתנהגות."]}]},{"stage_id":"s3-safety","title":"דברים שאני נאחז/ת בהם","clinical_title":"זיהוי התנהגויות ביטחון","purpose":"לזהות מה אני עושה כדי להרגיש בטוח/ה, ומה זה לוקח ממני.","patient_intro":["התנהגויות ביטחון הן דברים קטנים שאנחנו עושים כדי לא להיראות לחוצים או כדי לשרוד מפגש. למשל: להסתכל בטלפון, להכין משפטים מראש, להימנע מקשר עין, לשאול רק שאלות כדי שלא ישאלו עלינו, לדבר מעט, או לעמוד בצד.","הן מקלות, אבל הן גם מוסיפות מתח, ומונעות מאיתנו ללמוד שאפשר גם בלעדיהן.","כאן רק מזהים. אין צורך לוותר עליהן עכשיו."],"therapist_guidance":"עברו על רשימה אישית. התנהגויות ביטחון משתנות בין אנשים. בררו גם את ההימנעויות החלקיות (לדוגמה, להימנע מנושאי שיחה אישיים).","provenance":{"source_forms":[7],"origin":"adapted","depth":"full"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"s3-list","type":"reflect","prompt":"הרשימה האישית שלי","instructions":"רשמו שלוש עד חמש התנהגויות ביטחון שאתם מזהים אצלכם. כדי לזהות, חשבו על מפגש אחרון: מה עשיתי בשביל להסתיר את הלחץ או להקל אותו, ואיזה דבר ניסיתי לעשות ראשון כשהוא עלה?"},{"task_id":"s3-fear","type":"re /** Shared by file import and plan links. Returns { ok } or { ok:false, error, stale }. */
async function importPlanText(text) {
  if (!publisher) return { ok: false, error: "כדי לפתוח תוכנית צריך קודם להצטרף דרך קישור ההצטרפות שהמטפל/ת שלחו. בקשו מהם קישור חדש אם צריך." };
  const r = await importPlanFile(text, {
    privateKey: device.privateKey,
    publisherPublicRaw: publisher.publicRaw,
    installedVersion: (id) => (plan && plan.plan_id === id ? plan.plan_version : null),
    findProtocol: (id, ver) => PROTOCOLS.find((p) => p.protocol_id === id && p.protocol_version === ver) || null,
  });
  if (!r.ok) return { ok: false, error: r.error, stale: r.code === "stale" };
  const sameLine = plan && plan.plan_id === r.plan.plan_id;
  plan = r.plan; planJson = r.planJson; protocol = r.protocol;
  if (!sameLine || !progress) progress = newProgress();
  else if (progress.stageIndex >= protocol.stages.length) progress.stageIndex = protocol.stages.length - 1;
  if (joinedInfo) { joinedInfo = null; await kvSet("joined", null); }
  await saveState();
  return { ok: true };
}

// ---------- Mandatory acknowledgment, once per patient ----------
// Shown the first time anything is submitted and then remembered (re-asked only if ACK_VERSION changes).
// Phone numbers must be re-verified before release.
const ACK_VERSION = 2;
let ackRecord = null; // { at, v }
async function ackGate() {
  if (ackRecord && ackRecord.v === ACK_VERSION) return true;
  const ok = await showAck();
  if (ok) { ackRecord = { at: Date.now(), v: ACK_VERSION }; if (!demo) await kvSet("ack", ackRecord); }
  return ok;
}

      el("p", { text: "בכל סימן מצוקה יש לפנות מיד לגורמים המתאימים:" }),

        el("li", {}, "מצב חירום: ", el("a", { href: "tel:101", text: "מד״א 101" })),
        el("li", { text: "מיון או אשפוז פסיכיאטרי בבית החולים הקרוב" }),
        el("li", {}, el("a", { href: "tel:1201", text: "ער״ן 1201" }), " (עזרה נפשית ראשונה)"),
        el("li", {}, el("a", { href: "tel:1800363363", text: "נט״ל 1-800-363-363" }), " (טראומה על רקע לאומני)"),

// ---------- Worksheets: guided questions with free text, chips and 0-10 scales ----------
// Free text and choices stay on the device. Only the numeric scales can reach a report.
function worksheetForm(t) {
  const ans = {}, fb = {}, nodes = [];
  for (const f of t.fields) {
    const id = "ws-" + t.task_id + "-" + f.id;
    if (f.type === "scale") {
      fb[f.id] = 5;
      const out = el("output", { text: "5", style: "min-width:2rem;text-align:center;font-weight:700" });
      const r = el("input", { type: "range", id, min: "0", max: "10", step: "1", value: "5", style: "flex:1;min-height:0;padding:0", "aria-label": f.label + " (0 עד 10)" });
      r.oninput = () => { fb[f.id] = Number(r.value); out.textContent = r.value; };
      nodes.push(el("label", { class: "lbl", for: id, text: f.label + " (0 עד 10)" }), el("div", { style: "display:flex;gap:.6rem;align-items:center" }, r, out));
    } else if (f.type === "time") {
      const inp = el("input", { type: "time", id, style: "max-width:10rem" });
      const link = el("a", { class: "btn secondary", target: "_blank", rel: "noopener", hidden: "", text: "📅 הוספה ליומן Google" });
      inp.onchange = () => {
        ans[f.id] = inp.value;
        if (t.calendar && TIME_RE.test(inp.value)) { link.href = googleCalendarUrl(plan, inp.value, new Date(), appUrl(), { title: t.calendar.title, recur: !!t.calendar.recur }); link.hidden = false; } else link.hidden = true;
      };
      nodes.push(el("label", { class: "lbl", for: id, text: f.label }), inp, link);
    } else if (f.type === "pick") {
      ans[f.id] = [];
      const wrap = el("div", { class: "mood", role: "group", "aria-label": f.label });
      for (const o of f.options) {
        const b = el("button", { type: "button", "aria-pressed": "false", text: o, style: "flex:0 1 auto;padding:.4rem .9rem" });
        b.onclick = () => { const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", String(on)); ans[f.id] = on ? [...ans[f.id], o] : ans[f.id].filter((x) => x !== o); };
        wrap.append(b);
      }
      nodes.push(el("p", { class: "lbl", text: f.label }), wrap);
    } else {
      const ta = el("textarea", { id, maxlength: "1000", placeholder: f.placeholder || "", style: "min-height:" + (f.short ? "3rem" : "5rem") });
      ta.oninput = () => { ans[f.id] = ta.value; };
      nodes.push(el("label", { class: "lbl", for: id, text: f.label }), ta);
    }
  }
  const msg = el("p", { class: "err", role: "alert" });

    btn("שמירה", async () => {
      msg.textContent = "";
      if (!(await ackGate())) return;
      try {
        const r = recordResult(protocol, plan, progress, t.task_id, "COMPLETE");
        const before = progress.stageIndex;
        progress = attachResponse(r.progress, t.task_id, { ans, fb });
        await saveState();
        announce((r.message ? txt(r.message) : "נשמר. תודה.") + (progress.stageIndex > before ? " עברתם לשלב הבא." : ""));
        show();
      } catch (e) { msg.textContent = e.message; }
    }),
    btn("דילגתי", () => record(t.task_id, "SKIP"), "secondary"),
    btn("היה לי יום קשה", () => record(t.task_id, "HARD_DAY"), "secondary")));
}

// ---------- Guided sequences: step-by-step exercises with optional choices and silent pauses ----------
// A step is { kind: "say" | "choice" | "silence", text, options?, seconds?, label? }. No audio is played by the app.
function sequenceBlock(t) {
  const steps = t.sequence;
  let i = 0, timer = null;
  const box = el("div", { class: "msg", style: "font-weight:400" });
  const stop = () => { clearInterval(timer); timer = null; };
  function draw() {
    stop();
    const st = steps[i], last = i === steps.length - 1;
    const kids = [el("p", { class: "muted", text: `שלב ${i + 1} מתוך ${steps.length}` }), el("p", { style: "font-size:1.15rem;font-weight:600", text: txt(st.text) })];
    const next = () => { if (i < steps.length - 1) { i++; draw(); } };
    if (st.kind === "choice") {
      kids.push(el("div", { class: "row" }, st.options.map((o) => btn(o, next, "soft"))));
    } else if (st.kind === "silence") {
      const secs = st.seconds || 6; let left = secs;
      const bar = el("div", { class: "bar", "aria-hidden": "true" }, el("i", { style: "width:0%" }));
      kids.push(el("p", { style: "font-size:2rem;text-align:center", "aria-hidden": "true", text: "🔊" }), bar, el("p", { class: "muted", role: "status", text: "…" }));
      timer = setInterval(() => { left--; bar.firstChild.style.width = Math.round(((secs - left) / secs) * 100) + "%"; if (left <= 0) { stop(); next(); } }, 1000);
    } else if (!last) {
      kids.push(el("div", { class: "row" }, i > 0 ? btn("הקודם", () => { i--; draw(); }, "secondary") : null, btn(st.label || "הבא", next)));
    }
    if (last && st.kind !== "silence") kids.push(el("div", { class: "row" }, i > 0 ? btn("הקודם", () => { i--; draw(); }, "secondary") : null, btn("סיימתי", () => record(t.task_id, "COMPLETE"))));
    kids.push(el("div", { class: "row" }, btn("דילוג על התרגיל", () => { stop(); record(t.task_id, "SKIP"); }, "secondary")));
    box.replaceChildren(...kids);
  }
  draw();
  return box;
}

function ring(frac, size = 92) {

  const svg = document.createElementNS(ns, "svg"); svg.setAttribute("viewBox", "0 0 100 100"); svg.setAttribute("width", size); svg.setAttribute("height", size); svg.setAttribute("class", "ring"); svg.setAttribute("aria-hidden", "true");
  const mk = (stroke, dash) => { const e = document.createElementNS(ns, "circle"); for (const [k, v] of Object.entries({ cx: 50, cy: 50, r, fill: "none", "stroke-width": 11, stroke, "stroke-linecap": "round", "stroke-dasharray": dash, transform: "rotate(-90 50 50)" })) e.setAttribute(k, v); return e; };
  svg.append(mk("var(--lilac)", `${c} ${c}`), mk("var(--accent)", `${c * frac} ${c}`));
  const t = document.createElementNS(ns, "text"); for (const [k, v] of Object.entries({ x: 50, y: 58, "text-anchor": "middle", "font-size": 24, "font-weight": 700, fill: "var(--ink)" })) t.setAttribute(k, v);
  t.textContent = Math.round(frac * 100) + "%"; svg.append(t); return svg;
}
function weekBars(logs, now = Date.now()) {
  const days = [...Array(7)].map((_, i) => { const d = new Date(now); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (6 - i)); return d; });
  const counts = days.map((d) => logs.filter((l) => (l.status === "COMPLETE" || l.status === "ATTEMPT") && new Date(l.at).toDateString() === d.toDateString()).length);
  const max = Math.max(1, ...counts);
  return el("div", { class: "week", role: "img", "aria-label": "פעילות בשבעת הימים האחרונים" },
    days.map((d, i) => el("div", {}, el("i", { class: counts[i] ? "on" : "", style: `height:${Math.max(6, (counts[i] / max) * 56)}px` }), "אבגדהוש"[d.getDay()])));
}

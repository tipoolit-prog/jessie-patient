<script>
// Jessie plan-file crypto (shared by the therapist tool and its tests).
// Format: Ed25519 signature over the exact plan JSON string, then
// envelope encryption: random AES-256-GCM key wrapped with the device's
// RSA-2048 public key (RSA-OAEP with SHA-1 / MGF1-SHA-1, so Android Keystore
// can unwrap it on API 26+; it only ever wraps a random 32-byte key).
const subtle = globalThis.crypto.subtle;
const enc = new TextEncoder();
const dec = new TextDecoder();

const FORMAT = "jessie-plan";
const FORMAT_VERSION = 1;

const b64 = (buf) => {
  const bytes = new Uint8Array(buf);
  let s = "";
  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s);
};
const unb64 = (str) => Uint8Array.from(atob(str), (c) => c.charCodeAt(0));

async function sha256Hex(text) {
  const d = await subtle.digest("SHA-256", enc.encode(text));
  return [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

// ---- Publisher (verified signer) keys ----
async function generatePublisherKeys() {
  const kp = await subtle.generateKey({ name: "Ed25519" }, true, ["sign", "verify"]);
  return {
    publicRaw: b64(await subtle.exportKey("raw", kp.publicKey)),
    privatePkcs8: b64(await subtle.exportKey("pkcs8", kp.privateKey)),
  };
}

async function keyId(publicRawB64) {
  return (await sha256Hex(publicRawB64)).slice(0, 16);
}

// ---- Plan ----
function newPlanId() {
  return globalThis.crypto.randomUUID();
}

async function buildPlan({ protocolRef, customizations, planId = newPlanId(), planVersion = 1, createdAt = new Date().toISOString() }) {
  return {
    schema_version: "1.0",
    plan_id: planId,
    plan_version: planVersion,
    created_at: createdAt,
    protocol_ref: protocolRef,
    customizations,
  };
}

// The signature covers the exact UTF-8 bytes of planJson, so no canonicalisation is needed.
async function signPlan(plan, privatePkcs8B64, publicRawB64) {
  const planJson = JSON.stringify(plan);
  const key = await subtle.importKey("pkcs8", unb64(privatePkcs8B64), { name: "Ed25519" }, false, ["sign"]);
  const sig = await subtle.sign({ name: "Ed25519" }, key, enc.encode(planJson));
  return {
    planJson,
    signature: b64(sig),
    signerKeyId: await keyId(publicRawB64),
    contentHash: "sha256:" + (await sha256Hex(planJson)),
  };
}

async function verifyPlan({ planJson, signature }, publicRawB64) {
  const key = await subtle.importKey("raw", unb64(publicRawB64), { name: "Ed25519" }, false, ["verify"]);
  return subtle.verify({ name: "Ed25519" }, key, unb64(signature), enc.encode(planJson));
}

// ---- Device pairing payload (what the app shows as a QR) ----
function parsePairing(text) {
  const p = JSON.parse(text);
  if (p.t !== "jessie-pair" || p.v !== 1 || !p.device_id || !p.pub) throw new Error("קוד הצמדה לא תקין");
  return { deviceId: p.device_id, publicSpki: p.pub };
}

// ---- Envelope encryption ----
const aad = (deviceId) => enc.encode(`${FORMAT}|${FORMAT_VERSION}|${deviceId}`);

async function encryptPlanFile(signed, devicePublicSpkiB64, deviceId) {
  const payload = JSON.stringify({
    plan_json: signed.planJson,
    signature: signed.signature,
    signer_key_id: signed.signerKeyId,
    content_hash: signed.contentHash,
  });
  const aes = await subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt"]);
  const iv = globalThis.crypto.getRandomValues(new Uint8Array(12));
  const ct = await subtle.encrypt({ name: "AES-GCM", iv, additionalData: aad(deviceId) }, aes, enc.encode(payload));
  const rsa = await subtle.importKey("spki", unb64(devicePublicSpkiB64), { name: "RSA-OAEP", hash: "SHA-1" }, false, ["encrypt"]);
  const wrapped = await subtle.encrypt({ name: "RSA-OAEP" }, rsa, await subtle.exportKey("raw", aes));
  return {
    format: FORMAT,
    version: FORMAT_VERSION,
    device_id: deviceId,
    wrapped_key: b64(wrapped),
    iv: b64(iv),
    ciphertext: b64(ct),
  };
}

// Reference decryptor (the Android app implements the same steps; used for round-trip tests).
async function decryptPlanFile(file, devicePrivatePkcs8B64) {
  if (file.format !== FORMAT || file.version !== FORMAT_VERSION) throw new Error("פורמט קובץ לא נתמך");
  const rsa = await subtle.importKey("pkcs8", unb64(devicePrivatePkcs8B64), { name: "RSA-OAEP", hash: "SHA-1" }, false, ["decrypt"]);
  let raw;
  try {
    raw = await subtle.decrypt({ name: "RSA-OAEP" }, rsa, unb64(file.wrapped_key));
  } catch {
    throw new Error("הקובץ לא תואם למכשיר הזה — ייתכן שהוא נוצר למטופל/ת אחר/ת");
  }
  const aes = await subtle.importKey("raw", raw, { name: "AES-GCM" }, false, ["decrypt"]);
  const pt = await subtle.decrypt({ name: "AES-GCM", iv: unb64(file.iv), additionalData: aad(file.device_id) }, aes, unb64(file.ciphertext));
  return JSON.parse(dec.decode(pt));
}

// ---- Password-protected local storage (publisher key + patient cards) ----
async function pwKey(password, salt) {
  const base = await subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return subtle.deriveKey({ name: "PBKDF2", salt, iterations: 600000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}

async function sealWithPassword(obj, password) {
  const salt = globalThis.crypto.getRandomValues(new Uint8Array(16));
  const iv = globalThis.crypto.getRandomValues(new Uint8Array(12));
  const ct = await subtle.encrypt({ name: "AES-GCM", iv }, await pwKey(password, salt), enc.encode(JSON.stringify(obj)));
  return { salt: b64(salt), iv: b64(iv), ct: b64(ct) };
}

async function openWithPassword(sealed, password) {
  try {
    const pt = await subtle.decrypt({ name: "AES-GCM", iv: unb64(sealed.iv) }, await pwKey(password, unb64(sealed.salt)), unb64(sealed.ct));
    return JSON.parse(dec.decode(pt));
  } catch {
    throw new Error("סיסמה שגויה");
  }
}

</script>
<script>
// Personal links (invite / join-response / plan). Shared by the therapist tool, the patient tool and tests.
// All data travels in the URL fragment (#...), which browsers never send to any server.
// A link is NOT an access credential: an invite only starts pairing (and is single-use, expiring and revocable
// by the therapist tool, which is the only verifier); a plan link carries a plan encrypted to one device key.


const INVITE_TTL_MS = 72 * 3600 * 1000;
const BAD_LINK = "הקישור אינו תקין או שנחתך בדרך. בקשו קישור חדש.";

const b64url = (bytes) => b64(bytes).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64url = (s) => unb64(String(s).replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - (String(s).length % 4)) % 4));
const packJson = (o) => b64url(new TextEncoder().encode(JSON.stringify(o)));
function unpackJson(s) {
  try { return JSON.parse(new TextDecoder().decode(unb64url(s))); } catch { throw new Error(BAD_LINK); }
}

const newInviteId = () => b64url(globalThis.crypto.getRandomValues(new Uint8Array(16)));

/** A usable app address: https, or http on a local development host. Returns the address without query/fragment. */
function cleanBaseUrl(url) {
  let u;
  try { u = new URL(String(url).trim()); } catch { throw new Error("כתובת לא תקינה"); }
  const local = u.hostname === "localhost" || u.hostname === "127.0.0.1" || u.hostname === "[::1]";
  if (u.protocol !== "https:" && !(u.protocol === "http:" && local)) throw new Error("הכתובת חייבת להתחיל ב-https");
  return u.origin + u.pathname;
}

function makeInvite({ publisherPublicRaw, therapistUrl, now = Date.now(), ttl = INVITE_TTL_MS, id = newInviteId() }) {
  return { id, exp: now + ttl, payload: { v: 1, inv: id, pub: publisherPublicRaw, exp: now + ttl, ret: cleanBaseUrl(therapistUrl) } };
}
const inviteLink = (patientUrl, payload) => cleanBaseUrl(patientUrl) + "#join=" + packJson(payload);

function parseInvite(value, now = Date.now()) {
  const p = unpackJson(value);
  if (!p || p.v !== 1 || typeof p.inv !== "string" || typeof p.pub !== "string" || typeof p.exp !== "number" || typeof p.ret !== "string") throw new Error(BAD_LINK);
  try { cleanBaseUrl(p.ret); } catch { throw new Error(BAD_LINK); }
  if (now > p.exp) throw new Error("תוקף הקישור פג. בקשו מהמטפל/ת קישור חדש.");
  return p;
}

const joinResponse = ({ inv, deviceId, publicSpki }) => ({ v: 1, inv, device_id: deviceId, pub: publicSpki });
const joinLink = (therapistUrl, resp) => cleanBaseUrl(therapistUrl) + "#joined=" + packJson(resp);
function parseJoinResponse(value) {
  const p = unpackJson(value);
  if (!p || p.v !== 1 || typeof p.inv !== "string" || typeof p.device_id !== "string" || typeof p.pub !== "string") throw new Error(BAD_LINK);
  return p;
}

const planLink = (patientUrl, file) => cleanBaseUrl(patientUrl) + "#plan=" + packJson(file);
function parsePlanLink(value) {
  const f = unpackJson(value);
  if (!f || typeof f !== "object") throw new Error(BAD_LINK);
  return f;
}

/** "#join=abc" -> { kind: "join", value: "abc" }; anything else -> null. */
function parseHash(hash) {
  const m = /^#(join|joined|plan)=([A-Za-z0-9_-]+)$/.exec(hash || "");
  return m ? { kind: m[1], value: m[2] } : null;
}

const whatsappUrl = (text) => "https://wa.me/?text=" + encodeURIComponent(text);

/**
 * Therapist-side acceptance of a patient's join response. Pure: returns { error } or { invites, card }.
 * The invite must exist, be pending, unexpired and not revoked; it becomes single-use ("joined").
 */
function acceptJoin(invites, resp, now = Date.now()) {
  const i = invites.findIndex((x) => x.id === resp.inv);
  if (i < 0) return { error: "ההזמנה הזו לא נמצאת במאגר הזה. ייתכן שנוצרה בדפדפן אחר או שנמחקה." };
  const inv = invites[i];
  if (inv.status === "revoked") return { error: "ההזמנה בוטלה." };
  if (inv.status === "joined") return { error: "ההזמנה הזו כבר נוצלה." };
  if (now > inv.exp) return { error: "תוקף ההזמנה פג." };
  const card = { label: inv.label, deviceId: resp.device_id, publicSpki: resp.pub, joinedAt: now };
  const next = invites.map((x, j) => (j === i ? { ...x, status: "joined", deviceId: resp.device_id, joinedAt: now } : x));
  return { invites: next, card };
}

<script>
// Reward mechanism: separate from clinical content so every protocol can share it.
// Approved principle: an attempt earns 10; a success on that same challenge adds 2 (total 12, never 22).
// Points are never deducted for difficulty or lack of success. Nothing here is a money value, purchase or perk.
// Entries live in the encrypted progress state as `ledger: [{ at, type, points }]`.
const REWARD_RULES = {
  attempt: 10,
  success: 2,
  // Engagement rewards are moderate. Only dailyOpen is wired in v1; the rest are defined for later and stay off.
  engagement: {
    dailyOpen: { points: 1, enabled: true },
    checkin: { points: 1, enabled: true }, // mood number alone qualifies; free text never earns points
    readTask: { points: 1, enabled: true }, // finishing a "read" task (psychoeducation); never counted as a challenge
    optionalShare: { points: 2, enabled: false }, // never required; free text alone never earns points
  },
};

/** Points for one task result. COMPLETE = attempt + success; ATTEMPT = attempt only; others earn nothing (and never cost). */
function taskEntries(status, now = Date.now(), rules = REWARD_RULES, type = "") {
  if (type === "read") { const r = rules.engagement.readTask; return status === "COMPLETE" && r && r.enabled ? [{ at: now, type: "read", points: r.points }] : []; }
  if (status === "COMPLETE") return [{ at: now, type: "attempt", points: rules.attempt }, { at: now, type: "success", points: rules.success }];
  if (status === "ATTEMPT") return [{ at: now, type: "attempt", points: rules.attempt }];
  return [];
}

const totalPoints = (ledger) => (ledger || []).reduce((n, e) => n + Math.max(0, e.points || 0), 0);

const dayKey = (ms) => new Date(ms).toDateString();

/** One small reward per local day for opening the app, or null if already given / disabled. */
function dailyOpenEntry(ledger, now = Date.now(), rules = REWARD_RULES) {
  const r = rules.engagement.dailyOpen;
  if (!r || !r.enabled) return null;
  if ((ledger || []).some((e) => e.type === "dailyOpen" && dayKey(e.at) === dayKey(now))) return null;

<script>
// Patient-side logic: device pairing, plan import (decrypt -> verify -> validate), progress, reports.
// Pure functions where possible so they can be tested in Node. UI and IndexedDB live in the template.
// crypto.js is inlined ahead of this file by build.mjs (import lines are stripped there).







// ---- Device identity ----
// Private key is created non-extractable: page JS can use it to decrypt but cannot export it.
async function createDeviceIdentity() {
  const kp = await subtle.generateKey(
    { name: "RSA-OAEP", modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: "SHA-1" },
    false, ["decrypt"],
  );
  return {
    privateKey: kp.privateKey,
    deviceId: globalThis.crypto.randomUUID(),
    publicSpki: b64(await subtle.exportKey("spki", kp.publicKey)),
  };
}

// The invite code issued by the therapist is an identifier/label only. It is NOT used for any key derivation,
// encryption or signature; it just travels in the pairing code so the therapist can match the device to a patient card.
const INVITE_RE = /^P-[A-Z0-9]{6}$/;
function normalizeInvite(text) {
  const c = String(text || "").trim().toUpperCase();
  if (!INVITE_RE.test(c)) throw new Error("קוד השאלון אינו תקין. הפורמט הצפוי: P- ואחריו 6 תווים (אותיות באנגלית וספרות)");
  return c;
}
const pairingCode = (id, invite) => JSON.stringify({ t: "jessie-pair", v: 1, device_id: id.deviceId, pub: id.publicSpki, ...(invite ? { invite } : {}) });

// ---- Publisher trust (trust-on-first-use of the therapist tool's public key) ----
async function parsePublisherKey(text) {
  const raw = text.trim();
  let bytes;
  try { bytes = unb64(raw); } catch { throw new Error("המפתח הציבורי אינו תקין"); }
  if (bytes.length !== 32) throw new Error("המפתח הציבורי אינו תקין (אורך שגוי)");
  return { publicRaw: raw, keyId: await keyId(raw) };
}

// ---- Import ----
const fail = (error, code) => ({ ok: false, error, ...(code ? { code } : {}) });

/**
 * ctx: { privateKey, publisherPublicRaw, installedVersion(planId)->number|null, findProtocol(id, version)->protocol|null }
 * Nothing is returned as ok unless decryption, signature, hash, schema, version and protocol checks all pass.
 */
async function importPlanFile(fileText, ctx) {
  let file;
  try { file = JSON.parse(fileText); } catch { return fail("הקובץ אינו קובץ תוכנית תקין של ג'סי"); }
  if (!file || file.format !== FORMAT || file.version !== FORMAT_VERSION) {
    return fail("הקובץ אינו קובץ תוכנית תקין של ג'סי, או שהוא מגרסה שאינה נתמכת");
  }
  if (typeof file.device_id !== "string" || typeof file.wrapped_key !== "string" || typeof file.iv !== "string" || typeof file.ciphertext !== "string") {
    return fail("הקובץ אינו קובץ תוכנית תקין של ג'סי");
  }

  let rawKey;
  try {
    rawKey = await subtle.decrypt({ name: "RSA-OAEP" }, ctx.privateKey, unb64(file.wrapped_key));
  } catch {
    return fail("הקובץ לא תואם למכשיר הזה — ייתכן שהוא נוצר למטופל/ת אחר/ת, או לקוד הצמדה ישן");
  }
  let payload;
  try {
    const aes = await subtle.importKey("raw", rawKey, { name: "AES-GCM" }, false, ["decrypt"]);
    const aad = enc.encode(`${FORMAT}|${FORMAT_VERSION}|${file.device_id}`);
    payload = JSON.parse(dec.decode(await subtle.decrypt({ name: "AES-GCM", iv: unb64(file.iv), additionalData: aad }, aes, unb64(file.ciphertext))));
  } catch {
    return fail("הקובץ פגום או שונה אחרי שנוצר, ולכן לא ניתן לפתוח אותו");
  }

  if (!ctx.publisherPublicRaw) return fail("עדיין לא הוגדר מפתח ציבורי של המטפל/ת — יש להגדיר אותו לפני ייבוא");
  const { plan_json: planJson, signature } = payload;
  if (typeof planJson !== "string" || typeof signature !== "string") return fail("תוכן הקובץ אינו תקין");
  let valid = false;
  try { valid = await verifyPlan({ planJson, signature }, ctx.publisherPublicRaw); } catch { valid = false; }
  if (!valid) return fail("החתימה הדיגיטלית אינה תקינה — הקובץ לא נוצר על ידי המטפל/ת שהוגדר, או ששונה");
  if (payload.content_hash && payload.content_hash !== "sha256:" + (await sha256Hex(planJson))) {
    return fail("בדיקת השלמות נכשלה — תוכן התוכנית שונה");
  }

  let plan;
  try { plan = JSON.parse(planJson); } catch { return fail("תוכן התוכנית אינו תקין"); }
  const problem = validatePlan(plan);
  if (problem) return fail("מבנה התוכנית אינו תקין: " + problem);

  const installed = ctx.installedVersion(plan.plan_id);
  if (installed != null && plan.plan_version <= installed) {
    return fail(`גרסת התוכנית בקובץ (${plan.plan_version}) אינה חדשה מהגרסה המותקנת (${installed})`, "stale");
  }
  const base = ctx.findProtocol(plan.protocol_ref.protocol_id, plan.protocol_ref.protocol_version);
  if (!base) return fail("הפרוטוקול שהתוכנית מתבססת עליו אינו קיים בממשק הזה — ייתכן שנדרשת גרסה חדשה של הממשק");
  if (unknownStages(base, plan).length) return fail("התוכנית מתייחסת למודולים שאינם קיימים בגרסה הזו של הממשק");
  return { ok: true, plan, planJson, protocol: tailorProtocol(base, plan) };
}

function validatePlan(p) {
  if (!p || typeof p !== "object") return "אובייקט חסר";
  if (p.schema_version !== "1.0") return "גרסת סכמה לא נתמכת";
  if (typeof p.plan_id !== "string" || !p.plan_id) return "plan_id חסר";
  if (!Number.isInteger(p.plan_version) || p.plan_version < 1) return "plan_version לא תקין";
  const r = p.protocol_ref;
  if (!r || typeof r.protocol_id !== "string" || typeof r.protocol_version !== "string") return "protocol_ref חסר";
  const c = p.customizations;
  if (!c || !Array.isArray(c.reminder_times) || !c.reminder_times.every((t) => /^([01]\d|2[0-3]):[0-5]\d$/.test(t))) return "reminder_times לא תקין";
  if (!["daily", "weekly"].includes(c.task_frequency)) return "task_frequency לא תקין";
  if (c.stage_order !== undefined && !(Array.isArray(c.stage_order) && c.stage_order.length <= 50 && c.stage_order.every((x) => typeof x === "string"))) return "stage_order לא תקין";
  return null;
}

// ---- Therapist-tailored module order ----
// plan.customizations.stage_order (optional) selects and orders the protocol's stages. Part of the signed plan.
function tailorProtocol(protocol, plan) {
  const order = plan.customizations.stage_order;
  if (!Array.isArray(order) || !order.length) return protocol;
  const byId = new Map(protocol.stages.map((s) => [s.stage_id, s]));
  const stages = order.map((id) => byId.get(id)).filter(Boolean);
  return stages.length ? { ...protocol, stages } : protocol;
}
const unknownStages = (protocol, plan) => (plan.customizations.stage_order || []).filter((id) => !protocol.stages.some((s) => s.stage_id === id));

/** Development markers are stripped from patient-facing text; the data itself keeps them for internal tests. */
const cleanDevLabel = (t) => String(t || "").replace(/^\s*\[DEV\]\s*/, "");

// ---- Patient-facing names ----
// Therapists see the clinical title as written (protocol.title). Patients see protocol.patient_title, a non-clinical name.
const patientTitle = (protocol) => cleanDevLabel(protocol.patient_title || "הליווי שלי");

// ---- Daily check-in: mood 1-10, what helps, gratitude. Stored in the encrypted progress state. ----
const MOOD_MIN = 1, MOOD_MAX = 10;
function addCheckin(prog, { mood, helps = "", thanks = "" }, now = Date.now()) {
  if (!Number.isInteger(mood) || mood < MOOD_MIN || mood > MOOD_MAX) throw new Error("יש לבחור מספר בין 1 ל-10");
  const entry = { at: now, mood, helps: String(helps).slice(0, 500), thanks: String(thanks).slice(0, 500) };
  const e = checkinEntry(prog.ledger, now);
  return { ...prog, checkins: [...(prog.checkins || []), entry], ledger: [...(prog.ledger || []), ...(e ? [e] : [])] };
}
const todayCheckin = (prog, now = Date.now()) => [...(prog.checkins || [])].reverse().find((c) => new Date(c.at).toDateString() === new Date(now).toDateString()) || null;

// ---- Protocol rules ----
const DEV_MARKER = "DEV-PLACEHOLDER";
const isDevProtocol = (p) => String(p.approved_by || "").startsWith(DEV_MARKER);
/** Protocols without approved_by are never usable (same rule as the Android app). */
const usableProtocols = (all) => all.filter((p) => typeof p.approved_by === "string" && p.approved_by.trim() && Array.isArray(p.stages) && p.stages.length);

function streakFrom(cond) {
  const m = /(\d+)/.exec(String(cond || ""));
  return m ? parseInt(m[1], 10) : Infinity;
}

// ---- Progress state: { stageIndex, stageStartedAt, logs:[{taskId, stageId, status, at}] } ----
const STATUS = { COMPLETE: "COMPLETE", ATTEMPT: "ATTEMPT", SKIP: "SKIP", HARD_DAY: "HARD_DAY" };

function newProgress(now = Date.now()) {
  return { stageIndex: 0, stageStartedAt: now, logs: [], ledger: [] };
}

const currentStage = (protocol, prog) => protocol.stages[Math.min(prog.stageIndex, protocol.stages.length - 1)];

/** Start of the current period (local midnight for daily, Monday midnight for weekly). */
function periodStart(freq, now = Date.now()) {
  const d = new Date(now);
  d.setHours(0, 0, 0, 0);
  if (freq === "weekly") d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d.getTime();
}

/** Tasks in protocol order, each marked done if already logged in this period. */
function tasksForNow(protocol, plan, prog, now = Date.now()) {
  const stage = currentStage(protocol, prog);
  const since = periodStart(plan.customizations.task_frequency, now);
  return stage.tasks.map((t) => {
    const entry = prog.logs.find((l) => l.taskId === t.task_id && l.stageId === stage.stage_id && l.at >= since);
    return { ...t, doneStatus: entry ? entry.status : null };
  });
}

/** Records a result; returns { progress, message }. Pure: does not mutate the input. */
function recordResult(protocol, plan, prog, taskId, status, now = Date.now(), pick = Math.random) {
  const stage = currentStage(protocol, prog);
  if (!stage.tasks.some((t) => t.task_id === taskId)) throw new Error("משימה לא קיימת בשלב הנוכחי");
  const next = { ...prog, logs: [...prog.logs, { taskId, stageId: stage.stage_id, status, at: now }], ledger: [...(prog.ledger || []), ...taskEntries(status, now, undefined, (stage.tasks.find((t) => t.task_id === taskId) || {}).type)] };
  if (status === STATUS.COMPLETE && next.stageIndex < protocol.stages.length - 1) {
    const since = next.logs.filter((l) => l.stageId === stage.stage_id && l.at >= next.stageStartedAt);
    const n = streakFrom(stage.advance_condition);
    if (since.length >= n && since.slice(-n).every((l) => l.status === STATUS.COMPLETE)) {
      next.stageIndex += 1;
      next.stageStartedAt = now;
    }
  }
  let message = null;
  if (plan.customizations.reinforcement_enabled) {
    const pool = protocol.reinforcement_pool || {};
    const list = { COMPLETE: pool.on_complete, ATTEMPT: pool.on_attempt || pool.on_complete, SKIP: pool.on_skip, HARD_DAY: pool.on_hard_day }[status] || [];
    message = list.length ? list[Math.floor(pick() * list.length)] : null;
  }
  return { progress: next, message };
}

/** Optional per-task feedback (0-10 scales declared by the protocol task). Attached to the latest log entry of that task. */
function attachFeedback(prog, taskId, fb) {
  const i = prog.logs.map((l) => l.taskId).lastIndexOf(taskId);
  if (i < 0) throw new Error("לא נמצא רישום לחבר אליו משוב");
  const clean = {};
  for (const [k, v] of Object.entries(fb)) { if (Number.isInteger(v) && v >= 0 && v <= 10) clean[k] = v; }
  return { ...prog, logs: prog.logs.map((l, j) => (j === i ? { ...l, fb: clean } : l)) };
}
/** Average of each feedback scale across all entries; descriptive only. */
function feedbackAverages(prog) {
  const sum = {}, n = {};
  for (const l of prog.logs) for (const [k, v] of Object.entries(l.fb || {})) { sum[k] = (sum[k] || 0) + v; n[k] = (n[k] || 0) + 1; }
  return Object.fromEntries(Object.keys(sum).map((k) => [k, { avg: Math.round((sum[k] / n[k]) * 10) / 10, n: n[k] }]));
}

/** Descriptive counts only; no scores or grades. */
function summarize(prog) {
  const c = { COMPLETE: 0, ATTEMPT: 0, SKIP: 0, HARD_DAY: 0 };
  for (const l of prog.logs) c[l.status] = (c[l.status] || 0) + 1;
  const days = new Set(prog.logs.filter((l) => l.status === STATUS.COMPLETE).map((l) => new Date(l.at).toDateString()));
  return { completed: c.COMPLETE, attempted: c.ATTEMPT, points: totalPoints(prog.ledger), skipped: c.SKIP, hardDays: c.HARD_DAY, activeDays: days.size };
}

// ---- Calendar reminders (.ics) ----
// A local file the patient opens in their calendar app. It carries only a generic title ("תזכורת מג'סי"),
// never clinical content, because calendars may sync to a cloud account. Floating local times, no timezone.
const pad = (n) => String(n).padStart(2, "0");
const icsDate = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
function buildIcs(plan, now = new Date()) {
  const c = plan.customizations;
  const stamp = now.toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
  const weekday = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"][now.getDay()];
  const rrule = c.task_frequency === "weekly" ? `FREQ=WEEKLY;BYDAY=${weekday}` : "FREQ=DAILY";
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Jessie//Reminders//HE", "CALSCALE:GREGORIAN"];
  for (const t of c.reminder_times) {
    const [h, m] = t.split(":");
    lines.push(
      "BEGIN:VEVENT",
      `UID:jessie-${plan.plan_id}-${h}${m}@jessie.local`,
      `SEQUENCE:${plan.plan_version}`,
      `DTSTAMP:${stamp}`,
      `DTSTART:${icsDate(now)}T${h}${m}00`,
      "DURATION:PT15M",
      `RRULE:${rrule}`,
      "SUMMARY:תזכורת מג'סי",
      "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:תזכורת", "TRIGGER:PT0M", "END:VALARM",
      "END:VEVENT",
    );
  }
  lines.push("END:VCALENDAR");
  return lines.join("\r\n") + "\r\n";
}

// ---- Google Calendar event-template link (one click, no OAuth, no account connection) ----
// The link only pre-fills an event form in the user's own Google Calendar. It creates no notification by itself:
// the alert that fires is the calendar's default notification for that user.
function nextOccurrence(time, now = new Date()) {
  const [h, m] = time.split(":").map(Number);
  const d = new Date(now);
  d.setHours(h, m, 0, 0);
  if (d <= now) d.setDate(d.getDate() + 1);
  return d;
}
function googleCalendarUrl(plan, time, now = new Date(), appUrl = "", title = "תזכורת מג'סי") {
  const start = nextOccurrence(time, now);
  const end = new Date(start.getTime() + 15 * 60000);
  const g = (d) => `${icsDate(d)}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const weekday = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"][start.getDay()];
  const rule = plan.customizations.task_frequency === "weekly" ? `FREQ=WEEKLY;BYDAY=${weekday}` : "FREQ=DAILY";
  const q = new URLSearchParams({
    action: "TEMPLATE",
    text: title,
    dates: `${g(start)}/${g(end)}`,
    details: appUrl ? "זמן לתרגול הקצר שלכם בג'סי: " + appUrl : "זמן לתרגול הקצר שלכם בג'סי",
    recur: "RRULE:" + rule,
  });
  return "https://calendar.google.com/calendar/render?" + q.toString();
}

// ---- Report (patient-initiated) ----
function buildReport(plan, protocol, prog, now = new Date()) {
  const stageById = Object.fromEntries(protocol.stages.map((s) => [s.stage_id, s.title]));
  const taskById = Object.fromEntries(protocol.stages.flatMap((s) => s.tasks.map((t) => [s.stage_id + "/" + t.task_id, t.prompt])));
  return {
    report_version: 1,
    exported_at: now.toISOString(),
    plan_id: plan.plan_id,
    plan_version: plan.plan_version,
    protocol: { id: protocol.protocol_id, version: protocol.protocol_version, title: protocol.title },
    current_stage: currentStage(protocol, prog).title,
    summary: summarize(prog),
    // Mood numbers only; the free-text answers (what helps, gratitude) stay on the device.
    mood_checkins: (prog.checkins || []).map((c) => ({ at: new Date(c.at).toISOString(), mood: c.mood })),
    entries: prog.logs.map((l) => ({
      at: new Date(l.at).toISOString(),
      stage: stageById[l.stageId] || l.stageId,
      task: taskById[l.stageId + "/" + l.taskId] || l.taskId,
      status: l.status,
      ...(l.fb ? { feedback: l.fb } : {}),
    })),
  };
}

const REPORT_FORMAT = "jessie-report";
// A password-protected report is { format, version, salt, iv, ct } (see sealWithPassword).
async function sealReport(report, password) {
  return { format: REPORT_FORMAT, version: 1, ...(await sealWithPassword(report, password)) };
}
async function openReport(file, password) {
  if (!file || file.format !== REPORT_FORMAT) throw new Error("הקובץ אינו דוח של ג'סי");
  return openWithPassword(file, password);
}

const PROTOCOLS = usableProtocols([{"schema_version":"1.0","protocol_id":"depression-behavioral-activation","protocol_version":"0.1.0-draft","title":"דיכאון — הפעלה התנהגותית (CBT)","patient_title":"דיכדוך ומצבי רוח משתנים","track":"adult","persona":"jessie","target_population":"מבוגרים עם דיכאון, בליווי מטפל/ת מוסמך/ת","approved_by":"DRAFT — טרם נבדק קלינית","content_status":"draft-needs-clinical-review","sources":["אריאל חן, \"מטפלים בדיכאון\", חוברת העבודה למטופל (צעד צעד, CBT): טפסים 1–9 נקראו לעומק, טפסים 10–14 נקראו ברמת כותרות בלבד","הניסוח, הסדר והדוגמאות נכתבו מחדש; לא הועתק טקסט מהמקור"],"therapist_guide":{"goals":["לשבור את מעגל הנסיגה וההימנעות: פחות פעולה מביאה מצב רוח נמוך יותר, ומצב רוח נמוך מביא עוד פחות פעולה","להגדיל בהדרגה פעילות מתוכננת שמתגמלת או משמעותית למטופל/ת, ולפעול לפי כוונה ולא לפי חשק","להקטין עיסוק חוזר במחשבות ולהחזיר קשב לפעילות","לבנות תוכנית להמשך ולזיהוי סימני התדרדרות מוקדמים"],"components":["הסבר על מעגל הנסיגה","זיהוי הימנעויות","ניטור התנהגות עם דירוג הנאה ושליטה","תכנון והפעלת פעילויות","עבודה עם מחשבות חוזרות","שינה","מניעת הישנות"],"selection":"מתאים כמרכיב עיקרי כשהדיכאון הוא הבעיה המרכזית. כשהבעיה העיקרית היא חרדה, טראומה או OCD והדיכאון משני, שקלו להתחיל בהן ולעבוד על הדיכאון במקביל או אחריהן.","adaptation":["אפשר לדלג על מודולים, להחליף סדר ולהקדים. הרצף המוצע הוא הצעה בלבד.","קצב: מודול אחד בשבוע הוא ברירת מחדל סבירה, והתאמה לפי מצב המטופל/ת.","בחרו פעילויות לפי מה שחשוב ומרגיע למטופל/ת, ולא לפי רשימה כללית."],"cautions":["האפליקציה אינה מזהה מצבי סיכון ואינה מתריעה. שאלו ישירות על מחשבות אובדניות בתדירות שנקבעת קלינית.","ודאו שאין עדות להפרעה דו־קוטבית (תקופות אנרגיה גבוהה מהרגיל) לפני הפעלה: הטיפול שונה.","פעילות גופנית ותזונה: התאימו לגבולות הבריאותיים של המטופל/ת."]},"progress_metrics":["מספר פעילויות שבוצעו או נוסו בשבוע","ממוצע הנאה (0–10) וממוצע שליטה (0–10) בדיווח אחרי פעילות","מגמת מצב רוח בצ'ק-אין היומי (1–10)","התמדה: ימים עם פעילות"],"coverage_notes":["לא נכללו בטיוטה: ניתוח מטרת ההתנהגות (טופס 9, נקרא רק בתחילתו) ותיקוף האחר והעצמי (טופס 12, כותרת בלבד). דורשים החלטה קלינית אם להוסיף.","מודול השינה נכתב מעקרונות כלליים, ללא קריאה מעמיקה של טופס 13. יש לבדוק מקצועית, במיוחד במקרה של נדודי שינה משמעותיים.","מודול המחשבות החוזרות נכתב על סמך הצגת המושג בלבד (טפסים 10–11 נקראו לפי כותרות)."],"stages":[{"stage_id":"m1-understand","title":"מה קורה כשמצב הרוח יורד","clinical_title":"הסבר פסיכו־חינוכי: מעגל הנסיגה וההימנעות","purpose":"להבין למה כבדות מובילה לעוד כבדות, ובאיזו נקודה אפשר להתערב.","patient_intro":["לכל אחד יש תקופות שבהן מצב הרוח נמוך, האנרגיה יורדת וקשה להתחיל דברים. זה אנושי, ויש לזה הסבר.","כשאנחנו מרגישים כבדים, טבעי לעשות פחות: לבטל תוכניות, לדחות משימות ולהתרחק קצת מאנשים. בטווח הקצר זה מקל. אבל כשעושים פחות, יש פחות רגעים נעימים, פחות תחושת התקדמות ופחות קשר עם אנשים, ומצב הרוח יורד עוד. כך נוצר מעגל.","החדשות הטובות הן שאפשר לשבור את המעגל דרך הפעולה. לא צריך לחכות שיהיה חשק. צעדים קטנים הם מה שיוצר אותו, לפעמים רק אחרי שהתחלנו.","בתוכנית הזו נתרגל צעדים כאלה: קטנים, מתוכננים ובקצב שלכם.","אם בכל שלב עולות מחשבות לפגוע בעצמכם, פנו עכשיו לעזרה (כפתור \"עזרה מיידית\" זמין בכל מסך) ודברו עם המטפל/ת."],"therapist_guidance":"הציגו למטופל/ת את המעגל על דוגמה אישית מהחיים שלו/ה (מה הופסק, ומה קרה אחר כך לרגש ולאנרגיה). בררו אם הדיכאון הוא העיקרי או משני. בדקו מחשבות אובדניות והפרעה דו־קוטבית.","provenance":{"source_forms":[1,2],"origin":"adapted","depth":"full"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"m1-read","type":"read","prompt":"קראתי את ההסבר ועצרתי לחשוב על מה שמוכר לי ממנו"},{"task_id":"m1-example","type":"reflect","prompt":"דוגמה אחת מהשבוע האחרון","instructions":["חשבו על דבר אחד שהפסקתם או דחיתם לאחרונה.","רשמו לעצמכם, במילים שלכם: מה הרגשתי לפני ההחלטה, מה הקלה שקיבלתי, ומה קרה אחר כך למצב הרוח ולאנרגיה.","אין תשובה נכונה. מספיק כמה משפטים."]}]},{"stage_id":"m2-avoidance","title":"מה הפסקתי לעשות","clinical_title":"זיהוי הימנעויות ונסיגה","purpose":"לראות במדויק מה הצטמצם בחיים, בלי שיפוט.","patient_intro":["כשמצב הרוח נמוך, הצמצום לא תמיד נראה כמו שכיבה במיטה. לפעמים מפסיקים פעילויות ותחביבים, לפעמים עונים פחות להודעות, ולפעמים מתרחקים דרך הסחות כמו גלילה ארוכה במסך או שינה בשעות היום.","גם הראש יכול להימנע: דוחים החלטות, או חוזרים שוב ושוב על אותן שאלות בלי להגיע לתשובה.","המטרה כאן היא רק להבחין. ברגע שרואים מה הצטמצם, אפשר לבחור מה להחזיר, בצעדים קטנים."],"therapist_guidance":"עברו יחד על תחומים: שגרה ותפקוד, פנאי וגוף, קשרים, והימנעות בחשיבה. בררו גם אילו התנהגויות מוגזמות משמשות כהימנעות פעילה (אלכוהול, מסכים, שינה). לא לשפוט.","provenance":{"source_forms":[3],"origin":"adapted","depth":"full"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"m2-less","type":"reflect","prompt":"שלושה דברים שעשיתי פחות לאחרונה","instructions":["בדקו איזה תחומים בחיים הצטמצמו: משימות, פנאי, קשרים. אפשר גם לשאול אדם קרוב מה הוא שם לב שהשתנה אצלכם.","בחרו שלושה דברים ורשמו אותם."]},{"task_id":"m2-more","type":"reflect","prompt":"דבר אחד שאני עושה כדי לא להרגיש","instructions":["אולי זה זמן ארוך מול מסך, שינה בשעות היום או עיסוק בלי הפסקה.","רשמו אותו בלי ביקורת, ושימו לב מה הוא נותן לכם ברגע ומה הוא לוקח אחר כך."]}]},{"stage_id":"m3-log","title":"יומן קטן של היום","clinical_title":"ניטור התנהגות: פעילות, הנאה ושליטה","purpose":"לראות באופן אמין איך היום באמת נראה, ואילו פעילויות משפיעות על איך שאני מרגיש/ה.","patient_intro":["כשמצב הרוח נמוך, הזיכרון נוטה לצבוע את הכול באפור. יומן קצר נותן תמונה מדויקת יותר.","שלוש פעמים ביום, רשמו במילה או בשתיים מה עשיתם, ואז דרגו מ-0 עד 10: כמה נהניתי וכמה הרגשתי שליטה ויכולת.","לא צריך למלא הכול. מי ששוכח ממשיך מהרגע הבא, בלי לשחזר. תתייחסו לזה כניסוי: אתם רק אוספים מידע."],"therapist_guidance":"בפגישה הבאה עברו על היומן: אילו פעילויות העלו הנאה או תחושת שליטה, ואילו הורידו. הוא הבסיס לבחירת הפעילויות במודול הבא. ציינו שגם מחשבות ושכיבה הם \"התנהגות\" ששווה לרשום.","provenance":{"source_forms":[5,6],"origin":"adapted","depth":"full"},"advance_condition":"6 השלמות רצופות","tasks":[{"task_id":"m3-morning","type":"log","prompt":"רישום בוקר","instructions":"במילה או בשתיים: מה עשיתי הבוקר? אחר כך דרגו הנאה ושליטה.","feedback":[{"id":"pleasure","label":"כמה נהניתי"},{"id":"control","label":"כמה הרגשתי שליטה ויכולת"}]},{"task_id":"m3-noon","type":"log","prompt":"רישום צהריים","instructions":"במילה או בשתיים: מה עשיתי בצהריים? אחר כך דרגו הנאה ושליטה.","feedback":[{"id":"pleasure","label":"כמה נהניתי"},{"id":"control","label":"כמה הרגשתי שליטה ויכולת"}]},{"task_id":"m3-evening","type":"log","prompt":"רישום ערב","instructions":"במילה או בשתיים: מה עשיתי בערב? אחר כך דרגו הנאה ושליטה.","feedback":[{"id":"pleasure","label":"כמה נהניתי"},{"id":"control","label":"כמה הרגשתי שליטה ויכולת"}]}]},{"stage_id":"m4-plan","title":"צעד קטן מתוכנן","clinical_title":"תכנון והפעלה של פעילויות מתגמלות","purpose":"להחזיר לחיים פעילויות קטנות, לפי החלטה ולא לפי החשק של הרגע.","patient_intro":["כאן עוברים מלחכות לחשק לפעול לפי כוונה: מחליטים מראש, ועושים גם אם לא מתחשק. פעמים רבות החשק מגיע אחרי שהתחלנו.","בחרו פעילות קטנה אחת, כזו שאפשר לעשות בקלות, וקבעו לה זמן ומקום. חמש דקות נחשבות.","שלושה סוגים של פעילויות מתאימים: דברים שנעים לעשות, דברים שנותנים תחושת סדר והתקדמות (כמו לסדר פינה קטנה), ודברים שקשורים למה שחשוב לכם או לקשר עם אנשים.","אם לא הצלחתם בזמן שקבעתם, אין בעיה. קובעים לזמן אחר וממשיכים."],"therapist_guidance":"בנו עם המטופל/ת שלוש-ארבע פעילויות קטנות לשבוע ושלבו שלושה סוגים: הנאה, שגרה והתקדמות, וערכים או קשר. התאימו קושי כדי שהסיכוי להצלחה יהיה גבוה. בפגישה הבאה בדקו מה קרה, ללא ביקורת, והמשיכו מהצעד הבא.","provenance":{"source_forms":[4,6,7,8],"origin":"adapted","depth":"full"},"advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"m4-choose","type":"plan","prompt":"בחירה וקביעה של פעילות קטנה","instructions":["בחרו פעילות אחת שאפשר לעשות בין חמש לעשרים דקות. רעיונות: הליכה קצרה, שיר אהוב, שיחת טלפון עם אדם קרוב, סידור פינה אחת, להכין משהו טעים, לשבת בחוץ עשר דקות, להתקלח ולהתלבש כמו שנעים לכם.","קבעו מתי, איפה ועם מי, ורשמו את זה. אפשר להוסיף תזכורת ליומן."]},{"task_id":"m4-do","type":"exercise","prompt":"ביצוע הפעילות","instructions":["עשו את הפעילות בזמן שקבעתם. נסו להיות בה באמת: להסתכל, להקשיב, להרגיש.","כשהראש בורח למחשבות, החזירו את הקשב בעדינות למה שאתם עושים.","אחרי זה דרגו איך היה."],"feedback":[{"id":"pleasure","label":"כמה נהניתי"},{"id":"control","label":"כמה הרגשתי שליטה ויכולת"}]}]},{"stage_id":"m5-loops","title":"כשהראש חוזר על אותן מחשבות","clinical_title":"עבודה עם מחשבות חוזרות (רומינציה)","purpose":"להבחין בלולאות מחשבה ולהחזיר קשב לפעילות, בלי להילחם במחשבות.","patient_intro":["לפעמים הראש חוזר שוב ושוב על שאלות כמו \"למה זה קורה לי\" או \"מה אם\", בלי להגיע לתשובה. זה מרגיש כמו פתרון בעיה, אבל בדרך כלל זה רק מעמיק את הכבדות.","אי אפשר לבטל מחשבות בכוח. אפשר להבחין בהן, לתת להן שם, ולהחזיר את הקשב למה שעושים עכשיו.","מי שרוצה לחשוב על משהו חשוב יכול לקבוע לעצמו כמה דקות ביום, ולהניח לשאר היום."],"therapist_guidance":"מודול זה נכתב על סמך הצגת המושג בלבד ודורש בדיקה מקצועית. הבחינו עם המטופל/ת בין חשיבה שמובילה לפעולה לבין לולאה. אל תבקשו \"להפסיק לחשוב\". תרגלו מיקוד קשב ותזמון של זמן מחשבה.","provenance":{"source_forms":[10,11],"origin":"new-from-concept","depth":"titles-only"},"advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"m5-name","type":"exercise","prompt":"לתת שם ללולאה ולחזור לפעילות","instructions":["כשאתם מבחינים שהראש חוזר על אותו דבר, אמרו לעצמכם בשקט: \"זו שוב הלולאה\".","החזירו את הקשב לפעילות שלפניכם: לצלילים, לתחושת הידיים, למה שאתם רואים.","אם הלולאה חזרה, זה בסדר. זה תרגול, ולא מבחן."],"feedback":[{"id":"return","label":"כמה הצלחתי לחזור לפעילות"}]},{"task_id":"m5-time","type":"exercise","prompt":"זמן מחשבה קבוע של עשר דקות","instructions":["קבעו עשר דקות ביום שבהן מותר לחשוב על מה שמטריד, ורשמו מה עולה.","בשאר היום, כשהמחשבה מופיעה, אמרו \"אחשוב על זה בזמן שלי\" וחזרו לפעילות."]}]},{"stage_id":"m6-sleep","title":"שינה ואנרגיה","clinical_title":"שינה: סדר יום ושגרת הרגעה","purpose":"ליצור בסיס יציב יותר של שינה ושעות קבועות.","patient_intro":["שינה ואנרגיה קשורות מאוד. כשהשינה מתפזרת, האנרגיה והריכוז נפגעים, וכך גם מצב הרוח.","שעת קימה קבועה היא אחד הדברים שעוזרים ביותר, גם אחרי לילה לא טוב.","שגרת הרגעה קצרה לפני השינה, בלי מסך מאיר, עוזרת לגוף להבין שהגיע הזמן להאט."],"therapist_guidance":"מודול זה נכתב מעקרונות כלליים ודורש בדיקה מקצועית. במקרה של נדודי שינה משמעותיים שקלו התערבות ייעודית ובדיקה רפואית. התאימו שעות למטופל/ת ולמשמרות העבודה שלו/ה.","provenance":{"source_forms":[13],"origin":"new-general-principles","depth":"title-only"},"advance_condition":"4 השלמות רצופות","tasks":[{"task_id":"m6-wake","type":"exercise","prompt":"שעת קימה קבועה","instructions":"בחרו שעת קימה שאפשר לעמוד בה רוב הימים, ובדקו אם עמדתם בה היום."},{"task_id":"m6-wind","type":"exercise","prompt":"שגרת הרגעה של עשרים דקות לפני השינה","instructions":"הנמיכו אור, הניחו את הטלפון בצד, ועשו משהו רגוע: מקלחת חמה, קריאה שקטה או מוזיקה נעימה."}]},{"stage_id":"m7-keep","title":"להישאר בדרך","clinical_title":"מניעת הישנות ותוכנית המשך","purpose":"לשמור את מה שעבד, ולזהות מוקדם כשמצב הרוח מתחיל לרדת שוב.","patient_intro":["ימים פחות טובים יחזרו מדי פעם. זה חלק מהדרך, ולא סימן שהכול התבטל.","כדאי להכין מראש תוכנית פשוטה: מה הסימנים הראשונים שמצב הרוח יורד, מה עזר לי עד עכשיו, ומי יכול לתמוך בי.","ככל שמזהים מוקדם, קל יותר לחזור לצעדים הקטנים."],"therapist_guidance":"בנו תוכנית כתובה קצרה עם המטופל/ת: סימנים מוקדמים אישיים, שלושה צעדים שעזרו, איש קשר לתמיכה, ומתי לפנות אליכם או לגורם חירום. קבעו ביקורת המשך.","provenance":{"source_forms":[14],"origin":"new-general-principles","depth":"title-only"},"advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"m7-signs","type":"plan","prompt":"שלושה סימנים מוקדמים שלי","instructions":"מה אצלי משתנה ראשון כשמצב הרוח מתחיל לרדת? שינה, ביטולים, התרחקות, עצבנות? רשמו שלושה."},{"task_id":"m7-helped","type":"plan","prompt":"שלושה צעדים שעזרו לי","instructions":"רשמו שלושה דברים מהתוכנית שעזרו לכם, ושווה להמשיך."},{"task_id":"m7-support","type":"plan","prompt":"מי יכול לתמוך בי","instructions":"בחרו אדם אחד או שניים שאפשר לפנות אליהם, ורשמו מה תבקשו מהם."}]}],"reinforcement_pool":{"on_complete":["כל הכבוד. צעד קטן הוא צעד אמיתי.","עשית את זה, וזה מה שחשוב.","תודה שהתמדת. זה נחשב."],"on_attempt":["ניסיון הוא התקדמות. תודה שניסית.","גם ניסיון שלא יצא מושלם נחשב."],"on_skip":["בסדר גמור. אפשר לנסות מחר.","לפעמים צריך לדלג. נמשיך כשיהיה נוח."],"on_hard_day":["יש ימים קשים יותר, וזה חלק מהדרך.","תודה שאמרת. היום מספיק להיות עדינים עם עצמנו."]}},{"schema_version":"1.0","protocol_id":"dev-placeholder-exposure","protocol_version":"0.0.1","title":"[DEV] פרוטוקול דמה לפיתוח בלבד","target_population":"בדיקות פיתוח","approved_by":"DEV-PLACEHOLDER — not clinically reviewed","stages":[{"stage_id":"stage-1","title":"שלב בדיקה 1","advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"t1","type":"exercise","prompt":"[DEV] משימת דמה: תאר/י מצב יומיומי קל"},{"task_id":"t2","type":"exercise","prompt":"[DEV] משימת דמה: תרגיל נשימה של דקה"}]}],"reinforcement_pool":{"on_complete":["[DEV] כל הכבוד!"],"on_skip":["[DEV] ננסה שוב מחר."],"on_hard_day":["[DEV] יום קשה הוא חלק מהדרך."],"on_attempt":["[DEV] ניסיון נחשב."]},"track":"adult","persona":"jessie","patient_title":"תרגול לדוגמה"},{"schema_version":"1.0","protocol_id":"ocd-erp","protocol_version":"0.1.0-draft","title":"הפרעה טורדנית־כפייתית (OCD): חשיפה ומניעת תגובה","patient_title":"דאגנות ומחשבות חוזרות","track":"adult","persona":"jessie","target_population":"מבוגרים עם OCD, בליווי מטפל/ת מוסמך/ת","approved_by":"DRAFT — טרם נבדק קלינית","content_status":"draft-needs-clinical-review","sources":["אריאל חן, \"מטפלים בהפרעה טורדנית־כפייתית (OCD)\", חוברת העבודה למטופל (צעד צעד, CBT): טפסים 1–3 נקראו לעומק, טפסים 4–14 נקראו ברמת כותרות בלבד","הניסוח, הסדר והדוגמאות נכתבו מחדש; לא הועתק טקסט מהמקור"],"therapist_guide":{"goals":["להבין את מעגל האובססיה והכפייתיות, והדרך שבה כפייתיות מקלה לרגע ומחזקת את הבעיה","לנטר את המחשבות, ההתנהגויות והזמן שהן גוזלות","לבנות מדרג של טריגרים, אובססיות וכפייתיות","לתרגל חשיפה מדורגת ומניעת תגובה כפייתית, ולשאת ספק וחוסר ודאות","לשתף בני משפחה ולהפחית מתן אישורים והשתתפות בטקסים"],"components":["הסבר ומעגל אישי","ניטור עצמי","מדרג","מניעת תגובה","חשיפה במציאות ובדמיון","בני משפחה","מניעת הישנות"],"selection":"מתאים כשיש אובססיות וכפייתיות (פיזיות או מנטליות) והימנעות. בררו דיכאון משני ותובנה, והתחשבו בטיפול תרופתי מקביל.","adaptation":["תוכן האובססיות שונה בין אנשים (ניקיון, בדיקות, סדר, תוכן אלים או מיני, דתי, ספקנות, דימוי גוף). התאימו את התרגול לתוכן האישי.","החשיפה מתחילה ברמת מצוקה נמוכה עד בינונית ועולה בהדרגה, וכוללת מניעת תגובה כפייתית, כולל כפייתיות מנטלית ובקשת אישורים.","בתוכן רגיש (מיני, אלים, דתי) שקלו להיעזר באיש מקצוע או בגורם דתי מתאים."],"cautions":["משימות החשיפה והמניעה מבוצעות רק לפי מה שסוכם בפגישה. האפליקציה אינה בוחרת תרגילים ואינה כוללת תוכן חשיפה ספציפי.","הימנעו מלתת אישורים חוזרים. האפליקציה בכוונה אינה מרגיעה או מבררת ודאות.","האפליקציה אינה מזהה מצבי סיכון ואינה מתריעה."]},"progress_metrics":["זמן שהוקדש לכפייתיות (לפי רישום)","מצוקה לפני ואחרי כל תרגול (0–10)","דחף לבצע כפייתיות לפני ואחרי (0–10)","מספר תרגולים שבוצעו"],"coverage_notes":["טפסים 4–14 נקראו ברמת כותרות בלבד (מדרגים, מניעת התנהגות כפייתית, חשיפות, בני משפחה, מניעת הישנות). המודולים הללו נכתבו כשלד עקרוני ודורשים השלמה ובדיקה.","לא נכתבו רעיונות חשיפה ספציפיים, מתוך שיקול קליני."],"stages":[{"stage_id":"o1-understand","title":"מחשבות שנתקעות, והרגלים שמרגיעים לרגע","clinical_title":"הסבר פסיכו־חינוכי: מעגל אובססיה–כפייתיות","purpose":"להבין איך מחשבות שנתקעות והרגלים מרגיעים מזינים זה את זה.","patient_intro":["לכל האנשים יש לפעמים מחשבות מוזרות או לא נעימות שקופצות לראש. רוב האנשים מניחים להן לעבור. אצל חלק מהאנשים הן נתקעות, מפחידות ומובילות לספקות.","מה שמבדיל הוא בעיקר המשמעות שנותנים למחשבה: \"אם חשבתי על זה, זה אומר משהו\".","כדי להפחית את הלחץ, אנשים עושים פעולות: לבדוק, לנקות, לספור, לשאול, לחזור על משפטים או לבדוק בראש. זה מרגיע לרגע, ואז הספק חוזר, והצורך לחזור על הפעולה גדל.","המעגל הזה נשבר דרך שינוי הדרך שבה מגיבים למחשבות, לאט ובליווי של המטפל/ת."],"therapist_guidance":"הציגו את המעגל על דוגמה אישית. הדגישו שהבעיה אינה במחשבות עצמן אלא במשמעות שניתנת להן ובמאמצי הסילוק. הסבירו שהמטרה אינה להפסיק לחשוב אלא לא לפעול לפי הדחף.","provenance":{"source_forms":[1,2],"origin":"adapted","depth":"full"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"o1-read","type":"read","prompt":"קראתי את ההסבר ועצרתי לחשוב על מה שמוכר לי ממנו"},{"task_id":"o1-example","type":"reflect","prompt":"דוגמה אחת מהימים האחרונים","instructions":"רשמו: מה הייתה המחשבה או הדחף? מה עשיתי כדי להקל? כמה זמן זה לקח? מה קרה אחר כך?"}]},{"stage_id":"o2-monitor","title":"רושמים בלי לשנות","clinical_title":"ניטור עצמי","purpose":"לראות את התמונה המדויקת: מתי, מה ובאיזה מחיר.","patient_intro":["בימים הראשונים רק מתבוננים. בכל פעם שמבצעים התנהגות כפייתית או נמנעים ממשהו, רושמים בקצרה מה הפעיל אותה, מה הייתה המחשבה או הדחף, מה עשיתי וכמה זמן זה לקח.","אין צורך לשנות כלום עדיין. כשמתבוננים, כבר מתחיל שינוי."],"therapist_guidance":"בימים הראשונים רק ניטור, בלי ניסיון לוותר על הכפייתיות. עברו על הרישומים בפגישה.","provenance":{"source_forms":[3],"origin":"adapted","depth":"full"},"advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"o2-log","type":"log","prompt":"רישום קצר","instructions":"רשמו משפט קצר לכל סעיף: הטריגר, המחשבה או הדחף, מה עשיתי, כמה זמן. אחר כך דרגו את המצוקה.","feedback":[{"id":"distress","label":"עוצמת המצוקה"}]}]},{"stage_id":"o3-ladder","title":"סולם של מצבים ומחשבות","clinical_title":"מדרג טריגרים ואובססיות, ואיתור כפייתיות","purpose":"לסדר את מה שמטריד מהקל אל הכבד, כבסיס לצעדים הבאים.","patient_intro":["נבנה יחד סולם: מצבים ומחשבות שמעוררים מצוקה, מהקל אל הכבד, ולצידם ההרגלים שמקלים עליהם.","הסולם עוזר לבחור צעד מתאים, ולא להתחיל מהקשה ביותר."],"therapist_guidance":"בנו עם המטופל/ת מדרג טריגרים, מדרג אובססיות ורשימת התנהגויות כפייתיות (פיזיות ומנטליות) עם דירוג. כללו את ההימנעויות. בטופס המקור נעשה שימוש בסולם 0–100.","provenance":{"source_forms":[4,5,6],"origin":"new-general-principles","depth":"titles-only"},"advance_condition":"1 השלמות רצופות","tasks":[{"task_id":"o3-ladder","type":"plan","therapist_directed":true,"prompt":"הסולם שלי","instructions":"רשמו מצבים ומחשבות שמעוררים מצוקה, ולכל אחד דרגה מ-0 עד 10 ומה אתם עושים כדי להקל. הביאו לפגישה הבאה."}]},{"stage_id":"o4-hold","title":"לעמוד בלי לבצע","clinical_title":"מניעת התנהגות כפייתית","purpose":"ללמוד שהדחף עולה ויורד גם בלי לבצע את ההרגל.","patient_intro":["כשעולה דחף לבצע הרגל מרגיע, אפשר לנסות להמתין. הדחף בדרך כלל עולה, מגיע לשיא ויורד, גם בלי לבצע.","מתחילים בצעד קטן: לדחות, לקצר או לשנות את ההרגל, וממשיכים בהדרגה.","הדבר החשוב הוא לא לחפש הרגעה או ודאות, אלא לאפשר לספק להיות שם."],"therapist_guidance":"הכינו עם המטופל/ת תוכנית דרגתית למניעת תגובה. בררו גם כפייתיות מנטלית ובקשות אישור מקרובים.","provenance":{"source_forms":[7],"origin":"new-general-principles","depth":"title-only"},"advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"o4-delay","type":"exposure","therapist_directed":true,"prompt":"המתנה לפני ההרגל שסוכם","instructions":"בצעו רק את מה שסוכם עם המטפל/ת: להמתין, לקצר או לוותר על הרגל מסוים. דרגו את הדחף לפני ואחרי.","feedback":[{"id":"urge_before","label":"עוצמת הדחף לפני"},{"id":"urge_after","label":"עוצמת הדחף אחרי"}]}]},{"stage_id":"o5-practice","title":"תרגול מדורג","clinical_title":"חשיפה במציאות ובדמיון","purpose":"להתנסות בהדרגה במה שמטריד, ולהישאר איתו בלי להקל בכפייתיות.","patient_intro":["בשלב הזה מתרגלים להיות עם מה שמטריד, בדרגה שמתאימה לכם, כשלא מבצעים את ההרגל.","התרגול נבחר ומסוכם עם המטפל/ת. האפליקציה רק מלווה אתכם בביצוע ובמעקב."],"therapist_guidance":"מודול זה הוא שלד עקרוני. התוכן הספציפי (במציאות ובדמיון) נקבע בפגישה בהתאם לתוכן האישי, בדרג מצוקה מתאים. אין רעיונות חשיפה ספציפיים באפליקציה.","provenance":{"source_forms":[8,9,10,11],"origin":"new-general-principles","depth":"titles-only"},"advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"o5-do","type":"exposure","therapist_directed":true,"prompt":"התרגול שסוכם עם המטפל/ת","instructions":"בצעו את התרגול שסוכם, הישארו בו לפי הזמן שתכננתם, ודרגו לפני, בשיא ואחרי.","feedback":[{"id":"before","label":"מצוקה לפני"},{"id":"peak","label":"מצוקה בשיא"},{"id":"after","label":"מצוקה אחרי"}]}]},{"stage_id":"o6-family","title":"המשפחה והסביבה","clinical_title":"בני משפחה: תמיכה בלי השתתפות בטקסים ובלי אישורים","purpose":"לגייס תמיכה ולהפחית את מה שמקבע את הכפייתיות.","patient_intro":["אנשים קרובים רוצים לעזור, ולפעמים עוזרים בדרך שמחזקת את ההרגל: עונים שוב ושוב לשאלות, משתתפים בטקסים או מקלים על הימנעות.","אפשר לשוחח איתם ולהסכים על דרך תמיכה אחרת."],"therapist_guidance":"שיתוף בני משפחה לפי שיקול דעתכם. מודול זה נקרא ברמת כותרות ודורש בדיקה.","provenance":{"source_forms":[12,13],"origin":"new-general-principles","depth":"titles-only"},"advance_condition":"1 השלמות רצופות","tasks":[{"task_id":"o6-talk","type":"plan","prompt":"שיחה עם אדם קרוב","instructions":"חשבו על אדם אחד שמעורב, ורשמו איך הייתם רוצים שיתמוך בכם ומה לא יעזור."}]},{"stage_id":"o7-keep","title":"להישאר בדרך","clinical_title":"מניעת הישנות","purpose":"להמשיך להתאמן, ולהתמודד עם חזרה של מחשבות.","patient_intro":["גם אחרי שיפור, מחשבות מוכרות יחזרו לפעמים. זה לא אומר שהכול מתחיל מחדש.","מה שעוזר הוא להמשיך להגיב אליהן כמו שלמדתם: להבחין, לא לבצע, ולחזור לחיים."],"therapist_guidance":"בנו תוכנית כתובה: סימנים מוקדמים לחזרה של כפייתיות, צעדים לפעולה, ובדיקה ממושכת.","provenance":{"source_forms":[14],"origin":"new-general-principles","depth":"title-only"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"o7-signs","type":"plan","prompt":"הסימן המוקדם שלי","instructions":"מה משתנה אצלי כשההרגלים מתחילים לחזור?"},{"task_id":"o7-step","type":"plan","prompt":"מה אעשה","instructions":"רשמו שלושה צעדים שאעשה כשאזהה את הסימן, וממי אבקש תמיכה."}]}],"reinforcement_pool":{"on_complete":["כל הכבוד. עמדת בלי לבצע, וזה לא קל.","עשית את זה, וזה מה שנחשב.","תודה שהתמדת."],"on_attempt":["ניסיון הוא התקדמות. תודה שניסית.","גם ניסיון חלקי נחשב."],"on_skip":["בסדר גמור. אפשר לנסות בהזדמנות הבאה."],"on_hard_day":["יש ימים קשים יותר, וזה חלק מהדרך.","תודה שאמרת. היום מספיק להיות עדינים עם עצמנו."]}},{"schema_version":"1.0","protocol_id":"panic-agoraphobia-cbt","protocol_version":"0.1.0-draft","title":"הפרעת פאניקה ואגורפוביה (CBT)","patient_title":"סימפטומים גופניים לחרדה רגעית","track":"adult","persona":"jessie","target_population":"מבוגרים עם התקפי פאניקה והימנעות ממקומות, בליווי מטפל/ת מוסמך/ת","approved_by":"DRAFT — טרם נבדק קלינית","content_status":"draft-needs-clinical-review","sources":["אריאל חן, \"מטפלים בפאניקה\", חוברת העבודה למטופל (צעד צעד, CBT): טפסים 1–5 נקראו לעומק, טפסים 6–13 נקראו ברמת כותרות בלבד","הניסוח, הסדר והדוגמאות נכתבו מחדש; לא הועתק טקסט מהמקור"],"therapist_guide":{"goals":["להבין את מעגל הפאניקה: טריגר, תחושות גוף, פרשנות אסונית, התנהגות ביטחון והימנעות","לשנות את התגובה לתחושות: קבלה והפניית קשב, במקום מאבק ובריחה","לבנות מדרג של מקומות ומצבים נמנעים ולהיחשף אליהם בהדרגה","לתרגל חשיפה לתחושות גופניות מפחידות, בהנחיית המטפל/ת"],"components":["הסבר ומעגל אישי","תגובה לגל חרדה","מעקב התקפים","מיפוי הימנעות","חשיפה במציאות","חשיפה לתחושות גוף","נשימה","מניעת הישנות"],"selection":"מתאים כשיש התקפי פאניקה חוזרים וחרדת ציפייה, עם או בלי הימנעות. ודאו שנעשתה בדיקה רפואית שלא העלתה סיבה רפואית לתסמינים.","adaptation":["קצב וסדר לפי המטופל/ת. אפשר לדלג על מודולים ולהחליף סדר.","ניסויים לבחינת אמונות (לדוגמה פעילות גופנית מאומצת, עמידה בסחרחורת) מתוכננים בפגישה בלבד, ולאחר התייחסות למצב הבריאותי."],"cautions":["ודאו בירור רפואי לפני התחלה, בייחוד כשיש תסמינים בחזה, בלב או בנשימה.","טכניקות פרדוקסליות (לבקש מהגל להתחזק, לעשות את ההפך ממה שהגוף דוחף אליו) והחשיפה לתחושות גוף מבוצעות רק בהנחיית המטפל/ת. האפליקציה אינה מנחה אותן באופן עצמאי.","נשימה מבוקרת עלולה להפוך להתנהגות ביטחון. החליטו אם ואיך להשתמש בה.","האפליקציה אינה מזהה מצבי סיכון ואינה מתריעה."]},"progress_metrics":["מספר גלי חרדה ועוצמתם המרבית (0–10)","מספר חשיפות שבוצעו","מצוקה לפני, בשיא ואחרי (0–10)","רשימת מקומות ומצבים שחזרו לשגרה"],"coverage_notes":["טפסים 6–13 (מדרג חשיפה, תכנון ומעקב חשיפות, חשיפה לתחושות גופניות, קרובים, נשימה מבוקרת, מניעת הישנות) נקראו ברמת כותרות בלבד. התוכן שלהם נכתב מעקרונות כלליים ודורש בדיקה.","טכניקות של המקור הכוללות הוראות פרדוקסליות ישירות למטופל/ת (כגון ניסיון לעורר התעלפות) לא נוסחו כהנחיה עצמאית, ומסורות להחלטת המטפל/ת."],"stages":[{"stage_id":"p1-understand","title":"מה קורה בגוף כשהחרדה מגיעה בבת אחת","clinical_title":"הסבר: פאניקה, אזעקת שווא ומעגל הפאניקה","purpose":"להבין שתחושות חזקות בגוף הן לא סימן לסכנה, ומה מחזיק אותן.","patient_intro":["לפעמים החרדה מגיעה בבת אחת: הלב דופק, קשה לנשום, מסתחרר, מזיע או מרגיש מנותק. זה מפחיד מאוד, ואנשים רבים חושבים שקורה משהו מסוכן.","הגוף שלנו מצויד במערכת אזעקה. כשיש סכנה אמיתית היא עוזרת לנו להגיב. לפעמים היא נדלקת בלי סכנה, כמו אזעקת שווא. התחושות אמיתיות, אבל הן לא מסוכנות.","מה שמחזק אותן הוא בעיקר הפחד מהן: אנחנו מסתכלים על הגוף כל הזמן, מפרשים כל שינוי כסכנה, ונמנעים ממקומות שבהם זה קרה. כך נוצר מעגל.","מומלץ לוודא עם רופא שאין סיבה רפואית לתחושות. אחרי זה, אפשר ללמוד להגיב אליהן אחרת."],"therapist_guidance":"וודאו בירור רפואי. הציגו את המעגל על התקף אחרון של המטופל/ת. בררו אמונות כמו \"אמות\", \"אתעלף\", \"אשתגע\" לצורך בחינה בהמשך.","provenance":{"source_forms":[1],"origin":"adapted","depth":"full"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"p1-read","type":"read","prompt":"קראתי את ההסבר ועצרתי לחשוב על מה שמוכר לי ממנו"},{"task_id":"p1-example","type":"reflect","prompt":"הפעם האחרונה שזה קרה","instructions":"רשמו בקצרה: מה קדם לזה? מה הרגשתי בגוף? מה חשבתי שיקרה? מה עשיתי?"}]},{"stage_id":"p2-respond","title":"איך להגיב כשהגל מגיע","clinical_title":"תגובה להתקף: קבלה והפניית קשב","purpose":"לשנות את התגובה לתחושות, ממאבק לקבלה.","patient_intro":["כשהגל מגיע, הדחף הטבעי הוא להילחם בו, לנסות לשכנע את עצמנו שהכול בסדר או לברוח. לרוב זה מגביר את התחושות.","אפשר לנסות לשנות את התגובה: לומר לעצמכם \"זה גל, הוא יעבור\", להרגיש אותו כמה שניות, ואז להחזיר את הקשב למה שעשיתם קודם.","אם התחושות חוזרות, חוזרים על זה. אחרי גל חזק, ייתכן שהגוף יישאר מתוח זמן מה. אפשר לתת לו להתפוגג ולהמשיך כרגיל.","התרגול הזה לא מחליף בדיקה רפואית. אם משהו נראה שונה ממה שהכרתם, או שהתחושות חדשות, פנו לרופא."],"therapist_guidance":"תרגלו את העמדה בפגישה. טכניקות פרדוקסליות (לבקש מהגל להתחזק, לעשות את ההפך ממה שהגוף דוחף אליו) יוצגו ויתורגלו רק בפגישה ולאחר התייחסות למצב הרפואי. האפליקציה אינה מנחה אותן.","provenance":{"source_forms":[2],"origin":"adapted","depth":"full"},"advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"p2-practice","type":"exercise","prompt":"התגובה החדשה לתחושה מפחידה","instructions":["כשמופיעה תחושה מפחידה בגוף, אמרו לעצמכם: \"זו תחושה, היא לא מסוכנת\".","תנו לה להיות כמה שניות, ואז החזירו את הקשב למה שאתם עושים.","דרגו אחר כך כמה הצלחתם לא להילחם."],"feedback":[{"id":"accept","label":"כמה הצלחתי לא להילחם בתחושה"}]}]},{"stage_id":"p3-track","title":"מעקב אחרי הגלים","clinical_title":"מעקב אחר התקפי פאניקה","purpose":"להכיר את הטריגרים, התחושות והמחשבות, כדי להתמודד איתם בצורה מדויקת.","patient_intro":["כדי להתמודד עם משהו, כדאי להכיר אותו. כשמקליטים מה קרה, אפשר לראות מה מפעיל גלים, מה הגוף עושה, ומה אנחנו חושבים ועושים.","מומלץ לרשום קרוב לזמן האירוע: איפה הייתי, מה קדם, מה הרגשתי בגוף, מה חשבתי שיקרה, ומה עשיתי.","הרישום הזה הוא כלי למידה, ולא מבחן."],"therapist_guidance":"בקשו תיעוד של הגלים. בדקו טריגרים (מצב, תחושה, רגש, מחשבה), פרשנות אסונית והתנהגויות ביטחון. חשבו גם על חרדת ציפייה בין הגלים.","provenance":{"source_forms":[3,4],"origin":"adapted","depth":"full"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"p3-log","type":"log","prompt":"רישום של גל חרדה","instructions":"רשמו: איפה הייתי? מה קדם לזה? מה הרגשתי בגוף? מה חשבתי שיקרה? מה עשיתי? אחר כך דרגו את עוצמת הפחד המרבית.","feedback":[{"id":"fear","label":"עוצמת הפחד המרבית"}]}]},{"stage_id":"p4-avoid","title":"מקומות ומצבים שאני נמנע/ת מהם","clinical_title":"מיפוי הימנעויות והתנהגויות ביטחון ובניית מדרג","purpose":"לזהות מה הצטמצם בחיים, ומה אני עושה כדי להרגיש בטוח/ה.","patient_intro":["כשהחרדה נקשרת למקומות, אנחנו מתחילים להימנע מהם: קניון, תחבורה, נהיגה, להיות לבד, מעלית או פעילות גופנית.","כשאי אפשר להימנע, יש דברים קטנים שאנחנו עושים כדי להרגיש בטוחים: בקבוק מים, טלפון ביד, ללכת עם אדם מסוים או להישאר ליד היציאה.","בשלב הזה רק מזהים ומרכזים. הרשימה תהפוך לסולם צעדים."],"therapist_guidance":"בנו עם המטופל/ת מדרג של מצבים והדרגת מצוקה. כללו פעילויות שמזכירות תחושות (מאמץ, התרגשות).","provenance":{"source_forms":[6],"origin":"adapted","depth":"title-only"},"advance_condition":"1 השלמות רצופות","tasks":[{"task_id":"p4-ladder","type":"plan","therapist_directed":true,"prompt":"הסולם שלי","instructions":["רשמו מצבים ומקומות שאתם נמנעים מהם או נכנסים אליהם רק עם \"ביטחון\".","ליד כל אחד דרגו מ-0 עד 10 כמה לחץ הוא יעורר, ורשמו מה אתם עושים כדי להרגיש בטוחים.","הביאו אותו לפגישה הבאה."]}]},{"stage_id":"p5-places","title":"צעד אחר צעד אל מקומות","clinical_title":"חשיפה במציאות מדורגת","purpose":"ללמוד מהניסיון שהמקומות בטוחים ושאפשר להתמודד.","patient_intro":["חשיפה היא כניסה הדרגתית למקומות ולמצבים שהימנעתם מהם, בלי התנהגויות הביטחון, ובהישארות מספיק זמן.","בכל פעם בוחרים צעד אחד מהסולם, מסכמים אותו מראש ומתרגלים אותו כמה פעמים.","החרדה צפויה להופיע, והיא נחלשת כשנשארים. הרעיון הוא להתאמן, ולא לעבור מבחן."],"therapist_guidance":"תכננו כל חשיפה: מצב, משך, ביטול התנהגויות ביטחון, ניסוח משפט תומך. חזרו עליה כמה פעמים לפני שעוברים לצעד הבא. בצעו חלק מהחשיפות יחד בפגישה.","provenance":{"source_forms":[5,6,7,8],"origin":"adapted","depth":"partial"},"advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"p5-do","type":"exposure","therapist_directed":true,"prompt":"ביצוע חשיפה שסוכמה","instructions":["בצעו את הצעד שסוכם עם המטפל/ת, בלי התנהגויות ביטחון מוסכמות, והישארו עד סוף הזמן שתכננתם.","דרגו לפני, בשיא ואחרי."],"feedback":[{"id":"before","label":"לחץ לפני"},{"id":"peak","label":"לחץ בשיא"},{"id":"after","label":"לחץ אחרי"}]}]},{"stage_id":"p6-body","title":"תחושות גוף שאני מפחד/ת מהן","clinical_title":"חשיפה לתחושות גופניות (בהנחיית המטפל/ת)","purpose":"ללמוד שתחושות הגוף עצמן אינן מסוכנות.","patient_intro":["גם התחושות עצמן, למשל דופק מוגבר או סחרחורת קלה, יכולות להפחיד. כשמתרגלים להרגיש אותן בצורה מבוקרת, מגלים שהן לא מסוכנות.","תרגילים כאלה נעשים רק אחרי שסיכמתם עם המטפל/ת מה לעשות ומתי. אל תתחילו אותם בעצמכם."],"therapist_guidance":"מודול זה מיועד להנחיה בפגישה בלבד ודורש בדיקה מקצועית. בחרו תחושות שרלוונטיות למטופל/ת, התחשבו במצב הבריאותי, והגדירו מראש אורך ותדירות. האפליקציה אינה מציעה תרגילים ספציפיים.","provenance":{"source_forms":[9],"origin":"new-general-principles","depth":"title-only"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"p6-do","type":"exposure","therapist_directed":true,"prompt":"התרגול שסוכם עם המטפל/ת","instructions":"בצעו רק את מה שסוכם, ודרגו לפני, בשיא ואחרי.","feedback":[{"id":"before","label":"לחץ לפני"},{"id":"peak","label":"לחץ בשיא"},{"id":"after","label":"לחץ אחרי"}]}]},{"stage_id":"p7-breath","title":"נשימה רגועה","clinical_title":"נשימה מבוקרת (כלי עזר, ולא התנהגות ביטחון)","purpose":"ללמוד כלי הרגעה כללי, בלי להפוך אותו לתנאי להתמודדות.","patient_intro":["נשימה איטית ורגועה היא כלי טוב להרגעה ולהפחתת מתח כללי.","חשוב להשתמש בה כתרגול יומי, ולא כדי \"להציל\" את עצמכם מגל חרדה. ככל שנשענים עליה כדי להימנע מהתחושות, היא יכולה להחזיק את החרדה."],"therapist_guidance":"מודול זה נכתב מעקרונות כלליים ודורש בדיקה. החליטו אם להשתמש בנשימה, ואיך למנוע שתהפוך להתנהגות ביטחון.","provenance":{"source_forms":[12],"origin":"new-general-principles","depth":"title-only"},"advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"p7-breathe","type":"exercise","prompt":"שלוש דקות של נשימה איטית","instructions":"שבו בנוחות. שאפו דרך האף כמה שניות, ונשפו לאט. המשיכו שלוש דקות, והחזירו את הקשב לנשימה כשהוא נודד.","feedback":[{"id":"calm","label":"כמה הרגשתי רגוע/ה אחרי"}]}]},{"stage_id":"p8-keep","title":"להישאר בדרך","clinical_title":"מניעת הישנות","purpose":"להמשיך להתקדם, ולהתמודד עם גלים שחוזרים.","patient_intro":["גל חרדה יכול לחזור מדי פעם, במיוחד בתקופות מתוחות. זה לא אומר שחזרתם לנקודת ההתחלה.","מה שעוזר הוא להמשיך לתרגל, להישאר במקומות, ולהגיב לתחושות בקבלה."],"therapist_guidance":"בנו תוכנית כתובה קצרה: מה עוזר, אילו מקומות להמשיך לתרגל, מה לעשות כשגל חוזר, ומתי לפנות.","provenance":{"source_forms":[13],"origin":"new-general-principles","depth":"title-only"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"p8-places","type":"plan","prompt":"מקומות להמשיך לתרגל","instructions":"רשמו שלושה מקומות או מצבים שחשוב לכם להמשיך להיות בהם."},{"task_id":"p8-plan","type":"plan","prompt":"מה אעשה כשגל חוזר","instructions":"רשמו שלושה דברים שעזרו לכם, כולל אדם שאפשר לפנות אליו."}]}],"reinforcement_pool":{"on_complete":["כל הכבוד. עוד צעד אל מקום שהיה קשה.","עשית את זה, וזה מה שנחשב.","תודה שהתמדת."],"on_attempt":["ניסיון הוא התקדמות. תודה שניסית.","גם ניסיון חלקי נחשב."],"on_skip":["בסדר גמור. אפשר לנסות בהזדמנות הבאה."],"on_hard_day":["יש ימים קשים יותר, וזה חלק מהדרך.","תודה שאמרת. היום מספיק להיות עדינים עם עצמנו."]}},{"schema_version":"1.0","protocol_id":"ptsd-cbt","protocol_version":"0.1.0-draft","title":"הפרעה פוסט־טראומטית (PTSD), כולל אבל טראומטי כתוספת","patient_title":"ליווי תסמינים טראומטיים","track":"adult","persona":"jessie","target_population":"מבוגרים עם תסמינים פוסט־טראומטיים, בליווי מטפל/ת מוסמך/ת בעל ניסיון בטראומה","approved_by":"DRAFT — טרם נבדק קלינית","content_status":"draft-needs-clinical-review","sources":["אריאל חן, \"מטפלים בפוסט־טראומה (PTSD)\", כולל טיפול באבל טראומטי, חוברת העבודה למטופל (צעד צעד, CBT): טפסים 1 ו-1א׳ נקראו לעומק חלקי, טפסים 2–11 נקראו ברמת כותרות בלבד","הניסוח, הסדר והדוגמאות נכתבו מחדש; לא הועתק טקסט מהמקור"],"therapist_guide":{"goals":["הבנה של תגובות לאחר אירוע טראומטי, ושל תפקיד ההימנעות בשימורן","מעקב אחר תסמינים בארבעת האשכולות: חודרנות, הימנעות, עוררות יתר, שינויים בחשיבה ובמצב הרוח","חשיפה הדרגתית במציאות לטריגרים ולפעילויות נמנעות","חשיפה בדמיון, בהובלת המטפל/ת בלבד","עבודה על אמונות יסוד, כעס, ובמקרה הצורך אבל טראומטי"],"components":["הסבר","מעקב תסמינים","מדרג טריגרים","חשיפה במציאות","חשיפה בדמיון (בהובלת המטפל/ת)","כעס","אבל טראומטי (אופציונלי)","מניעת הישנות"],"selection":"מתאים לאחר אירוע טראומטי עם תסמינים מתמשכים. הטיפול המומלץ מתנהל על ידי מטפל/ת מיומן/ת בטראומה. בררו יציבות, סיכון, שימוש בחומרים ודיכאון משני.","adaptation":["הקצב נקבע על ידי המטפל/ת. אפשר להתחיל בהסבר, מעקב ופעילויות נעימות לפני חשיפה.","מודול האבל הטראומטי הוא אופציונלי ומיועד למי שאיבד אדם קרוב בנסיבות טראומטיות.","ייתכן שלא כל המודולים מתאימים לכל מטופל/ת."],"cautions":["האפליקציה אינה כוללת תיאור של אירוע טראומטי, ואינה מכווינה כתיבה או הקלטה של סיפור הטראומה. זה נעשה רק בפגישה, בהובלת המטפל/ת.","חשיפה בדמיון עלולה להעלות מצוקה זמנית. המטפל/ת קובע/ת את הקצב, ויש להבהיר למטופל/ת שאפשר לעצור ולפנות לעזרה.","בבדיקת סיכון: בררו מחשבות אובדניות ושימוש בחומרים. האפליקציה אינה מזהה מצבי סיכון ואינה מתריעה."]},"progress_metrics":["מגמת מצוקה בתסמינים (0–10) לפי מעקב","מספר חשיפות במציאות שבוצעו","מצוקה לפני, בשיא ואחרי (0–10)","חזרה לפעילויות שנמנעו מהן"],"coverage_notes":["טפסים 2–11 נקראו ברמת כותרות בלבד. הם נכתבו כשלד עקרוני.","לא נכתב תוכן של חשיפה בדמיון, מתוך שיקול קליני.","מודול האבל הטראומטי נכתב על סמך מבוא בלבד."],"stages":[{"stage_id":"t1-understand","title":"להבין תגובות אחרי אירוע קשה","clinical_title":"הסבר פסיכו־חינוכי על פוסט־טראומה","purpose":"להבין למה הגוף והראש ממשיכים להגיב, ומה יכול לעזור.","patient_intro":["אחרי אירוע קשה במיוחד, כמעט כל אחד מרגיש תגובות: זיכרונות שחוזרים, חלומות, מתח, קושי בשינה, עצבנות או רצון להתרחק. אצל רוב האנשים הן נחלשות עם הזמן.","כשהן נמשכות, זה לא סימן חולשה. לפעמים נראה כאילו הראש עדיין מחכה לסכנה, וגירוי קטן כמו ריח או רעש מחזיר אותנו לשם.","התרחקות ממה שמזכיר את האירוע מקלה לרגע, אבל מחזיקה את התגובות לאורך זמן, ומצמצמת את החיים.","אין צורך לספר כאן מה קרה. התוכנית מתמקדת בהבנה, במעקב ובחזרה הדרגתית לחיים, יחד עם המטפל/ת."],"therapist_guidance":"הציגו את התסמינים בארבעת האשכולות והסבירו את תפקיד ההימנעות. הבהירו שאין צורך לספר את האירוע באפליקציה. בררו סיכון ושימוש בחומרים.","provenance":{"source_forms":[1],"origin":"adapted","depth":"partial"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"t1-read","type":"read","prompt":"קראתי את ההסבר ועצרתי לחשוב על מה שמוכר לי ממנו"},{"task_id":"t1-reflect","type":"reflect","prompt":"מה אני מזהה אצלי","instructions":"בלי לספר את האירוע, רשמו אילו תגובות מוכרות לכם: זיכרונות שחוזרים, התרחקות מדברים, מתח או קושי בשינה, שינוי במחשבות על עצמכם או על העולם."}]},{"stage_id":"t2-track","title":"מעקב אחרי תסמינים","clinical_title":"מעקב תסמינים: חודרנות, הימנעות, עוררות יתר, שינויים בחשיבה","purpose":"לראות מתי ומה מעורר תגובות, ולעקוב אחר שינוי.","patient_intro":["כשרושמים כשהתגובות מופיעות, אפשר לראות מה מעורר אותן, ומה עוזר.","כתבו בקצרה: מה עורר את התגובה, איך הרגשתי, כמה חזק, ומה עשיתי אחר כך.","אין צורך לתאר את האירוע. מספיק לרשום מה קרה היום."],"therapist_guidance":"עברו על הרישומים. זהו טריגרים ודפוסי הימנעות, ושימו לב לעוררות יתר ולהפרעות שינה.","provenance":{"source_forms":[2],"origin":"new-general-principles","depth":"title-only"},"advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"t2-log","type":"log","prompt":"רישום קצר של התגובות היום","instructions":"בכמה מילים: מה עורר? מה הרגשתי? מה עשיתי? דרגו את עוצמת המצוקה.","feedback":[{"id":"distress","label":"עוצמת המצוקה"}]}]},{"stage_id":"t3-avoid","title":"דברים שהתרחקתי מהם","clinical_title":"זיהוי הימנעויות וטריגרים, ובניית מדרג","purpose":"למפות מה נעשה קשה, ולבחור צעדים הדרגתיים.","patient_intro":["אחרי אירוע קשה, אנשים נוטים להתרחק ממקומות, אנשים, פעילויות או מחשבות שמזכירים אותו, וגם מדברים שהיו נעימים בעבר.","כאן מתבוננים בלי שיפוט. אילו דברים הפסקתי לעשות? מה אני נמנע/ת ממנו?","מהרשימה הזו נבנה סולם צעדים הדרגתי יחד עם המטפל/ת."],"therapist_guidance":"בנו מדרג משותף. שלבו פעילויות נעימות שנעלמו. התחילו מצעדים בדרגה נמוכה עד בינונית והתאימו לקצב.","provenance":{"source_forms":[4],"origin":"new-general-principles","depth":"title-only"},"advance_condition":"1 השלמות רצופות","tasks":[{"task_id":"t3-ladder","type":"plan","therapist_directed":true,"prompt":"הרשימה שלי","instructions":"רשמו מקומות, פעילויות ומצבים שאתם נמנעים מהם, ולכל אחד דרגה מ-0 עד 10. הביאו לפגישה הבאה."}]},{"stage_id":"t4-return","title":"צעדים חזרה לחיים","clinical_title":"חשיפה במציאות והפעלה התנהגותית","purpose":"לחזור בהדרגה למקומות ולפעילויות, וללמוד שאפשר.","patient_intro":["חזרה הדרגתית למה שהתרחקתם ממנו עוזרת לגוף ולראש ללמוד שהמצב בטוח עכשיו.","בוחרים צעד אחד מהסולם, מתכננים אותו עם המטפל/ת, ומתרגלים אותו. החזרה לפעילויות שהיו נעימות מועילה גם למצב הרוח.","אפשר לעצור בכל רגע. אם הקושי גדול מדי, חוזרים לצעד קטן יותר ומדברים עם המטפל/ת."],"therapist_guidance":"שלבו חשיפה במציאות לטריגרים עם חזרה לפעילויות נעימות ומעגלי חיים (עבודה, קשרים). וודאו שהמטופל/ת יודע/ת שאפשר לעצור.","provenance":{"source_forms":[3,4,5,6],"origin":"new-general-principles","depth":"titles-only"},"advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"t4-do","type":"exposure","therapist_directed":true,"prompt":"הצעד שסוכם עם המטפל/ת","instructions":"בצעו רק את הצעד שסוכם. אם הקושי גדול מדי, אפשר לעצור ולפנות למטפל/ת. דרגו לפני, בשיא ואחרי.","feedback":[{"id":"before","label":"מצוקה לפני"},{"id":"peak","label":"מצוקה בשיא"},{"id":"after","label":"מצוקה אחרי"}]},{"task_id":"t4-good","type":"exercise","prompt":"פעילות נעימה אחת","instructions":"בחרו פעילות קטנה שהייתה נעימה לפני האירוע, ונסו אותה.","feedback":[{"id":"pleasure","label":"כמה נהניתי"}]}]},{"stage_id":"t5-talk","title":"לשוחח על מה שקרה, בקצב ובליווי","clinical_title":"חשיפה בדמיון (בהובלת המטפל/ת בלבד)","purpose":"לעבד את הזיכרון בהדרגה, בקצב מוגן.","patient_intro":["בשלב מסוים, המטפל/ת עשויים להציע לשוחח על מה שקרה, בתנאים בטוחים ובקצב שמתאים לכם.","זה נעשה רק בפגישות, ובהתאם לתוכנית שנקבעה איתם. כאן, האפליקציה לא מבקשת מכם לכתוב או להקליט את האירוע.","אם עולה מצוקה חזקה, אפשר לעצור ולפנות לעזרה."],"therapist_guidance":"מודול זה מיועד להובלה על ידי המטפל/ת בלבד, ואינו כולל תוכן. תכננו בפגישה אם ומתי להקליט או להאזין, והגדירו מראש מה עושים אם המצוקה חזקה. מומלץ לבדוק מצב לפני ואחרי.","provenance":{"source_forms":[7],"origin":"new-general-principles","depth":"title-only"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"t5-do","type":"exposure","therapist_directed":true,"prompt":"התרגול שסוכם עם המטפל/ת, אם סוכם","instructions":"בצעו רק את מה שסוכם, ועצרו אם הקושי גדול מדי. דרגו לפני, בשיא ואחרי.","feedback":[{"id":"before","label":"מצוקה לפני"},{"id":"peak","label":"מצוקה בשיא"},{"id":"after","label":"מצוקה אחרי"}]}]},{"stage_id":"t6-anger","title":"כעס","clinical_title":"התמודדות עם כעס ומיומנויות לניהולו","purpose":"להכיר את הכעס ולהגיב אליו בצורה שמשרתת אותי.","patient_intro":["אחרי אירוע קשה, כעס הוא דבר שכיח. הוא יכול להרגיש חזק, ולפעמים הוא פוגע בקשרים.","אפשר ללמוד לזהות מוקדם, לעצור לרגע ולבחור איך להגיב."],"therapist_guidance":"מודול זה נכתב מעקרונות כלליים ודורש בדיקה. טפסים 9–10 במקור נקראו ברמת כותרות בלבד. שקלו התאמה אם הכעס מרכזי.","provenance":{"source_forms":[9,10],"origin":"new-general-principles","depth":"titles-only"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"t6-notice","type":"reflect","prompt":"הסימן המוקדם שלי לכעס","instructions":"מה אני מרגיש/ה בגוף ובמחשבות כשהכעס מתחיל לעלות?"},{"task_id":"t6-pause","type":"exercise","prompt":"הפסקה קצרה","instructions":"כשהכעס עולה, עצרו לכמה שניות, נשמו לאט ובחרו תגובה. אם צריך, התרחקו לרגע.","feedback":[{"id":"control","label":"כמה הצלחתי להגיב כמו שרציתי"}]}]},{"stage_id":"t7-grief","title":"געגוע וכאב על אובדן","clinical_title":"תוספת אבל טראומטי (אופציונלי)","purpose":"ליצור מקום לכאב ולגעגוע, לצד חזרה לחיים.","patient_intro":["כשהאירוע כלל אובדן של אדם קרוב, הכאב על האובדן והתגובות לאירוע מתערבבים.","מותר להרגיש כאב וגעגוע, ומותר גם להרגיש רגעים של הקלה או חיוך. אלה לא סותרים את האהבה.","זיכרון של מי שאהבתם יכול להישאר איתכם, וגם החיים יכולים להימשך."],"therapist_guidance":"מודול זה אופציונלי, מיועד למי שאיבד אדם קרוב בנסיבות טראומטיות. נכתב על סמך מבוא בלבד, ודורש בדיקה. התאימו לקצב המטופל/ת, ובדקו סיכון.","provenance":{"source_forms":["1א"],"origin":"adapted","depth":"intro-only"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"t7-remember","type":"reflect","prompt":"דבר אחד שאני רוצה לזכור","instructions":"רשמו משפט אחד על משהו טוב שקשור למי שאהבתם, אם בא לכם."},{"task_id":"t7-life","type":"plan","prompt":"צעד אחד לחיים","instructions":"בחרו פעילות אחת קטנה שאפשר לעשות השבוע, גם לצד הכאב."}]},{"stage_id":"t8-keep","title":"להישאר בדרך","clinical_title":"סיום הטיפול ומניעת הישנות","purpose":"לשמור את מה שעזר, ולדעת מה לעשות כשתגובות חוזרות.","patient_intro":["תגובות עשויות לחזור בתקופות לחוצות או בתאריכים משמעותיים. זה טבעי.","מה שעוזר הוא להמשיך בצעדים שלמדתם, להישאר בקשר עם אנשים, ולפנות לעזרה מוקדם."],"therapist_guidance":"בנו תוכנית כתובה: טריגרים צפויים, צעדים שעזרו, אנשי תמיכה, ומתי לפנות אליכם או לגורם חירום.","provenance":{"source_forms":[11],"origin":"new-general-principles","depth":"title-only"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"t8-helped","type":"plan","prompt":"מה עזר לי","instructions":"רשמו שלושה דברים שעזרו, ושווה להמשיך."},{"task_id":"t8-support","type":"plan","prompt":"למי אפנה","instructions":"רשמו אדם או שניים שאפשר לפנות אליהם, ומה אבקש מהם."}]}],"reinforcement_pool":{"on_complete":["כל הכבוד. עוד צעד קטן, וזה נחשב.","עשית את זה, וזה מה שחשוב.","תודה שהתמדת."],"on_attempt":["ניסיון הוא התקדמות. תודה שניסית.","גם ניסיון חלקי נחשב."],"on_skip":["בסדר גמור. אפשר לחזור לזה בקצב שלך."],"on_hard_day":["יש ימים קשים יותר, וזה חלק מהדרך.","תודה שאמרת. היום מספיק להיות עדינים עם עצמנו."]}},{"schema_version":"1.0","protocol_id":"social-anxiety-cbt","protocol_version":"0.1.0-draft","title":"חרדה חברתית (CBT)","patient_title":"התערבויות חברתיות","track":"adult","persona":"jessie","target_population":"מבוגרים עם חרדה חברתית, בליווי מטפל/ת מוסמך/ת","approved_by":"DRAFT — טרם נבדק קלינית","content_status":"draft-needs-clinical-review","sources":["אריאל חן, \"מטפלים בחרדה חברתית\", חוברת העבודה למטופל (צעד צעד, CBT): טפסים 1–12 נקראו לעומק, טפסים 13–18 נקראו ברמת כותרות בלבד","הניסוח, הסדר והדוגמאות נכתבו מחדש; לא הועתק טקסט מהמקור"],"therapist_guide":{"goals":["להבין את מעגל החרדה החברתית האישי: אמונות, תחזיות, מיקוד פנימי, הימנעות והתנהגויות ביטחון","להפנות קשב החוצה ולוותר בהדרגה על התנהגויות ביטחון","לבחון תחזיות בניסויים התנהגותיים מדורגים, עם מטרות התנהגותיות שאפשר לראות אם הושגו","לבנות שינוי בעמדה כלפי החרדה: חרדה צפויה בחשיפה, ואינה אויב"],"components":["הסבר ומעגל אישי","מיקוד חיצוני","זיהוי התנהגויות ביטחון","מדרג מצבים","חשיפות במציאות","מיומנויות חברתיות","מניעת הישנות"],"selection":"מתאים כמרכיב עיקרי כשהקושי המרכזי הוא פחד מהערכה שלילית ומצבים חברתיים. בדקו דיכאון משני וסיכון.","adaptation":["המדרג וסדר החשיפות נקבעים איתכם. התחילו ברמת מצוקה בינונית, לא בקשה ביותר.","מטרות התנהגותיות (למשל \"לשאול שתי שאלות\") עדיפות על מטרות כלליות כמו \"להרגיש בטוח\".","חשיפות ארוכות וחוזרות יעילות יותר מחשיפה בודדת. מומלץ לתכנן חזרות.","חשיפה בדמיון (טופס 11) וזיכרונות כואבים (טופס 12) לא נכללו בטיוטה ונתונים להחלטה קלינית."],"cautions":["האפליקציה אינה מזהה מצבי סיכון ואינה מתריעה.","משימות החשיפה מבוצעות רק לפי מה שסוכם בפגישה. האפליקציה אינה בוחרת עבור המטופל/ת מצבים מאתגרים.","הימנעו מחשיפות שעלולות לפגוע בפועל במטופל/ת או באחרים."]},"progress_metrics":["מספר ניסויים חברתיים שבוצעו","מצוקה לפני, בשיא ואחרי (0–10) בכל ניסוי","האם המטרה ההתנהגותית הושגה","מגמת מצב רוח בצ'ק-אין היומי"],"coverage_notes":["טפסים 13–18 (אסרטיביות, דיבור מול קהל, ביקורת, שיחה, קרובים, מניעת הישנות) נקראו ברמת כותרות. המודולים המתאימים נכתבו מעקרונות כלליים ודורשים בדיקה.","חשיפה בדמיון וזיכרונות כואבים לא נכללו.","המדרג של המקור נעשה בסולם 0–100. כאן נעשה שימוש בסולם 0–10 לנוחות המטופל/ת."],"stages":[{"stage_id":"s1-understand","title":"מה קורה בנו כשאנחנו עם אנשים","clinical_title":"הסבר פסיכו־חינוכי: מעגל החרדה החברתית","purpose":"להבין למה מצבים חברתיים מלחיצים, ומה שומר על הלחץ.","patient_intro":["הרבה אנשים מתביישים או נלחצים במפגשים עם אחרים. זה נפוץ מאוד, ויש לזה הסבר.","כשהלחץ גבוה, הקשב הולך פנימה: אנחנו בודקים איך אנחנו נראים, מה אנחנו אומרים והאם רואים עלינו שאנחנו לחוצים. בגלל זה קשה יותר להקשיב לאדם שמולנו, וקל יותר להיתקע.","כדי להרגיש בטוחים, אנחנו נוטים להימנע או לעשות דברים קטנים שנותנים ביטחון, כמו להסתכל בטלפון, להכין משפטים מראש או לעמוד בצד. אלה מקלים לרגע, אבל הם מונעים מאיתנו לגלות שהפחד היה מוגזם.","התוכנית הזו עוזרת לנסות דברים מעט אחרת, בצעדים קטנים ובקצב שלכם."],"therapist_guidance":"בנו עם המטופל/ת את המעגל האישי על דוגמה אחת קונקרטית: מצב, תחזית, תחושות גוף, מיקוד, התנהגות ביטחון, מה קרה אחר כך.","provenance":{"source_forms":[1,2,3,4],"origin":"adapted","depth":"full"},"advance_condition":"2 השלמות רצופות","tasks":[{"task_id":"s1-read","type":"read","prompt":"קראתי את ההסבר ועצרתי לחשוב על מה שמוכר לי ממנו"},{"task_id":"s1-example","type":"reflect","prompt":"מצב אחד מהזמן האחרון","instructions":["חשבו על מפגש אחד עם אנשים שהלחיץ אתכם.","רשמו: מה חששתי שיחשבו עליי? מה הרגשתי בגוף? מה עשיתי כדי להתמודד? ומה קרה בפועל?"]}]},{"stage_id":"s2-attention","title":"להוציא את הקשב החוצה","clinical_title":"מיקוד חיצוני","purpose":"לתרגל קשב לסביבה ולאדם שמולי, במקום מעקב אחרי עצמי.","patient_intro":["הקשב נוטה ללכת פנימה כשאנחנו לחוצים. זה טבעי. המטרה היא לא לשלוט בו, אלא להחזיר אותו החוצה, שוב ושוב, בעדינות.","בשיחה, נסו להתעניין במה שהאדם אומר, לשאול אותו שאלות ולשים לב לפרטים. ברחוב, נסו להבחין בצבעים, בצלילים ובאנשים.","זה תרגול כמו כל תרגול. ככל שחוזרים אליו, הוא נעשה קל יותר."],"therapist_guidance":"תרגלו בפגישה: לשוחח תוך מיקוד חיצוני ואז תוך מיקוד פנימי, והשוו את החוויה. אל תבקשו \"לא להסתכל פנימה\" אלא להחזיר קשב.","provenance":{"source_forms":[5],"origin":"adapted","depth":"full"},"advance_condition":"3 השלמות רצופות","tasks":[{"task_id":"s2-talk","type":"exercise","prompt":"שיחה אחת עם קשב החוצה","instructions":["בשיחה קצרה עם אדם, כוונו את הקשב למה שהוא אומר, וחזרו אליו כשהקשב נודד.","אחרי השיחה דרגו עד כמה הצלחתם להישאר בחוץ."],"feedback":[{"id":"outward","label":"כמה הצלחתי להישאר עם הקשב בחוץ"}]},{"task_id":"s2-walk","type":"exercise","prompt":"הליכה קצרה, פעם עם קשב פנימה ופעם עם קשב החוצה","instructions":["בהליכה אחת התמקדו באיך אתם נראים. בהליכה השנייה התמקדו בסביבה.","שימו לב מה השתנה ברגשות ובהתנהגות."]}]},{"stage_id":"s3-safety","title":"דברים שאני נאחז/ת בהם","clinical_title":"זי   try {
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(s.iv) }, dataKey, unb64(s.ct));
    const d = JSON.parse(new TextDecoder().decode(pt));
    const p = JSON.parse(d.planJson);
    const proto = PROTOCOLS.find((x) => x.protocol_id === p.protocol_ref.protocol_id && x.protocol_version === p.protocol_ref.protocol_version);
    if (validatePlan(p) || !proto) throw new Error("state");
    plan = p; planJson = d.planJson; protocol = tailorProtocol(proto, p); progress = d.progress;
  } catch { announce("לא הצלחנו לפתוח את המידע השמור במכשיר הזה. אפשר למחוק אותו בהגדרות ולייבא את התוכנית מחדש.", true); }
}

/** Shared by file import and plan links. Returns { ok } or { ok:false, error, stale }. */
async function importPlanText(text) {
  if (!publisher) return { ok: false, error: "כדי לפתוח תוכנית צריך קודם להצטרף דרך קישור ההצטרפות שהמטפל/ת שלחו. בקשו מהם קישור חדש אם צריך." };
  const r = await importPlanFile(text, {
    privateKey: device.privateKey,
    publisherPublicRaw: publisher.publicRaw,
    installedVersion: (id) => (plan && plan.plan_id === id ? plan.plan_version : null),
    findProtocol: (id, ver) => PROTOCOLS.find((p) => p.protocol_id === id && p.protocol_version === ver) || null,
  });
  if (!r.ok) return { ok: false, error: r.error, stale: r.code === "stale" };
  const sameLine = plan && plan.plan_id === r.plan.plan_id;
  plan = r.plan; planJson = r.planJson; protocol = r.protocol;
  if (!sameLine || !progress) progress = newProgress();
  else if (progress.stageIndex >= protocol.stages.length) progress.stageIndex = protocol.stages.length - 1;
  if (joinedInfo) { joinedInfo = null; await kvSet("joined", null); }
  await saveState();
  return { ok: true };
}

function ring(frac, size = 92) {

  svg.append(mk("var(--lilac)", `${c} ${c}`), mk("var(--accent)", `${c * frac} ${c}`));

async function record(taskId, status, skipGate = false) {
  if (!skipGate && !(await ackGate())) return;
  try {
    const r = recordResult(protocol, plan, progress, taskId, status);
    const before = progress.stageIndex;
    progress = r.progress;
    const task = currentStage(protocol, { ...progress, stageIndex: before }).tasks.find((x) => x.task_id === taskId);
    pendingFb = task && task.feedback && (status === "COMPLETE" || status === "ATTEMPT") ? { taskId } : null;
    await saveState();
    announce((r.message ? txt(r.message) : "נרשם. תודה.") + (progress.stageIndex > before ? " עברתם לשלב הבא." : ""));
  } catch (e) { announce(e.message, true); }
  show();
}

async function initIdentity() {
  device = await kvGet("device");
  if (!device) { device = await createDeviceIdentity(); await kvSet("device", device); }
  dataKey = await kvGet("dataKey");
  if (!dataKey) { dataKey = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]); await kvSet("dataKey", dataKey); }
  publisher = (await kvGet("publisher")) || null;
  invite = (await kvGet("invite")) || null;
  joinPending = (await kvGet("pendingJoin")) || null;
  joinedInfo = (await kvGet("joined")) || null;
}

  if (!h) return;
  history.replaceState(null, "", location.pathname + location.search);
  try {
    if (h.kind === "join") {
      const p = parseInvite(h.value);
      if (publisher && publisher.publicRaw === p.pub && (plan || joinedInfo)) { announce("אתם כבר מחוברים למטפל/ת הזה."); return; }
      joinPending = p; await kvSet("pendingJoin", p);
    } else if (h.kind === "plan") {
      const r = await importPlanText(JSON.stringify(parsePlanLink(h.value)));
      if (r.ok) { tab = "today"; announce("התוכנית שלכם מוכנה. בהצלחה!"); }
      else if (r.stale) announce("התוכנית הזו כבר אצלכם.");
      else announce(r.error, true);
    } else announce("הקישור הזה מיועד למטפל/ת. בקשו מהמטפל/ת קישור אישי חדש.", true);
  } catch (e) { announce(e.message, true); }
}
(async () => {
  if (!globalThis.crypto || !crypto.subtle) { $("boot").textContent = "הדפדפן או ההקשר הנוכחי לא תומכים בהצפנה הנדרשת (נדרש הקשר מאובטח). נסו דפדפן עדכני."; return; }
  idb = await openDb();
  if (idb) {
    // Verify that non-extractable keys survive structured clone; otherwise fall back to memory-only.
    try { await kvSet("probe", await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, false, ["encrypt"])); storageMode = "indexeddb"; }
    catch { idb = null; }
  }
  await initIdentity();
  await loadState();
  await handleLink();
  if (plan && progress && !demo) { const e = dailyOpenEntry(progress.ledger); if (e) { progress = { ...progress, ledger: [...(progress.ledger || []), e] }; await saveState(); } }
  show();
  addEventListener("hashchange", async () => { await handleLink(); show(); }); // link tapped while the app is already open
})().catch((e) => { $("boot").hidden = false; $("boot").textContent = "שגיאה בטעינת הממשק: " + e.message; });
</script>

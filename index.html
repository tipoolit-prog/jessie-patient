async function record(taskId, status, skipGate = false) {
  if (!skipGate && !(await ackGate())) return;
  try {
    const r = recordResult(protocol, plan, progress, taskId, status);
    const before = progress.stageIndex;
    progress = r.progress;
    const task = currentStage(protocol, { ...progress, stageIndex: before }).tasks.find((x) => x.task_id === taskId);
    if (status === "HARD_DAY") jessicaSuggest = true;
    pendingFb = task && task.feedback && (status === "COMPLETE" || status === "ATTEMPT") ? { taskId } : null;
    await saveState();
    announce((r.message ? txt(r.message) : "נרשם. תודה.") + (progress.stageIndex > before ? " עברתם לשלב הבא." : ""));
  } catch (e) { announce(e.message, true); }
  show();
}

function renderProgress() {
  const v = $("v-progress"); reset(v);
  const s = summarize(progress);
  v.append(el("div", { class: "card" }, el("h2", { text: "ההתקדמות שלי" }),
    el("p", { text: `עד עכשיו: ${s.completed} פעמים שביצעתי והצלחתי, ${s.attempted} פעמים שניסיתי, ב-${s.activeDays} ימים שונים.` }),
    el("p", { class: "muted", text: `${s.skipped} פעמים דילגתי · ${s.hardDays} ימים קשים. כל אלה חלק מהדרך — אין כאן ציונים.` }),
    el("p", { text: `שלב נוכחי: ${txt(currentStage(protocol, progress).title)} (${progress.stageIndex + 1} מתוך ${protocol.stages.length})` }),
    el("p", { text: `⭐ ${pts(s.points)}. כל ניסיון נחשב, וגם הצלחה היא רק תוספת קטנה.` })));
  v.append(el("div", { class: "card" }, el("h3", { text: "איך הייתי בימים האחרונים" }), moodChart()));
  const fa = feedbackAverages(progress), names = { pleasure: "הנאה", control: "שליטה ויכולת", return: "חזרה לפעילות" };
  const fk = Object.keys(fa).filter((k) => names[k]);
  if (fk.length) v.append(el("div", { class: "card" }, el("h3", { text: "מה למדתי על עצמי" }),
    el("ul", {}, fk.map((k) => el("li", { text: `${names[k]}: ממוצע ${fa[k].avg} מתוך 10 (${fa[k].n} דיווחים)` }))),
    el("p", { class: "muted", text: "אלה רק מספרים תיאוריים. הם לא ציון, והם יכולים לעזור לראות מה מועיל." })));
  const recent = [...progress.logs].reverse().slice(0, 30);
  v.append(el("div", { class: "card" }, el("h3", { text: "הרישומים האחרונים" }),
    recent.length ? el("ul", {}, recent.map((l) => el("li", { text: `${fmt(l.at)} — ${STATUS_HE[l.status]}` }))) : el("p", { class: "muted", text: "עדיין אין רישומים." })));
}

function jessicaCard() {
  const st = jState();
  return el("div", { class: "card" }, el("h2", { text: "ג'סיקה" }),
    el("p", { class: "muted", text: "ג'סיקה היא הפוגה קצרה של סקרנות והומור, למי שרוצה רגע של מרחק ממחשבות. היא לא תחליף לטיפול, ואף פעם לא קופצת מעצמה." }),
    el("p", { text: `שימוש: ${st.uses} פעמים, מהן ${st.helped} שעזרו.` }),
    el("div", { class: "row" },
      btn(st.hidden ? "להחזיר את ג'סיקה" : "להסתיר את ג'סיקה", async () => { await jSave({ ...st, hidden: !st.hidden }); show(); }, "secondary"),
      btn("להתחיל מחדש את הפריטים שכבר ראיתי", async () => { await jSave({ ...st, seen: [] }); show(); }, "secondary")));
}

function remindersCard() {
  const times = remTimes().slice();
  const list = el("div", {});
  const msg = el("p", { class: "muted", role: "status" });
  const draw = () => {
    list.replaceChildren(...times.map((t, i) => el("div", { class: "row", style: "align-items:center;margin-top:.3rem" },
      el("input", { type: "time", value: t, "aria-label": "שעת תזכורת " + (i + 1), style: "flex:0 0 9rem", onchange: (e) => { times[i] = e.target.value; } }),
      times.length > 1 ? btn("הסרה", () => { times.splice(i, 1); draw(); }, "secondary") : null)));
  };
  draw();
  return el("div", { class: "card" }, el("h2", { text: "מתי להזכיר לי" }),
    el("p", { class: "muted", text: "המטפל/ת המליצו על שעת התחלה, ומכאן הבחירה שלכם: אפשר לשנות, להוסיף ולהסיר. השעות משמשות את כפתורי היומן." }),
    list, msg,
    el("div", { class: "row" },
      btn("הוספת שעה", () => { if (times.length < 6) { times.push("20:00"); draw(); } }, "secondary"),
      btn("שמירת השעות", async () => {
        if (!times.length || !times.every((t) => TIME_RE.test(t))) { msg.className = "err"; msg.textContent = "בחרו שעה תקינה בכל שורה."; return; }
        prefs = { ...prefs, reminder_times: [...new Set(times)].sort() }; await saveState(); msg.className = "ok"; msg.textContent = "נשמר. כפתורי היומן יעודכנו.";
      })));
}

function renderSettings() {
  const v = $("v-settings"); reset(v);
  if (plan) v.append(remindersCard());
  if (plan && jessicaEnabled(plan)) v.append(jessicaCard());

  if (plan) {
    const pw = el("input", { type: "password", id: "repPw", autocomplete: "new-password", "aria-label": "סיסמה להצפנת הדוח" });
    const inc = el("input", { type: "checkbox", id: "incNotes", style: "width:1.4rem;height:1.4rem;min-height:0" });
    const incJ = el("input", { type: "checkbox", id: "incJessica", style: "width:1.4rem;height:1.4rem;min-height:0" });
    const jOpt = () => ({ includeNotes: inc.checked, ...(jessicaEnabled(plan) && incJ.checked ? { jessicaUsage: { uses: jState().uses, helped: jState().helped } } : {}) });
    const rk = plan.customizations.report_key;
    async function exportForTherapist(mode) {
      const file = await encryptReportFor(buildReport(plan, protocol, progress, new Date(), jOpt()), rk);
      const name = "jessie-report.enc.json", text = JSON.stringify(file);
      if (mode === "share" && navigator.canShare) {
        const f = new File([text], name, { type: "application/json" });
        if (navigator.canShare({ files: [f] })) {
          try { await navigator.share({ files: [f], title: "הדוח שלי מג'סי" }); announce("הדוח מוכן לשליחה"); return; } catch (e) { if (e && e.name === "AbortError") return; }
        }
      }
      download(name, text, "application/json"); announce("הדוח המוצפן נשמר כקובץ. אפשר לשלוח אותו למטפל/ת.");
    }
    if (rk) v.append(el("div", { class: "card" }, el("h2", { text: "שליחת דוח למטפל/ת" }),
      el("p", { class: "muted", text: "הדוח מוצפן כך שרק המטפל/ת יוכלו לפתוח אותו. אין סיסמה לזכור או למסור. הוא כולל תאריכים, סולמות מספריים וסטטוס משימות. התשובות החופשיות לא נכללות." }),
      el("label", { class: "ack", for: "incNotes" }, inc, el("span", { text: "לכלול בדוח גם את ההערות ש״רציתי להביא לפגישה״" })),
      jessicaEnabled(plan) ? el("label", { class: "ack", for: "incJessica" }, incJ, el("span", { text: "לכלול בדוח כמה פעמים השתמשתי בג'סיקה ואם זה עזר (מספרים בלבד)" })) : null,
      el("div", { class: "row" }, btn("שליחה למטפל/ת", () => exportForTherapist("share")), btn("הורדה כקובץ", () => exportForTherapist("download"), "secondary"))));
    const legacyCard = el("div", { class: rk ? "" : "card" }, el("h2", { text: rk ? "ייצוא עם סיסמה (מתקדם)" : "ייצוא דוח למטפל/ת" }),
      el("p", { class: "muted", text: "הדוח נוצר רק כשאתם מבקשים, ונשמר כקובץ במכשיר. האפליקציה לא שולחת אותו לשום מקום — אתם בוחרים אם וכיצד להעביר אותו. הדוח מכיל את תאריכי הרישומים, שמות המשימות והסטטוס שלהן." }),
      el("label", { for: "repPw", text: "סיסמה להצפנת הדוח (מומלץ; יש למסור אותה למטפל/ת בנפרד מהקובץ)" }), pw,
      el("label", { class: "ack", for: "incNotes" }, inc, el("span", { text: "לכלול בדוח גם את ההערות ש״רציתי להביא לפגישה״" })),
      jessicaEnabled(plan) ? el("label", { class: "ack", for: "incJessica" }, incJ, el("span", { text: "לכלול בדוח כמה פעמים השתמשתי בג'סיקה ואם זה עזר (מספרים בלבד)" })) : null,
      el("div", { class: "row" },
        btn("ייצוא דוח מוצפן", async () => {
          if (pw.value.length < 8) { announce("הסיסמה חייבת להכיל לפחות 8 תווים", true); return; }
          download("jessie-report.enc.json", JSON.stringify(await sealReport(buildReport(plan, protocol, progress, new Date(), jOpt()), pw.value)), "application/json");
          announce("הדוח המוצפן נשמר כקובץ");
        }),
        btn("ייצוא דוח קריא (לא מוצפן)", () => {
          if (!confirm("הדוח הקריא אינו מוצפן ומכל מי שיקבל את הקובץ אפשר יהיה לקרוא אותו. להמשיך?")) return;
          download("jessie-report.json", JSON.stringify(buildReport(plan, protocol, progress, new Date(), jOpt()), null, 2), "application/json");
        }, "secondary")));
    v.append(rk ? el("details", { class: "card" }, el("summary", { text: "אפשרויות מתקדמות" }), legacyCard) : legacyCard);
    if (!demo) v.append(importCard("ייבוא עדכון לתוכנית"));
  }

  const rp = el("input", { type: "password", id: "openPw", autocomplete: "off", "aria-label": "סיסמת הדוח" });
  const rf = el("input", { type: "file", accept: ".json,application/json", "aria-label": "קובץ דוח מוצפן" });
  const rOut = el("pre", { class: "mono", hidden: "" });
  const rMsg = el("p", { class: "muted", "aria-live": "polite" });
  rf.onchange = async () => {
    rOut.hidden = true; rMsg.textContent = "";
    try {
      const rep = await openReport(JSON.parse(await rf.files[0].text()), rp.value);
      rOut.textContent = JSON.stringify(rep, null, 2); rOut.hidden = false; rMsg.className = "ok"; rMsg.textContent = "הדוח נפתח";
    } catch (e) { rMsg.className = "err"; rMsg.textContent = e instanceof SyntaxError ? "הקובץ פגום" : e.message; }
    rf.value = "";
  };
  v.append(el("div", { class: "card" }, el("h2", { text: "פתיחת דוח מוצפן" }),
    el("p", { class: "muted", text: "למטפל/ת: אפשר לפתוח כאן דוח שהתקבל מהמטופל/ת. הפענוח נעשה במכשיר, בלי אינטרנט." }),
    el("label", { for: "openPw", text: "סיסמה" }), rp, rf, rMsg, rOut));

  v.append(el("div", { class: "card" }, el("h2", { text: "מידע חשוב על הליווי" }),
    el("p", { class: "muted", text: "הליווי כאן נועד לשימוש עם מטפל/ת מוסמך/ת, ואינו תחליף לטיפול נפשי ולליווי אנושי. אישרתם זאת בפעם הראשונה." }),
    btn("קריאה שוב", async () => { await showAck(); }, "secondary")));
  v.append(el("div", { class: "card" }, el("h2", { text: "אבטחה ופרטיות — מה חשוב לדעת" }),
    el("ul", {}, [
      "המידע נשמר רק בדפדפן הזה, במכשיר הזה, ומוצפן במפתח שאי אפשר לייצא. עם זאת, המפתח שמור באותו דפדפן — מי שיש לו גישה לחשבון המשתמש במכשיר או לדפדפן עשוי להגיע למידע. לכן מומלץ לנעול את המכשיר.",
      "אין שרת, אין חשבונות, אין אנליטיקה ואין שליחת מידע. אין אפשרות למחוק או לנעול מרחוק.",
      "פתיחת הקובץ ישירות מהדיסק (file://) מתנהגת אחרת בדפדפנים שונים: ב-Chrome כל הקבצים המקומיים חולקים אותו מקור, ולכן אין להפעיל קבצי HTML לא מהימנים באותו דפדפן.",
      "גרסה ראשונה, לא עברה בדיקת אבטחה מקצועית — אין להסתמך עליה כעל הגנה מלאה.",
    ].map((t) => el("li", { text: t })))));

  if (demo) { v.append(el("div", { class: "card" }, el("h2", { text: "מצב הדגמה" }), el("p", { text: "מחיקת נתונים ושינוי מפתחות אינם זמינים בהדגמה, כדי שלא ייפגע מידע אמיתי. יציאה מההדגמה מוחקת את הנתונים הפיקטיביים מהזיכרון." }), btn("יציאה מהדגמה", exitDemo))); return; }
  const del = el("div", { class: "card" }, el("h2", { text: "מחיקת הנתונים המקומיים" }),
    el("p", { text: "המחיקה תסיר מהדפדפן הזה לצמיתות: התוכנית, כל רישומי ההתקדמות, מפתח המטפל/ת שהוגדר, וקוד השאלון שהוזן, והמפתחות של המכשיר (קוד ההצמדה ייווצר מחדש וישתנה). לא יימחקו: קבצים שכבר שמרתם במכשיר (כמו דוחות שייצאתם וקובץ התוכנית שקיבלתם), ומה שמצוי אצל המטפל/ת." }));
  del.append(btn("מחיקת כל הנתונים", async () => {
    if (!confirm("למחוק את כל הנתונים המקומיים? לא ניתן לשחזר.")) return;
    await kvClear(); plan = planJson = protocol = progress = publisher = joinPending = joinedInfo = ackRecord = null; prefs = {}; tab = "today";
    await initIdentity(); announce("הנתונים נמחקו"); show();
  }, "danger"));
  v.append(del);
}

// ---------- Boot ----------
async function initIdentity() {
  device = await kvGet("device");
  if (!device) { device = await createDeviceIdentity(); await kvSet("device", device); }
  dataKey = await kvGet("dataKey");
  if (!dataKey) { dataKey = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]); await kvSet("dataKey", dataKey); }
  publisher = (await kvGet("publisher")) || null;
  invite = (await kvGet("invite")) || null;
  joinPending = (await kvGet("pendingJoin")) || null;
  joinedInfo = (await kvGet("joined")) || null;
  ackRecord = (await kvGet("ack")) || null;
}

// Links from WhatsApp. The fragment is read once and removed from the address bar; it never reaches a server.
async function handleLink() {
  const h = parseHash(location.hash);
  if (!h) return;
  history.replaceState(null, "", location.pathname + location.search);
  try {
    if (h.kind === "join") {
      const p = parseInvite(h.value);
      if (publisher && publisher.publicRaw === p.pub && (plan || joinedInfo)) { announce("אתם כבר מחוברים למטפל/ת הזה."); return; }
      joinPending = p; await kvSet("pendingJoin", p);
    } else if (h.kind === "plan") {
      const r = await importPlanText(JSON.stringify(parsePlanLink(h.value)));
      if (r.ok) { tab = "today"; announce("התוכנית שלכם מוכנה. בהצלחה!"); }
      else if (r.stale) announce("התוכנית הזו כבר אצלכם.");
      else announce(r.error, true);
    } else announce("הקישור הזה מיועד למטפל/ת. בקשו מהמטפל/ת קישור אישי חדש.", true);
  } catch (e) { announce(e.message, true); }
}
(async () => {
  if (!globalThis.crypto || !crypto.subtle) { $("boot").textContent = "הדפדפן או ההקשר הנוכחי לא תומכים בהצפנה הנדרשת (נדרש הקשר מאובטח). נסו דפדפן עדכני."; return; }
  idb = await openDb();
  if (idb) {
    // Verify that non-extractable keys survive structured clone; otherwise fall back to memory-only.
    try { await kvSet("probe", await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, false, ["encrypt"])); storageMode = "indexeddb"; }
    catch { idb = null; }
  }
  await initIdentity();
  await loadState();
  await handleLink();
  if (plan && progress && !demo) { const e = dailyOpenEntry(progress.ledger); if (e) { progress = { ...progress, ledger: [...(progress.ledger || []), e] }; await saveState(); } }
  show();
  addEventListener("hashchange", async () => { await handleLink(); show(); }); // link tapped while the app is already open
})().catch((e) => { $("boot").hidden = false; $("boot").textContent = "שגיאה בטעינת הממשק: " + e.message; });
</script>
